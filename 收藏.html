function jget(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var MAP = {};
IDX.forEach(function(r){ if (!MAP[r[0]]) MAP[r[0]] = r; });

function collect(){
  var st = jget(KEY) || {}, groups = {}, miss = [];
  Object.keys(st).forEach(function(tag){
    if (!st[tag]) return;
    var r = MAP[tag];
    if (!r) { miss.push(tag); return; }
    (groups[r[3]] = groups[r[3]] || []).push(r);
  });
  return { groups: groups, miss: miss, total: Object.keys(st).filter(function(k){return st[k];}).length };
}

function render(){
  var d = collect(), sum = document.getElementById("sum"), list = document.getElementById("list");
  var names = Object.keys(d.groups);
  if (!names.length){
    sum.innerHTML = '<div class="line">还没有收藏。<b>0</b> 道</div>';
    list.innerHTML = '<div class="empty"><b>收藏夹是空的</b>在各章题号右边点一下 ☆ 就会进来。</div>';
    return;
  }
  sum.innerHTML = '共 <b>' + d.total + '</b> 道　分布在 <b>' + names.length + '</b> 个文档';
  var h = [];
  names.sort();
  names.forEach(function(nm){
    var rows = d.groups[nm];
    h.push('<div class="grp"><div class="gh">' + esc(nm)
      + '<span class="cnt">' + rows.length + ' 道</span></div>');
    rows.forEach(function(r){
      var href = esc(r[1]) + (r[2] ? "#" + esc(r[2]) : "");
      h.push('<div class="it"><a href="' + href + '" style="display:flex;gap:10px;flex:1 1 auto;'
        + 'color:inherit;text-decoration:none"><span class="no">' + esc(r[0]) + '</span>'
        + '<span class="tx">' + esc(r[4] || "") + '</span></a>'
        + '<button class="del" data-t="' + esc(r[0]) + '" title="取消收藏">&times;</button></div>');
    });
    h.push('</div>');
  });
  if (d.miss.length){
    h.push('<div class="grp"><div class="gh" style="color:#a8332a">找不到的收藏'
      + '<span class="cnt">' + d.miss.length + ' 条</span></div>'
      + '<div class="it"><span class="tx">题目标签变了（题干改过名？），这几条无法定位：'
      + esc(d.miss.join("、")) + '</span></div></div>');
  }
  list.innerHTML = h.join("");
  list.querySelectorAll(".del").forEach(function(b){
    b.onclick = function(){
      var t = this.getAttribute("data-t"), st = jget(KEY) || {};
      delete st[t];
      try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){}
      render();
    };
  });
}

document.getElementById("exp").onclick = function(){
  var d = collect();
  if (!d.total){ alert("收藏夹是空的。"); return; }
  var out = ["851 收藏　" + new Date().toLocaleString(), ""], names = Object.keys(d.groups);
  names.sort();
  names.forEach(function(nm){
    out.push("【" + nm + "】");
    d.groups[nm].forEach(function(r){ out.push("  " + r[0] + "　" + (r[4] || "")); });
    out.push("");
  });
  var blob = new Blob([out.join("\n")], {type: "text/plain;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "851收藏.txt";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
};

document.getElementById("clr").onclick = function(){
  if (!confirm("清空全部收藏？")) return;
  try { localStorage.removeItem(KEY); } catch(e){}
  render();
};

render();

    openT = setTimeout(function(){ if (tab.matches(':hover')) open(); }, 150);
  });
  tab.addEventListener('mouseleave', function(){ clearTimeout(openT); });
  el.addEventListener('mouseleave', function(){ closeT = setTimeout(close, 350); });
  el.addEventListener('mouseenter', function(){ clearTimeout(closeT); });
  tab.addEventListener('click', function(e){
    e.stopPropagation();
    if (el.classList.contains('open')) close(); else open();
  });
  document.addEventListener('click', function(e){ if (!el.contains(e.target)) close(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') close();
    else if (e.key === '?' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) {
      e.preventDefault(); el.classList.contains('open') ? close() : open();
    }
  });
  var here = decodeURIComponent((location.pathname.split('/').pop() || 'index.html'));
  Array.prototype.forEach.call(el.querySelectorAll('a'), function(a){
    if (a.getAttribute('href') === here) a.classList.add('cur');
  });
  var parts = (document.title || '').split('·').map(function(s){ return s.replace(/^851\s*/, '').trim(); })
    .filter(function(s){ return s && s !== '851'; });
  el.querySelector('.cur-page').textContent = parts[0] || here;
})();
</script>

<div id="g851-bg" aria-hidden="true"></div>
<div id="g851-bgc">
 <button class="naiwa-bg-button" type="button" aria-controls="naiwa-bg-panel" aria-expanded="false">◐ 奶蛙背景</button>
 <div class="naiwa-bg-panel" id="naiwa-bg-panel">
   <div class="naiwa-row"><span>背景可见度</span><strong id="g851-bgv">12%</strong></div>
   <input id="g851-bgi" type="range" min="0" max="30" value="12" aria-label="背景可见度百分比">
   <div class="naiwa-row"><label for="g851-bgm">缓慢浮动</label><input type="checkbox" id="g851-bgm" checked></div>
   <div class="naiwa-row"><label for="g851-bge">眼睛跟随鼠标</label><input type="checkbox" id="g851-bge" checked></div>
   <div class="naiwa-row"><label for="g851-bgf">专注模式</label><input type="checkbox" id="g851-bgf"></div>
   <p class="naiwa-caption">整卷模拟页默认自动专注；专注时降低浓淡、停止动画。</p>
   <button type="button" id="g851-bgr" class="naiwa-bg-reset">恢复默认</button>
 </div>
</div>
<script id="g851-bg-js">/* G851_BG_V3 */
(function(){'use strict';
 if(window.__g851NaiwaV3)return;
 window.__g851NaiwaV3=true;
 var layer=document.getElementById('g851-bg'),panel=document.getElementById('g851-bgc');
 if(!layer||!panel)return;
 var btn=panel.querySelector('.naiwa-bg-button'),range=document.getElementById('g851-bgi'),
  val=document.getElementById('g851-bgv'),motion=document.getElementById('g851-bgm'),
  eyes=document.getElementById('g851-bge'),focus=document.getElementById('g851-bgf'),
  reset=document.getElementById('g851-bgr');
 var N=5,sprites=[],lastW=0,lastH=0,resizeJob=0,eyeJob=0,mouse=null;
 var K='g851-bga',KM='g851-bg-motion',KE='g851-bg-eyes';
 var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
 function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
 function put(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
 function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
 var pageName=decodeURIComponent(location.pathname).split('/').pop();
 var defaultFocus=pageName.startsWith('模拟-')||pageName.startsWith('专项卷')||/[?&]quiz=1(?:&|$)/.test(location.search);
 var KF=defaultFocus?'g851-bg-focus-exam':'g851-bg-focus-normal';
 function apply(){
  var v=clamp(+range.value||0,0,30),onFocus=focus.checked;
  document.documentElement.style.setProperty('--g851-bga',(v/100).toFixed(3));
  layer.style.opacity=onFocus?Math.min(v/100,.035):v/100;
  val.textContent=v?v+'%':'关';
  layer.classList.toggle('focus',onFocus);
  layer.classList.toggle('no-motion',!motion.checked||reduced);
  if(onFocus||!eyes.checked||reduced){for(var s of sprites){if(s.pupil){s.pupil.style.setProperty('--look-x','0px');s.pupil.style.setProperty('--look-y','0px')}}}
 }
 var saved=get(K),query=/[?&]bga=(\d+)/.exec(location.search);
 range.value=clamp(query?+query[1]:(saved===null?12:+saved),0,30);
 motion.checked=(get(KM)!=='0')&&!reduced;
 eyes.checked=(get(KE)!=='0')&&!reduced;
 focus.checked=get(KF)===null?defaultFocus:get(KF)==='1';
 apply();
 range.addEventListener('input',function(){apply();put(K,range.value)});
 motion.addEventListener('change',function(){apply();put(KM,motion.checked?'1':'0')});
 eyes.addEventListener('change',function(){apply();put(KE,eyes.checked?'1':'0')});
 focus.addEventListener('change',function(){apply();put(KF,focus.checked?'1':'0')});
 reset.addEventListener('click',function(){range.value=12;motion.checked=!reduced;eyes.checked=!reduced;
  focus.checked=defaultFocus;apply();put(K,12);put(KM,motion.checked?'1':'0');put(KE,eyes.checked?'1':'0');
  try{localStorage.removeItem(KF)}catch(e){}});
 btn.addEventListener('click',function(){var on=panel.classList.toggle('on');btn.setAttribute('aria-expanded',String(on))});
 document.addEventListener('click',function(e){if(!panel.contains(e.target)){panel.classList.remove('on');btn.setAttribute('aria-expanded','false')}});
 function rng(seed){return function(){seed|=0;seed=seed+0x6d2b79f5|0;
  var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;}}
 function collision(a,b,gap){return a.l<b.r+gap&&a.r+gap>b.l&&a.t<b.b+gap&&a.b+gap>b.t;}
 function relayout(){
  var W=innerWidth,H=innerHeight;
  if(W<180||H<180)return;
  if(Math.abs(lastW-W)<10&&Math.abs(lastH-H)<10&&sprites.length)return;
  lastW=W;lastH=H;layer.textContent='';sprites=[];
  var rand=rng(20261116+Math.floor(W/24)*711+Math.floor(H/24)*137),boxes=[];
  // 比旧版本稍密，但严格避让；空间不足就跳过，不强行重叠。
  var count=clamp(Math.round(W*H/60000),6,30);
  for(var i=0;i<count;i++){
   var w=clamp((W<650?60:84)+rand()*(W<650?31:52),54,140),h=w;
   var angle=(rand()-.5)*52;
   if(rand()<.1)angle+=(rand()<.5?85:-85);
   var a=angle*Math.PI/180,ew=w*(Math.abs(Math.cos(a))+Math.abs(Math.sin(a)));
   var margin=16,found=null,rect;
   if(ew+margin*2>W||ew+margin*2>H)continue;
   for(var attempt=0;attempt<360;attempt++){
    var cx=ew/2+margin+rand()*(W-ew-2*margin);
    var cy=ew/2+margin+rand()*(H-ew-2*margin);
    rect={l:cx-ew/2,t:cy-ew/2,r:cx+ew/2,b:cy+ew/2};
    if(!boxes.some(function(b){return collision(rect,b,22)})){found={x:cx-w/2,y:cy-h/2};break;}
   }
   if(!found)continue;
   boxes.push(rect);
   var kind=Math.floor(rand()*N);
   var el=document.createElement('div');el.className='naiwa';
   el.style.left=found.x.toFixed(2)+'px';el.style.top=found.y.toFixed(2)+'px';
   el.style.width=w.toFixed(2)+'px';el.style.height=h.toFixed(2)+'px';
   el.style.setProperty('--angle',angle.toFixed(1)+'deg');
   el.style.setProperty('--speed',(6+rand()*6).toFixed(2)+'s');
   el.style.setProperty('--delay',(-rand()*11).toFixed(2)+'s');
   var fl=document.createElement('div');fl.className='naiwa-float';
   var reaction=document.createElement('div');reaction.className='naiwa-react';
   var face=document.createElement('div');face.className='naiwa-face';
   face.style.setProperty('--atlas-scale',(N*100)+'%');
   face.style.setProperty('--sprite-pos',(N===1?0:100*kind/(N-1)).toFixed(4)+'%');
   reaction.appendChild(face);
   var pupil=null;
   // 只有主造型经过眼部坐标校准。其余新增造型不会被错误套上瞳孔。
   if(kind===0){pupil=document.createElement('div');pupil.className='naiwa-eye';reaction.appendChild(pupil)}
   fl.appendChild(reaction);el.appendChild(fl);layer.appendChild(el);
   sprites.push({el:el,react:reaction,pupil:pupil});
  }
 }
 window.addEventListener('resize',function(){if(resizeJob)cancelAnimationFrame(resizeJob);
  resizeJob=requestAnimationFrame(function(){resizeJob=0;relayout()})},{passive:true});
 document.addEventListener('pointermove',function(e){
  if(focus.checked||!eyes.checked||reduced||e.pointerType==='touch')return;
  mouse={x:e.clientX,y:e.clientY};
  if(eyeJob)return;
  eyeJob=requestAnimationFrame(function(){eyeJob=0;if(!mouse)return;
   for(var s of sprites){if(!s.pupil)continue;var r=s.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var dx=mouse.x-cx,dy=mouse.y-cy,dist=Math.hypot(dx,dy),a=dist<1?0:clamp(dist/250,0,1);
    var max=clamp(r.width*.04,2,5);
    s.pupil.style.setProperty('--look-x',(max*a*dx/Math.max(1,dist)).toFixed(2)+'px');
    s.pupil.style.setProperty('--look-y',(max*a*dy/Math.max(1,dist)).toFixed(2)+'px');
   }
  });
 },{passive:true});
 var reactions=['bop','wiggle','puff','jump'];
 document.addEventListener('pointerdown',function(e){
  if(focus.checked||reduced||!motion.checked)return;
  if(e.target.closest('a,button,input,select,textarea,label,[role="button"],[contenteditable="true"]'))return;
  for(var j=sprites.length-1;j>=0;j--){
   var s=sprites[j],r=s.el.getBoundingClientRect();
   if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
    s.react.classList.remove(...reactions);void s.react.offsetWidth;
    var reaction=reactions[Math.floor(Math.random()*reactions.length)];
    s.react.classList.add(reaction);
    (function(el,name){setTimeout(function(){el.classList.remove(name)},650)})(s.react,reaction);
    break;
   }
  }
 },{passive:true});
 relayout();
})();
</script>
