<body>
<div class="wrap">
  <p style="margin:0 0 4px"><a href="index.html" style="font-size:13px;color:#8c4a2f">← 总目录</a>
     ｜ <a href="错题本.html" style="font-size:13px;color:#8c4a2f">错题本</a></p>
  <h1>AI 笔记</h1>
  <p class="sub">只放你点过「保留」的内容；AI 判断仅供参考，请小牛复核后再并入站内。</p>

  <div class="sum" id="sum"></div>

  <div class="act">
    <button class="main" id="exp">导出待核对（Markdown）</button>
    <button id="expSus">导出存疑清单</button>
    <button class="warn" id="clrKeep">清空待核对</button>
    <button class="warn" id="clrSus">清空存疑</button>
    <button class="warn" id="clrAll">清空缓存与次数</button>
  </div>

  <h2>待小牛核对 <span id="kN"></span></h2>
  <div id="keeps"></div>

  <h2>AI 存疑（未采信） <span id="sN"></span></h2>
  <div id="suss"></div>

  <p class="foot">数据只存在这台设备的浏览器；导出后可直接发给内容侧。</p>
</div>
<script src="ai-common.js"></script>
<script>
var AI = window.G851AI;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function today(){ var d = new Date(); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }

function render(){
  var keep = AI ? AI.notes.keep() : {}, sus = AI ? AI.notes.sus() : {};
  var u = AI ? AI.usage() : {calls:0, tokens:0};
  var kTags = Object.keys(keep).sort(), sTags = Object.keys(sus).sort();
  var kCnt = kTags.reduce(function(n, t){ return n + keep[t].length; }, 0);

  document.getElementById('sum').innerHTML =
    '<div class="big">待核对 <b>' + kCnt + '</b> 段　·　存疑 <b>' + sTags.length + '</b> 题</div>'
    + '<div class="line">今日已用 ' + u.calls + ' 次 · 约 ' + (Math.round(u.tokens/100)/10) + 'k token</div>';
  document.getElementById('kN').textContent = kCnt ? '（' + kTags.length + ' 题）' : '';
  document.getElementById('sN').textContent = sTags.length ? '（' + sTags.length + ' 题）' : '';

  var kh = [];
  kTags.forEach(function(tag){
    keep[tag].forEach(function(it, i){
      kh.push('<div class="card" data-tag="' + esc(tag) + '" data-i="' + i + '">'
        + '<div class="hd"><span class="tag">' + esc(tag) + '</span>'
        + (it.verdict && it.verdict !== '未判定'
            ? '<span class="vt' + (it.verdict === '站内可能有错' ? ' bad' : '') + '">' + esc(it.verdict) + '</span>'
            : '')
        + '<span class="meta">手动保留 · ' + esc(it.at || '') + ' · ' + esc(it.mode || '') + ' · ' + esc(it.model || '') + '</span></div>'
        + '<pre>' + esc(it.text || '') + '</pre>'
        + '<div class="ops"><button class="copy">复制</button><button class="del">删除</button></div></div>');
    });
  });
  document.getElementById('keeps').innerHTML = kh.join('') || '<div class="empty">还没有保留的内容：去错题本点「AI 分析」，满意的话点「保留这段」。</div>';

  var sh = [];
  sTags.forEach(function(tag){
    var it = sus[tag];
    sh.push('<div class="card sus" data-tag="' + esc(tag) + '">'
      + '<div class="hd"><span class="tag">' + esc(tag) + '</span>'
      + '<span class="vt bad">AI 认为站内可能有错</span>'
      + '<span class="meta">' + esc(it.at || '') + ' · ' + esc(it.model || '') + '</span></div>'
      + '<pre>' + esc(it.reason || '') + '</pre>'
      + '<div class="ops"><button class="copy">复制</button><button class="del">删除</button></div></div>');
  });
  document.getElementById('suss').innerHTML = sh.join('') || '<div class="empty">没有存疑项。</div>';

  bindOps();
}

function bindOps(){
  Array.prototype.forEach.call(document.querySelectorAll('.card'), function(card){
    var tag = card.getAttribute('data-tag'), isSus = card.classList.contains('sus');
    var i = parseInt(card.getAttribute('data-i'), 10);
    var cbtn = card.querySelector('.copy');
    if (cbtn) cbtn.onclick = function(){
      var tx = card.querySelector('pre').textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(tx).then(function(){
        cbtn.textContent = '已复制'; setTimeout(function(){ cbtn.textContent = '复制'; }, 1200);
      }, function(){ alert(tx); });
      else alert(tx);
    };
    var dbtn = card.querySelector('.del');
    if (dbtn) dbtn.onclick = function(){
      if (!confirm('删除这条？')) return;
      if (isSus) {
        var s = AI.notes.sus(); delete s[tag];
        localStorage.setItem('g851-ai-sus', JSON.stringify(s));
      } else {
        var k = AI.notes.keep(); if (k[tag]) { k[tag].splice(i, 1); if (!k[tag].length) delete k[tag]; }
        localStorage.setItem('g851-ai-keep', JSON.stringify(k));
      }
      render();
    };
  });
}

function download(name, text){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/markdown;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

document.getElementById('exp').onclick = function(){
  var keep = AI.notes.keep(), tags = Object.keys(keep).sort();
  if (!tags.length) { alert('还没有保留内容。'); return; }
  var L = ['# 851 · AI 补充解析（待小牛核对）', '',
           '> 以下均由用户看过并点「保留」；AI 判断仅供参考，请复核后决定是否并入站内答案。', '',
           '导出日期：' + today(), ''];
  var n = 0;
  tags.forEach(function(tag){
    keep[tag].forEach(function(it){
      n++;
      L.push('## ' + n + '. ' + tag + '　（' + (it.verdict || '未判定') + ' · ' + (it.at || '') + ' · ' + (it.model || '') + '）');
      L.push('');
      L.push(it.text || '');
      L.push('');
      L.push('---'); L.push('');
    });
  });
  download('851-AI待核对-' + today() + '.md', L.join('\n'));
};
document.getElementById('expSus').onclick = function(){
  var sus = AI.notes.sus(), tags = Object.keys(sus).sort();
  if (!tags.length) { alert('没有存疑项。'); return; }
  var L = ['# 851 · AI 存疑清单（未采信，仅提示）', '',
           '> 这些是 AI 认为站内答案可能有错/有缺的题；没有被采信，请人工判断。', '',
           '导出日期：' + today(), ''];
  tags.forEach(function(tag){
    var it = sus[tag];
    L.push('- **' + tag + '**（' + (it.at || '') + ' · ' + (it.model || '') + '）');
    L.push('  ' + String(it.reason || '').replace(/\n/g, '\n  '));
    L.push('');
  });
  download('851-AI存疑-' + today() + '.md', L.join('\n'));
};
document.getElementById('clrKeep').onclick = function(){
  if (!confirm('清空「待小牛核对」？已导出的文件不受影响。')) return;
  localStorage.removeItem('g851-ai-keep'); render();
};

<script>
/* G851_RAIL_JS */
(function(){
  var el = document.getElementById('g851-rail');
  if (!el || el.getAttribute('data-init')) return;
  el.setAttribute('data-init', '1');
  var tab = el.querySelector('.tab'), openT = null, closeT = null;
  function open(){ clearTimeout(closeT); el.classList.add('open'); tab.setAttribute('aria-expanded','1'); }
  function close(){ el.classList.remove('open'); tab.setAttribute('aria-expanded','0'); }
  tab.addEventListener('mouseenter', function(){
    clearTimeout(openT);
    openT = setTimeout(function(){ if (tab.matches(':hover')) open(); }, 150);
  });
  tab.addEventListener('mouseleave', function(){ clearTimeout(openT); });
  el.addEventListener('mouseleave', function(){ closeT = setTimeout(close, 350); });
  el.addEventListener('mouseenter', function(){ clearTimeout(closeT); });
  tab.addEventListener('click', function(e){
    e.stopPropagation();
    if (el.classList.contains('open')) close(); else open();
  });
  document.addEventListener('click', function(e){ if (!el.contains(e.target)) close(); });
  window.addEventListener('scroll', function(){ close(); }, {passive:true});
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') close();
    else if (e.key === '?' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) {
      e.preventDefault(); el.classList.contains('open') ? close() : open();
    }
  });
  var here = decodeURIComponent((location.pathname.split('/').pop() || 'index.html'));
  Array.prototype.forEach.call(el.querySelectorAll('a'), function(a){
    if (a.getAttribute('href') === here) a.classList.add('cur');
  });
  var parts = (document.title || '').split('·').map(function(s){ return s.replace(/^851\s*/, '').trim(); })
    .filter(function(s){ return s && s !== '851'; });
  el.querySelector('.cur-page').textContent = parts[0] || here;

  /* ── 新版本提示 / 离线提示 ── */
  (function () {
    function toast(msg, actionText, onClick, ms) {
      var d = document.createElement('div');
      d.id = 'g851-toast';
      var s = document.createElement('span');
      s.textContent = msg;
      d.appendChild(s);
      if (actionText) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = actionText;
        b.addEventListener('click', onClick);
        d.appendChild(b);
      }
      document.body.appendChild(d);
      setTimeout(function () { d.classList.add('on'); }, 30);
      if (ms) setTimeout(function () {
        d.classList.remove('on');
        setTimeout(function () { d.parentNode && d.parentNode.removeChild(d); }, 300);
      }, ms);
    }
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      if (navigator.serviceWorker.controller) {
        var fired = 0;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (fired) return;
          fired = 1;
          toast('库已更新到新版本', '刷新', function () { location.reload(); }, 15000);
        });
      }
    }
    var off = null;

  {side:'left', y:.14,kind:0,angle:-14}, {side:'right',y:.15,kind:2,angle:12},
