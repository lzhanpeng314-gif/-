tem": "如图，一个由焦距为 60 mm 的薄透镜和一个一次等腰直角棱镜（介质折射率为 1.5，直角边长为 60 mm）构成的光学系统，在透镜前 90 mm 处有一个 1 mm 高的物体，试", "body": "1透镜成像（l = −90，f′ = 60） 1l′ = 160 + 1−90 = 1180 ⇒ l′ = 180 mm， β = −2 2会聚点距入射面 180 − 120 = 60 mm；L = 60 mm，Δ = 20 mm 会聚点被推到 60 + 20 = 80 mm（自入射面） 3出射面在 60 mm 处 像距出射面 = 80 − 60 = 20 mm 像在棱镜出射面外 20 mm，倒立实像，高 2 mm。", "chap": "A · 解析法：厚透镜、棱镜、反射膜6 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q005", "tag": "2013-11", "stem": "如图，一个由焦距为 100 mm 的薄透镜和一个二次反射五棱镜（介质折射率为 1.5，两个直角边长均为 60 mm）构成的光学系统，在透镜前 150 mm 处有一个 1 mm 高的", "body": "1透镜成像：同 2010-11，l′ = 300 mm，β = −2，会聚点距棱镜入射面 300 − 150 = 150 mm。 2二次反射五棱镜按两个反射面展开成一块玻璃板，展开厚度（沿光轴的光路长）按标准五棱镜取 L = (2 + √2)a = 3.414 × 60 ≈ 205 mm 3平板位移 Δ = L(1 − 1/1.5) = 205/3 ≈ 68 mm；会聚点被推到 150 + 68 = 218 mm 4出射面在光路上距入射面 L = 205 mm 像距出射面 = 218 − 205 ≈ 13 mm （通式：150 − 2L3） 像在五棱镜出射面外约 13 mm（沿折转 90° 后的光轴），倒立实像，高 2 mm。 【待核】这题唯一不确定的量是五棱镜的展开厚度 L：它取决于五边形各边长度，而题面只给了\"两个直角边长 60 mm\"与\"112.5°\"。本页按标准五棱镜 L = (2+√2)a ≈ 205 mm 计算。若课", "chap": "A · 解析法：厚透镜、棱镜、反射膜6 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q006", "tag": "2014-11", "stem": "如图，一个由焦距为 100 mm 的薄透镜和一个二次反射五棱镜（介质折射率为 1.5，两个直角边长均为 60 mm）构成的光学系统，在透镜前 150 mm 处有一个 1 mm 高的", "body": "1数据与 2013-11 完全一致，直接沿用其结论：透镜 l′ = 300 mm、β = −2；L ≈ 205 mm、Δ ≈ 68 mm。 2 像距出射面 = (300 − 150) + 68 − 205 ≈ 13 mm， 像高 = 2 mm 与 2013-11 答案相同：像在出射面外约 13 mm，倒立实像，高 2 mm。两年同一道题、同一组数。 【待核】同 2013-11：不确定的只是五棱镜展开厚度 L 的取法。", "chap": "A · 解析法：厚透镜、棱镜、反射膜6 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q007", "tag": "2009-9", "stem": "空气中由两个像方焦距依次为 90 cm 和 30 cm 的薄透镜构成光学系统，两个透镜的空间间隔为 60 cm： （1）试求系统等效光组的焦点和主点的位置，并画图表示基点与两个透镜", "body": "", "chap": "B · 双光组：基点、焦距、间隔3 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q008", "tag": "2015-9", "stem": "用焦距同为 60 mm 的两个薄透镜在空气中构成一个目镜，两个薄透镜的空间间隔为 40 mm，试问：（1）该目镜等效光组的焦点和主点的位置；（2）如果在第一个透镜前 10 mm 处", "body": "", "chap": "B · 双光组：基点、焦距、间隔3 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q009", "tag": "2010-10", "stem": "已知两个薄透镜组合，组合系统焦距 f′ = 1000 mm，总长度（第一薄透镜到系统像方焦点的距离）L = 700 mm，总焦点位置 lF′ = 400 mm，求组成此系统的两个薄", "body": "", "chap": "B · 双光组：基点、焦距、间隔3 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q010", "tag": "2010-12", "stem": "焦距为 f′ = 120 mm 的薄透镜，直径 D0 = 40 mm，在透镜前 50 mm 处有一光孔，直径 Dp = 35 mm。试问物体在 −∞ 和 −300 mm 处时，孔径", "body": "", "chap": "C · 孔径光阑、入瞳、出瞳1 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q011", "tag": "2013-12", "stem": "一个像方焦距为 40 mm，直径 D1 = 30 mm 的薄透镜做成放大镜，眼瞳位于透镜像方焦点 F′ 上，眼瞳直径 D2 = 4 mm，物面放在透镜物方焦平面上。试问： （1）哪", "body": "", "chap": "D · 放大镜2 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q012", "tag": "2015-10", "stem": "将一个像方焦距为 40 mm，直径 D1 = 30 mm 的薄透镜做成放大镜，眼瞳位于透镜像方焦点 F′ 上，眼瞳直径 D2 = 4 mm，物面放在透镜物方焦平面上。试问：（1）哪", "body": "1与 2013-12 逐字相同，结论直接沿用：眼瞳张角 0.05 rad < 镜框 0.375 rad，故孔径光阑 = 眼瞳、视场光阑 = 镜框。 2入瞳在物方无穷远，物方孔径角 2U = D2/f′ = 4/40 = 0.1 rad。 3入窗 = 镜框本身（放大镜处，Ø30）；线视场 y/2 + 2 ≤ 15 ⇒ 2y = 52 mm。 同 2013-12：光阑为眼瞳（孔径）/镜框（视场），入瞳在无穷远、孔径角 0.1 rad，入窗在镜框处，无渐晕线视场 2y = 52 mm。", "chap": "D · 放大镜2 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q013", "tag": "2010-13", "stem": "有一显微镜系统，物镜的放大率为 −40，目镜的倍率为 15（设均为薄透镜），物镜的共轭距为 195 mm，求物镜和目镜的焦距、物体的位置和光学筒长、物镜与目镜的间距、系统等效焦距与", "body": "", "chap": "E · 显微镜4 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q014", "tag": "2012-13", "stem": "已知显微镜的视角放大率为 −300×，目镜的焦距为 20 mm，求显微镜物镜的倍率。假定人眼的视角分辨率为 60″，问使用该显微镜观察时，能分辨的两物点的最小距离等于多少。", "body": "1目镜的视角放大率 Γ2 = 250f2′ = 25020 = 12.5× 2总倍率是两级相乘 Γ1 = ΓΓ2 = −30012.5 = −24× 3分辨判据：把物方间隔 δ 放大 Γ 倍后（相对明视距离 250 mm）恰等于人眼分辨角 60″ = 2.91×10−4 rad， Γδ250 = 2.91×10−4 δ = 250 × 2.91×10−4300 = 2.42×10−4 mm ≈ 0.24 μm 物镜倍率 Γ₁ = −24×；能分辨的两物点最小距离 δ ≈ 0.24 μm。", "chap": "E · 显微镜4 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q015", "tag": "2015-11", "stem": "已知显微镜的视角放大率为 −300×，目镜的焦距为 20 mm，求显微镜物镜的倍率。假定人眼的视角分辨率为 60″，问使用该显微镜观察时，能分辨的两物点的最小距离等于多少。", "body": "1Γ2 = 250/20 = 12.5，Γ1 = −300/12.5 = −24× 2δ = 250 × (60/206265)/300 = 2.42×10−4 mm ≈ 0.24 μm 同 2012-13：物镜 −24×，最小分辨距离 0.24 μm。若改用衍射判据 0.61λ/NA（λ = 550 nm，NA ≈ 0.65）也落在 0.5 μm 量级，两法互相印证。", "chap": "E · 显微镜4 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q016", "tag": "2013-13", "stem": "有一架显微镜，视角放大率 Γ = −1000×，目镜焦距为 25 mm，显微物镜的数值孔径为 1.3，求系统在物平面上能分辨的两物点的最小间隔以及在物镜像平面上能分辨的最小间隔（照", "body": "1放大率分配：Γ2 = 250/25 = 10 ⇒ Γ1 = −1000/10 = −100× 2物面分辨极限用数值孔径（瑞利判据） δ = 0.61λNA = 0.61 × 5551.3 nm = 260 nm = 0.26 μm 3物镜像平面上的间隔 = 物镜放大 100 倍后的间隔 δ′ = |Γ1| · δ = 100 × 0.26 = 26 μm 物面上最小可分辨间隔 δ ≈ 0.26 μm；物镜像平面上最小可分辨间隔 δ′ ≈ 26 μm（恰好是 100 倍关系）。 两种判据：有的教材取 δ = 0.5λ/NA，则 δ = 0.21 μm、δ′ = 21 μm。本题给了 NA 和 λ，说明要用衍射判据而不是\"人眼 60″\"那一套。", "chap": "E · 显微镜4 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q017", "tag": "2012-12", "stem": "如果照相物镜的对准平面以后的整个空间都能在景像平面上成清晰像，物镜的焦距 f′ = 75 mm，所用光圈数 F = 16。求对准平面位置和近景面的位置。如果调焦于无限远处，即 p ", "body": "", "chap": "F · 照相机：景深与近拍镜2 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q018", "tag": "2014-12", "stem": "一台照相机只能够对其 0.6 m 以前的物体成像。通过增加近拍镜可以拍摄更近的物体，要使该照相机能够拍摄其 0.2 m 以前的物体，近拍镜的焦距应该为多少？（将近拍镜看作薄透镜）", "body": "1相机调焦范围到 0.6 m 为止，说明它最靠近的位置对应\"物在 0.6 m\"。加近拍镜后相机仍按 0.6 m 调焦，所以要让 0.2 m 处的物经近拍镜后，其像正好出现在 0.6 m 处（虚像）。 2对近拍镜：物 l = −200 mm，像 l′ = −600 mm（虚像、在物同侧） 1f′ = 1l′ − 1l = 1−600 − 1−200 = 2600 f′ = +300 mm（光焦度 +3.33 D） 3验算：近拍镜把 0.2 m 的物成 0.6 m 处的正立虚像，相机对 0.6 m 调焦即可拍清；放大率 β = −600/−200 = +3，画面中心仍是正立的。 近拍镜焦距 f′ = +300 mm（即 +3.33 屈光度、俗称 No.3 近拍镜）。", "chap": "F · 照相机：景深与近拍镜2 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q019", "tag": "2009-11", "stem": "想设计一个由两个正的薄透镜构成的放大倍率为 10× 的望远镜，如果物镜的像方焦距为 20 cm： （1）试问应该选择焦距为多大的目镜？ （2）如果眼的角分辨极限为 1′，要求通过该", "body": "", "chap": "G · 望远镜3 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q020", "tag": "2011-13", "stem": "欲看清 10 km 处相隔 50 mm 的两个物点，用开普勒望远镜。试求： （1）望远镜至少应选用多大倍率（正常倍率）； （2）当筒长为 465 mm 时，物镜和目镜的焦距； （3", "body": "", "chap": "G · 望远镜3 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-早年真题-补遗2.html", "id": "q021", "tag": "2014-13", "stem": "现有焦距分别为 −10 mm、10 mm 和 200 mm 的三个薄透镜和一个光阑，试用其中的两个薄透镜和光阑设计一个无渐晕的望远镜系统：（1）画出光学系统的结构图；（2）该系统的", "body": "", "chap": "G · 望远镜3 题 ·", "doc": "851 计算题 · 早年真题 Part3（第 55–81 页，2009–2015）"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q001", "tag": "2017-四-4", "stem": "一个人眼看不清楚 5m 以内的物体，如果校正时应该佩戴眼镜的屈光度为多少？某照相机可拍摄的最近距离为 1m，装上 2 个屈光度（f = 500mm）的近拍镜后，能拍摄的最近距离是多", "body": "", "chap": "A · 人眼与照相机1 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q002", "tag": "2024-四-3", "stem": "将一个像方焦距 f′ = 40mm，直径 D1 = 30mm 的薄透镜做成放大镜，眼睛位于透镜像方焦点 F′ 上，眼睛直径 D2 = 4mm，物面放在透镜物方焦点 F 上。试问：（", "body": "", "chap": "B · 放大镜2 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q003", "tag": "2017-四-3", "stem": "将一个像方焦距 f = 40mm，直径 D1 = 30mm 的薄透镜做成放大镜，眼睛位于透镜像方焦点 F 上，眼睛直径 D2 = 4mm，物面放在透镜物方焦点 F 上。试问：（1）", "body": "1瞳孔（4 mm @ 透镜后 40 mm）经透镜成像：l′ = 20 mm、β = 0.5 ⇒ 2 mm，比透镜框 30 mm 小 孔径光阑 = 眼睛瞳孔（4 mm）；视场光阑 = 透镜框（30 mm） 2入瞳：光阑经前面元件（透镜）成像 ⇒ 2 mm，位于透镜后 20 mm（虚像） 3出瞳：光阑后面没有光学元件 ⇒ 出瞳就是光阑本身 出瞳 = 4 mm，位于 F′（透镜后 40 mm，与瞳孔重合） 4入窗：视场光阑前面也没有元件 ⇒ 入窗 = 透镜框，φ30 mm，在透镜处 5出窗：视场光阑后面只有眼睛（不参与成像） ⇒ 出窗 = 透镜框，φ30 mm，同样在透镜处 （1）孔径光阑 = 眼睛瞳孔，视场光阑 = 透镜框；（2）入瞳 φ2 mm、透镜后 20 mm（虚），出瞳 φ4 mm、透镜后 40 mm；入窗、出窗都与透镜框重合，φ30 mm、在透镜处。 规律：只有\"后面还有元件\"时才会出现\"入瞳≠出瞳\"。放大镜后面什么都没有", "chap": "B · 放大镜2 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q004", "tag": "2022-三-7", "stem": "有一显微镜系统，物镜的放大率为 −40、目镜的倍率为 15（薄透镜），物镜的共轭距为 195mm，求物镜和目镜的焦距、物体的位置和光学筒长、物镜与目镜的间距、系统等效焦距、总倍率。", "body": "", "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q005", "tag": "2018-四-3", "stem": "一个视角放大率为 −40× 的显微镜，由焦距 35mm 的物镜和焦距为 25mm 的目镜组成，试求该显微镜物镜的放大倍率及显微镜的总焦距。", "body": "1目镜的视放大率 Γe = 25025 = 10× 2总倍率是物镜线放大率与目镜视放大率之积 βo = ΓΓe = −4010 = −4× 3顺带求光学筒长（βo = −Δ/fo′） Δ = −βofo′ = 4 × 35 = 140 mm， d = Δ + fo′ + fe′ = 200 mm 4总焦距（视放大率与等效焦距的换算） f′ = 250Γ = 250−40 = −6.25 mm 核对：−fo′fe′/Δ = −(35 × 25)/140 = −6.25 ✓ 物镜放大倍率 −4×；显微镜总焦距 −6.25 mm（光学筒长 140 mm、两镜间距 200 mm）。", "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q006", "tag": "2024-四-4", "stem": "用两个 f′ = 50mm 的正透镜组成放大率为 10 倍的显微镜，求物镜、目镜的放大倍率以及目镜和物镜的距离。", "body": "1目镜（fe′ = 50 mm）的视放大率 Γe = 25050 = 5× 2总 Γ = −10×（显微镜给出倒立像），故物镜的线放大率 βo = −105 = −2× 3由 βo = −Δ/fo′ 得光学筒长，再求中间像位置 Δ = 2 × 50 = 100 mm， l′ = Δ + fo′ = 150 mm 核对：1/150 + 1/75 = 0.02 ⇒ fo′ = 50 mm ✓（物在物镜前 75 mm） 4两镜间距：中间像正是目镜物方焦面上的物 d = l′ + fe′ = 150 + 50 = 200 mm 物镜 −2×、目镜 5×（视放大率），两镜间距 200 mm（光学筒长 100 mm）。", "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q007", "tag": "2016-四-2", "stem": "已知显微镜的视角放大率为 −125×，目镜的焦距为 20mm，求显微镜物镜的倍率。假定人眼的视角放大率为 60″，问使用该显微镜观察时，能分辨的两物点的最小距离等于多少。", "body": "1目镜视放大率 Γe = 250/20 = 12.5× βo = −12512.5 = −10× 2题给的\"60″\"就是人眼的分辨角 1′。换到明视距离 250 mm 上的线分辨 δ眼 = 250 × tan 1′ = 250 × 2.909×10−4 = 0.0727 mm 3显微镜把物放大 |Γ| 倍送到眼前，所以\"刚好被人眼分辨\"的物方间隔 δ = δ眼|Γ| = 0.0727125 = 5.82×10−4 mm = 0.58 μm 物镜倍率 −10×；能分辨的最小距离 ≈ 0.58 μm（5.8×10−4 mm）。 题面勘误：原文\"人眼的视角放大率为 60″\"应为\"人眼的视角分辨率（分辨角）为 1′ = 60″\"。这里按 1′ 计算。另外此解是\"按人眼极限倒推\"的口径；若给数值孔径 NA，应改用 δ = 0.61λ/NA。", "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q008", "tag": "2019-四-3", "stem": "现用显微镜观察一个物体，已知该显微镜的光学筒长为 150mm，物镜的焦距为 20mm，目镜的视放大率为 12.5×，求（长度的计算结果精确到 0.01mm）：（1）总的视角放大率；", "body": "", "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q009", "tag": "2021-四-4", "stem": "想设计一个由两个正的薄透镜构成的放大倍率为 10× 的望远镜，如果物镜的像方焦距为 20cm。（1）试问应该选择焦距为多大的目镜；（2）如果眼睛的角分辨极限为 1′，要求通过该望远", "body": "", "chap": "D · 望远镜4 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q010", "tag": "2019-四-2", "stem": "一架望远镜由两个正薄透镜组成，已知物镜的像方焦距 f′ = 1000mm，其通光口径 D = 50mm，物镜与目镜的空间间隔为 1200mm，目镜的通光口径 D = 20mm。今在", "body": "", "chap": "D · 望远镜4 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q011", "tag": "2023-四-4", "stem": "有一个筒长为 280mm，物镜架开口大小为 30mm 的镜架，在其镜架上安装两个薄透镜构成放大率大小为 15× 成直立像的望远镜：（1）应选择的物镜、目镜的焦距各为多少？（2）如物", "body": "", "chap": "D · 望远镜4 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q012", "tag": "2020-四-4", "stem": "现有焦距分别为 −10mm、10mm 和 200mm 的三个薄透镜和一个光阑，试用其中的两个薄透镜和光阑设计一个无渐晕的望远镜系统：画出光学系统的结构图；该系统的视角放大率为多少；", "body": "", "chap": "D · 望远镜4 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q002", "tag": "2017-二-1", "stem": "一束自然光由空气经红宝石（n = 1.76）的表面反射，若检测其反射光为全偏振光，则入射角应为多少？求此入射角入射条件下，透射光的强度和偏振度。", "body": "", "chap": "二 · 布儒斯特角与偏振度3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q003", "tag": "2019-二-1", "stem": "一束光由空气经透明玻璃平板（n = 1.56）的表面反射，若检测到反射光强为零，求这束光的偏振态和入射角。（计算结果用反三角函数表示）", "body": "1反射光强为零 ⇒ 满足布儒斯特条件，且入射光不能含 s 分量 θ = θB = arctan 1.56 ≈ 57.3° 2偏振态：线偏振光，振动方向平行于入射面（纯 p 分量）。 入射角 θ = arctan 1.56 ≈ 57.3°；入射光为振动面平行于入射面的线偏振光。 反向问法也常考：若问\"反射光为全偏振光\"，答案是自然光或部分偏振光（只要含 p、s，反射后只剩 s）。", "chap": "二 · 布儒斯特角与偏振度3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q004", "tag": "2016-二-2", "stem": "光强为 I0 的线偏振光以 θi 角由空气斜入射到玻璃片 M（n = 1.50，背面涂黑）上，若入射线偏振光的振动平面与入射面的夹角为 45°，入射角 θi = 30°，求玻璃片的", "body": "", "chap": "二 · 布儒斯特角与偏振度3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q005", "tag": "2022-三-1", "stem": "一平面光波以 30° 角由空气入射到折射率为 1.52 的平行平板上，其振动平面与入射面的夹角为 45°，试求该平板上表面的反射率和平板上、下表面反射光的振动方向。", "body": "", "chap": "三 · 菲涅尔公式、反射率与振动方向3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q006", "tag": "2024-二-2", "stem": "振动方向与入射面夹角为 45° 的线偏振光，30° 角入射时，n = 1.5 的玻璃，求反射光的反射率 R 和振动方向。", "body": "1θt：sin θt = 1/3 ⇒ θt = 19.47° 2 Rs = 5.78%， Rp = 2.53% 3等幅两分量 ⇒ R = (Rs + Rp)/2 = 4.2% 4 tan α′ = rs/rp = −0.240/0.159 = −1.512 ⇒ α′ ≈ −56.5° R ≈ 4.2%；反射光振动方向与入射面成 56.5°（因 rs 反相，偏向入射面另一侧）。 速记：45° 入射 + rs、rp 异号 ⇒ 反射光振动面对称\"翻转\"，角度从 45° 变到 ≈56.5°。", "chap": "三 · 菲涅尔公式、反射率与振动方向3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q007", "tag": "2018-二-1", "stem": "自然光以 20° 角方向入射到某种晶体上，n = 1.52。 （1）求晶体表面的反射率和反射光的偏振度； （2）给晶体外加一电场时，晶体由各向同性变为单轴晶体，且光轴平行于晶体表面", "body": "", "chap": "三 · 菲涅尔公式、反射率与振动方向3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q008", "tag": "2020-二-1", "stem": "迎着光传播方向观察，一束左旋圆偏振光的光强为 I0，由空气垂直入射到折射率为 1.5 的玻璃上，求反射光的偏振态和光强。", "body": "1正入射反射系数 r = (n2−n1)/(n2+n1) = (1.5−1)/(1.5+1) = 0.2 2反射率 R = r² = 0.04 ⇒ Ir = 0.04 I0 3偏振态：正入射时 rp = −rs，两分量都反号但相对相位差增加 π，圆偏振的旋向反转 左旋 → 右旋圆偏振光 反射光为右旋圆偏振光，光强 0.04 I0。 易错点：① 忘记 rp、rs 反号，答\"仍是左旋\"；② 把光强算成 0.2 I0（那是振幅比，不是光强比）。 记忆：圆偏振光正入射反射，旋向必反转；斜入射时不一定。", "chap": "四 · 正入射与全反射2 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q009", "tag": "2023-二-1", "stem": "如图，经两侧面反射后从斜面反方向射出，入射光强 I0，求 I。", "body": "1光路分解：正入射进入（一次透射）→ 两个侧面各全反射一次 → 再正入射射出（一次透射）。 2全反射时若无吸收、无散射，反射率 = 1，两次全反射不损失能量（这是全反射的特点，也是它被用作反射棱镜的原因）。 3进、出两个表面都是正入射，各有一次反射损失。设棱镜折射率 n： R = [(n−1)/(n+1)]²， 透射率 T = 1 − R I = I0 · T · 1 · 1 · T = I0(1 − R)² 理想情形（忽略表面反射损失、全反射无损耗）：I ≈ I0。 计入两表面反射：I = I0[1 − ((n−1)/(n+1))²]²（n = 1.5 时约 0.92 I0；n = 1.52 时约 0.919 I0）。 题干未给 n，两种写法都留——先写\"全反射无损失 ⇒ I ≈ I0\"，再补\"若计表面反射则为 …\"，不会丢分。", "chap": "四 · 正入射与全反射2 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第2章-干涉.html", "id": "q001", "tag": "2016-二-1", "stem": "在双缝干涉实验中，缝间距为 0.5 mm，观察屏距离缝 1.2 m，现用读数显微镜测得 10 个干涉条纹（准确说是 11 个亮条或暗条）之间的距离为 12 mm，试求所用光的波长。", "body": "111 个亮条之间是 10 个间距 Δx = 12 mm / 10 = 1.2 mm 2 λ = Δx·d/D = 1.2×10−3 × 0.5×10−3 / 1.2 = 5.0×10−7 m λ = 500 nm；白光时：中央（k=0）仍是白光，两侧形成彩色条纹，因 Δx ∝ λ 使红光条纹最宽、紫光最窄，高级次处各色重叠 → 只能看到少数几级彩色，再往外模糊成白色。", "chap": "A · 杨氏双缝4 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q002", "tag": "2017-二-2", "stem": "S1、S2 小孔的间距为 0.5 mm，光屏离小孔的距离为 50 cm，当以厚度为 1.667×10−2 mm、折射率为 1.60 的透明薄片贴住小孔 S1 时，发现屏上的条纹有移", "body": "（1） 1薄片引入的附加光程 (n−1)t = 0.60 × 1.667×10−2 mm = 1.0×10−2 mm = 10 μm 2相当于条纹平移了多少级 N = (n−1)t / λ = 10×10−6 / 500×10−9 = 20 级 3条纹间距与移动距离 Δx = λD/d = 500×10−9×0.5 / 0.5×10−3 = 0.5 mm Δy = N·Δx = 20 × 0.5 mm = 10 mm 方向：向 S1 一侧（向上）移动 —— 光程增加的那一侧，条纹朝它移。 （2） 4相干长度 Lc = λ2Δλ = (500 nm)20.04 nm = 6.25×10−3 m = 6.25 mm 5附加光程差 ≥ 相干长度时条纹消失 (n−1)t ≥ Lc ⇒ t ≥ 6.25/0.60 ≈ 10.4 mm", "chap": "A · 杨氏双缝4 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q003", "tag": "2021-二-1", "stem": "杨氏双缝实验中，双缝间距 d = 0.5 mm，接收屏距双缝 D = 1 m，点光源距双缝 l = 30 cm，点光源发射波长为 500 nm 的单色光，试求：（1）屏上的条纹间距", "body": "1（1）空气中 Δx = λDd = 500×10−9×10.5×10−3 = 1 mm 2入水后波长变短 λ′ = λ/n（n ≈ 1.33） Δx′ = Δx/n ≈ 1/1.33 ≈ 0.75 mm （条纹变密） 3（2）波列长度有限，级次太高则两束不再相干。判据：kΔλ ≥ λ/2 kmax = λ/(2Δλ) = 500/(2×5) = 50 级 Δλ = 2.5×2 = 5 nm（\"±2.5\"是半宽，全宽为 5 nm）。第 50 级以后条纹消失。 4（3）光源宽度使两侧边缘的条纹错开半个间距 b·d/l = λ/2 ⇒ b = λl/(2d) = 500×10−9×0.30 / (2×0.5×10−3) = 0.15 mm Δx = 1 mm；水中 0.75 mm；条纹消失级次 ≈ 50 级；光源临界宽度 ≈ 0.15 mm。", "chap": "A · 杨氏双缝4 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q004", "tag": "2023-二-2", "stem": "杨氏干涉实验中，用波长为 640 nm 的光垂直照射间距为 0.4 mm 的两个小孔，小孔离接受屏幕 50 cm，求：（1）距离中央条纹 0.1 mm 处的 p 点的光强和中央点的", "body": "（1） 1该点对应的相位差 δ = 2π·d·y/(λD) = 2π × 0.4×10−3 × 0.1×10−3 / (640×10−9 × 0.5) = 0.25π 2双缝干涉光强分布 I = 4I1cos²(δ/2)，中央 I0 = 4I1 Ip/I0 = cos²(0.125π) = cos²22.5° ≈ 0.854 （2） 3空间相干要求光源对双缝的张角不超过 λ/a，即 dmax = λ·l/a = 640×10−9·l / 2×10−3 = 3.2×10−4·l Ip/I0 ≈ 0.854（即 85.4%）。 第（2）问题面缺\"光源到双缝的距离 l\"，无法给唯一数值。通式 dmax = λl/a；若按 l = D = 0.5 m 代入，得 dmax ≈ 0.16 mm。 这题请回原卷核对：若答案册给出具体数字，说明原题还给了 l（或\"光源紧贴双缝\"之类的条件），你补给我，我改。", "chap": "A · 杨氏双缝4 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q005", "tag": "2022-三-2", "stem": "如图所示，两相干平面光波，其一在 xz 平面沿与 z 轴夹角 θ1 方向传播，其二在 xz 平面沿与 z 轴夹角 θ2 方向传播，试求该二光波在 z 平面上的干涉条纹形状和条纹间距", "body": "1两波矢（分居 z 轴两侧时 x 分量反号） k1 = k(sin θ1, 0, cos θ1)， k2 = k(−sin θ2, 0, cos θ2) 2在 z = 0 平面上相位差只随 x 变 Δφ = (k1x − k2x)·x = k(sin θ1 + sin θ2)·x 3条纹间距 Δx = 2π|Δkx| = λsinθ1 + sinθ2 形状：一组平行于 y 轴（垂直于 xz 平面）的等间距直条纹； 间距：Δx = λ/(sin θ1 + sin θ2)（两波在 z 轴同侧时改为 λ/|sin θ1 − sin θ2|）。", "chap": "B · 两束平面波干涉2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q006", "tag": "2024-二-3", "stem": "如图所示，两相互垂直光波在 xz 平面传播，其一在 xz 平面沿与 z 轴夹角 θ1 方向传播，其二在 xz 平面沿与 z 轴夹角 θ2 方向传播，求该二光波在 z = 0 平面上", "body": "1先分清\"垂直\"指什么 —— 这是本题的陷阱，两种理解答案完全不同： 2情形一：两波振动方向相互垂直（正交偏振） —— 不满足干涉条件（振动方向必须不垂直）。 I = I1 + I2 （无干涉项） 此时屏上没有条纹，光强均匀分布。这是 851 常考的概念陷阱。 3情形二：两波振动方向平行（都垂直于 xz 面，即 s 偏振）—— 正常干涉 Δx = λ / (sin θ1 + sin θ2) 条纹为平行于 y 轴的直条纹，与上一题同形。 答题建议：先写\"振动方向垂直 ⇒ 不产生干涉条纹，I = I1+I2，屏上均匀照明\"，再补一句\"若两波振动方向平行，则条纹间距为 λ/(sinθ1+sinθ2)\"。两手都写，稳拿分。", "chap": "B · 两束平面波干涉2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q007", "tag": "2018-二-2", "stem": "如图所示的劈尖薄膜，右端厚度 h 为 0.05 mm，折射率为 1.5，波长为 707 nm 的光以 30° 角入射到上表面，求在这个面上产生的条纹数。若以两块玻璃片形成的空气尖劈", "body": "1膜内折射角（空气 → 膜） sin θt = sin30°/1.5 = 1/3 ⇒ θt = 19.47°，cos θt = 0.9428 2斜入射的光程差是 2n t cos θt（不是 2nt！） Δ = 2n h cosθt + λ2 3条纹数 = 最大光程差对应的级数 N = 2n h cosθtλ = 2×1.5×0.05×10−3×0.9428707×10−9 ≈ 200 条 4换成空气劈尖（n = 1，同 30° 入射，cos θt = cos30° = 0.866） N′ = 2 h cos30° / λ = 2×0.05×10−3×0.866 / 707×10−9 ≈ 122 条 玻璃膜劈尖 200 条；空气劈尖约 122 条（若按正入射则 N′ = 2h/λ ≈ 141 条）。 易错：① 斜入射忘了 cos θt；② 把 θ = 30° 直接当膜内角；③ 空气劈尖若也按 30° 斜入射，是 122 条而不是", "chap": "C · 劈尖等厚干涉1 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q008", "tag": "2019-二-2", "stem": "某光源发出波长很接近的两单色光，平均波长为 600 nm，通过间隔 d = 10 mm、腔镜反射率为 0.98 的法布里–珀罗干涉仪观察时，看到波长为 λ1 的光所产生的干涉条纹正", "body": "1正入射时 2d = kλ，级次 k = 2d/λ = 2×10×10−3 / 600×10−9 ≈ 3.33×104 2\"λ1 的条纹在 λ2 两条纹中间\" ⇒ 两波长对应的级次差 1/2 k·Δλ = λ2 ⇒ Δλ = λ2k = 600 nm2×3.33×104 ≈ 0.009 nm 3分辨本领 = 级次 × 精细度 F F = π√R1 − R = π√0.981 − 0.98 ≈ 155.5 Rp = k·F ≈ 3.33×104 × 155.5 ≈ 5.2×106 波长差 Δλ ≈ 0.009 nm；分辨本领 ≈ 5.2×106（相当于能分辨 1.2×10−4 nm）。", "chap": "D · F-P 干涉仪与干涉滤光片2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q009", "tag": "2020-二-2", "stem": "今有一干涉滤光片，其间隔层厚度为 2×10−4 mm，折射率 n = 1.5，高反膜的反射率 R = 0.9，试求：光波垂直入射，滤光片在可见光区的中心波长及其透射带波长半宽度；当", "body": "1正入射中心波长（取 k = 1 落在可见区） 2nd = 2×1.5×2×10−4 mm = 6×10−4 mm = 600 nm ⇒ λ0 = 600 nm 2透射带半宽度 δλ = λ0(1 − R)kπ√R = 600 × 0.1π×0.949 ≈ 20 nm 310° 斜入射：膜内角由折射定律 sin θt = sin10°/1.5 = 0.1158 ⇒ θt = 6.65°，cos θt = 0.9933 λ′ = 2nd·cos θt = 600 × 0.9933 ≈ 596 nm 中心波长 600 nm，半宽度 ≈ 20 nm；10° 斜入射时透射波长移到 596 nm（向短波方向移 4 nm）。", "chap": "D · F-P 干涉仪与干涉滤光片2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q010", "tag": "2021-二-3", "stem": "在折射率 n = 1.6 的光学玻璃基底上镀氟化镁膜层 n = 1.38，要求对波长为 500 nm 的光在正入射时给出最小反射率，试求：镀膜材料氟化镁膜层厚度及相应的最小反射率；", "body": "", "chap": "E · 光学薄膜1 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第3章-衍射.html", "id": "q001", "tag": "2023-二-3", "stem": "夫朗和费双缝衍射中，双缝间距 0.178 mm，缝宽 0.0445 mm。透镜的焦距 f = 50 cm，用波长为 532 nm 的平行光垂直照射双缝衍射屏，求：（1）其衍射图样在", "body": "", "chap": "A · 双缝夫琅和费衍射1 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q002", "tag": "2018-二-3", "stem": "若人造卫星上的宇航员恰好能分辨离他 100 km 地面上的两个点光源，则这两个点光源的距离为多大？假设光波的波长为 550 nm，宇航员的瞳孔直径为 4 mm。", "body": "1最小分辨角 θmin = 1.22λD = 1.22 × 550×10−94×10−3 = 1.68×10−4 rad 2换算成地面距离 s = L·θmin = 100×103 × 1.68×10−4 ≈ 16.8 m 两点距离约 16.8 m —— 所以从太空肉眼是分不清汽车和楼房细节的。", "chap": "B · 分辨本领3 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q003", "tag": "2024-二-1", "stem": "人眼瞳孔直径 D = 2 mm，光波长 λ = 550 nm，能否看清 20 m 外间隔 5 mm 的两条线。", "body": "1能分辨的最小距离（20 m 处） smin = L · 1.22λD = 20 × 1.22 × 550×10−92×10−3 = 20 × 3.355×10−4 ≈ 6.7 mm 2比较：5 mm < 6.7 mm 5 mm < smin = 6.7 mm 看不清。要看清 5 mm，瞳孔至少需 ≈ 2.7 mm（或把距离缩到 15 m 内）。", "chap": "B · 分辨本领3 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q004", "tag": "2021-二-2", "stem": "反射式天文望远镜物镜的通光孔径为 2.5 m，求当发射波长为 550 nm 的光波时，可以分辨的双星的最小夹角？为充分利用物镜的分辨本领，该望远镜的放大率以多大为宜？（人瞳孔的直径", "body": "1最小分辨角 θmin = 1.22550×10−92.5 = 2.68×10−7 rad ≈ 0.055″ 2\"充分利用口径\"的判据：出射光瞳直径等于人眼瞳孔 M = Dd = 25002 = 1250× 3验算：放大后要能被人眼分辨 M ≥ 1′θmin = 2.91×10−42.68×10−7 ≈ 1090 1250 > 1090 ✓，两个判据都满足。 最小分辨角 2.68×10−7 rad（0.055″）；放大率宜取 1250×。", "chap": "B · 分辨本领3 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q005", "tag": "2020-二-3", "stem": "一光栅宽为 5 cm，每毫米内有 500 条刻线。当用波长为 500 nm 的平行光垂直照射时，其第 3 级衍射光谱处在单缝衍射第一极小位置。试求：光栅每个缝的宽度；光栅第二级可分", "body": "1光栅常数与缝宽：第 3 级缺级 ⇒ d/a = 3 d = 1500 mm = 2 μm， a = d3 ≈ 0.667 μm 2总缝数 N = 500 条/mm × 50 mm = 25000 δλ = λkN = 500 nm2×25000 = 0.01 nm 3二级衍射角：sinθ = 2λ/d = 1.0/2 = 0.5 ⇒ θ = 30°，cosθ = 0.866 Δθ = λNd cosθ = 500×10−925000×2×10−6×0.866 ≈ 1.15×10−5 rad 缝宽 0.667 μm；二级最小波长差 0.01 nm；二级半角宽度 1.15×10−5 rad。", "chap": "C · 光栅5 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q006", "tag": "2017-二-3", "stem": "用波长为 600 nm 的光垂直照射总宽度为 36 mm、缝宽为 0.8 μm 的光栅，观察到第三级衍射谱线处在单缝衍射的第一极小值位置，求：（1）零级谱线半角宽度；（2）第二级谱", "body": "1d = 3a = 2.4 μm；N = 36 mm / 2.4 μm = 15000 Δθ0 = λNd = 600×10−915000×2.4×10−6 ≈ 1.67×10−5 rad 2 δλ = λkN = 600 nm2×15000 = 0.02 nm 3最高级次 kmax = d/λ = 2.4/0.6 = 4；缺级 d/a = 3 ⇒ ±3 缺 可见：0、±1、±2、±4 共 7 条 零级半角宽 1.67×10−5 rad；二级最小波长差 0.02 nm；实际可见 7 条（0、±1、±2、±4）。", "chap": "C · 光栅5 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q007", "tag": "2019-二-3", "stem": "平面透射光栅每毫米内 400 条刻线，光栅宽为 5 cm。当波长为 500 nm 的平行光垂直入射到该光栅，发现第 4 级衍射光谱处在单缝衍射的第一极小位置，试求：衍射中央峰的角宽", "body": "1d = 2.5 μm，N = 400×50 = 20000 中央峰全角宽 = 2λNd = 2×500×10−90.05 ≈ 2×10−5 rad 2一级（k=1） δλ = λkN = 500 nm20000 = 0.025 nm 中央峰角宽 2×10−5 rad（半宽 1×10−5）；最小波长差 0.025 nm。", "chap": "C · 光栅5 题 ·", "doc": "851 var input = document.getElementById('q'), out = document.getElementById('out'),
    hint = document.getElementById('hint'), N = DATA.length;
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function run(){
  try {
    var k = (input.value || '').trim().toLowerCase();
    if (!k) { hint.textContent = '共 ' + N + ' 条　·　空格分隔多个词，全部命中才列出'; out.innerHTML = ''; return; }
    var terms = k.split(/\s+/), list = [], i, j;
    for (i = 0; i < N; i++) {
      var d = DATA[i];
      var s = (d.tag + ' ' + d.chap + ' ' + d.doc + ' ' + d.stem + ' ' + (d.body || '')).toLowerCase();
      var ok = true;
      for (j = 0; j < terms.length; j++) { if (terms[j] && s.indexOf(terms[j]) < 0) { ok = false; break; } }
      if (ok) list.push(d);
    }
    hint.textContent = '命中 ' + list.length + ' 条' + (list.length > 60 ? '（显示前 60）' : '');
    var html = [], m, e;
    for (m = 0; m < list.length && m < 60; m++) {
      e = list[m];
      html.push('<li><a href="' + e.file + '#' + e.id + '">' + esc(e.tag) + '</a>' +
        '<span class="m">' + esc(e.chap || e.doc) + '　' + esc(e.stem) +
        (e.body ? '<span class="bd">' + esc(e.body.slice(0, 90)) + '…</span>' : '') + '</span></li>');
    }
    out.innerHTML = html.join('');
  } catch (err) { hint.textContent = '搜索出错：' + err.message; }
}
input.addEventListener('input', run);
document.addEventListener('keydown', function(e){
  if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
});
var mq = location.search.match(/[?&]k=([^&]*)/);
if (mq) { input.value = decodeURIComponent(mq[1]); }
run();
