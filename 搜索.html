2014-12", "stem": "一台照相机只能够对其 0.6 m 以前的物体成像。通过增加近拍镜可以拍摄更近的物体，要使该照相机能够拍摄其 0.2 m 以前的物体，近拍镜的焦距应该为多少？（将近拍镜看作薄透镜）", "body": "", "img": 0, "chap": "第十章 · 光学仪器11 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q069", "tag": "2014-13", "stem": "现有焦距分别为 −10 mm、10 mm 和 200 mm 的三个薄透镜和一个光阑，试用其中的两个薄透镜和光阑设计一个无渐晕的望远镜系统：（1）画出光学系统的结构图；（2）该系统的", "body": "", "img": 0, "chap": "第十章 · 光学仪器11 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q070", "tag": "2015-10", "stem": "将一个像方焦距为 40 mm，直径 D1 = 30 mm 的薄透镜做成放大镜，眼瞳位于透镜像方焦点 F′ 上，眼瞳直径 D2 = 4 mm，物面放在透镜物方焦平面上。试问：（1）哪", "body": "1与 2013-12 逐字相同，结论直接沿用：眼瞳张角 0.05 rad < 镜框 0.375 rad，故孔径光阑 = 眼瞳、视场光阑 = 镜框。 2入瞳在物方无穷远，物方孔径角 2U = D2/f′ = 4/40 = 0.1 rad。 3入窗 = 镜框本身（放大镜处，Ø30）；半视场 y ≤ 26 mm ⇒ 全线视场 2y = 52 mm。 同 2013-12：光阑为眼瞳（孔径）/镜框（视场），入瞳在无穷远、孔径角 0.1 rad，入窗在镜框处，无渐晕线视场 2y = 52 mm（半视场 26 mm）。", "img": 0, "chap": "第十章 · 光学仪器11 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q071", "tag": "2015-11", "stem": "已知显微镜的视角放大率为 −300×，目镜的焦距为 20 mm，求显微镜物镜的倍率。假定人眼的视角分辨率为 60″，问使用该显微镜观察时，能分辨的两物点的最小距离等于多少。", "body": "1Γ2 = 250/20 = 12.5，Γ1 = −300/12.5 = −24× 2δ = 250 × (60/206265)/300 = 2.42×10−4 mm ≈ 0.24 μm 同 2012-13：物镜 −24×，最小分辨距离 0.24 μm。若改用衍射判据 0.61λ/NA（λ = 550 nm，NA ≈ 0.65）也落在 0.5 μm 量级，两法互相印证。", "img": 0, "chap": "第十章 · 光学仪器11 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q001", "tag": "2017-四-4", "stem": "一个人眼看不清楚 5m 以内的物体，如果校正时应该佩戴眼镜的屈光度为多少？某照相机可拍摄的最近距离为 1m，装上 2 个屈光度（f = 500mm）的近拍镜后，能拍摄的最近距离是多", "body": "", "img": 0, "chap": "A · 人眼与照相机1 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q002", "tag": "2024-四-3", "stem": "有一焦距 f′ = 40 mm、口径 D1 = 30 mm 的薄透镜（作放大镜用），物体位于物方焦点 F 上，眼睛位于像方焦点 F′ 上（眼睛直径 D眼 = 4 mm）。试求：（1", "body": "", "img": 0, "chap": "B · 放大镜2 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q003", "tag": "2017-四-3", "stem": "将一个像方焦距 f = 40mm，直径 D1 = 30mm 的薄透镜做成放大镜，眼睛位于透镜像方焦点 F 上，眼睛直径 D2 = 4mm，物面放在透镜物方焦点 F 上。试问：（1）", "body": "1瞳孔（4 mm @ 透镜后 40 mm）经透镜成像：l′ = 20 mm、β = 0.5 ⇒ 2 mm，比透镜框 30 mm 小 孔径光阑 = 眼睛瞳孔（4 mm）；视场光阑 = 透镜框（30 mm） 2入瞳：光阑经前面元件（透镜）成像 ⇒ 2 mm，位于透镜后 20 mm（虚像） 3出瞳：光阑后面没有光学元件 ⇒ 出瞳就是光阑本身 出瞳 = 4 mm，位于 F′（透镜后 40 mm，与瞳孔重合） 4入窗：视场光阑前面也没有元件 ⇒ 入窗 = 透镜框，φ30 mm，在透镜处 5出窗：视场光阑后面只有眼睛（不参与成像） ⇒ 出窗 = 透镜框，φ30 mm，同样在透镜处 （1）孔径光阑 = 眼睛瞳孔，视场光阑 = 透镜框；（2）入瞳 φ2 mm、透镜后 20 mm（虚），出瞳 φ4 mm、透镜后 40 mm；入窗、出窗都与透镜框重合，φ30 mm、在透镜处。 规律：只有\"后面还有元件\"时才会出现\"入瞳≠出瞳\"。放大镜后面什么都没有", "img": 0, "chap": "B · 放大镜2 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q004", "tag": "2022-三-7", "stem": "有一显微镜系统，物镜的放大率为 −40、目镜的倍率为 15（薄透镜），物镜的共轭距为 195mm，求物镜和目镜的焦距、物体的位置和光学筒长、物镜与目镜的间距、系统等效焦距、总倍率。", "body": "", "img": 0, "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q005", "tag": "2018-四-3", "stem": "一个视角放大率为 −40× 的显微镜，由焦距 35mm 的物镜和焦距为 25mm 的目镜组成，试求该显微镜物镜的放大倍率及显微镜的总焦距。", "body": "", "img": 0, "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q006", "tag": "2024-四-4", "stem": "用两个 f′ = 50mm 的正透镜组成放大率为 10 倍的显微镜，求物镜、目镜的放大倍率以及目镜和物镜的距离。", "body": "1目镜（fe′ = 50 mm）的视放大率 Γe = 25050 = 5× 2总 Γ = −10×（显微镜给出倒立像），故物镜的线放大率 βo = −105 = −2× 3由 βo = −Δ/fo′ 得光学筒长，再求中间像位置 Δ = 2 × 50 = 100 mm， l′ = Δ + fo′ = 150 mm 核对：1/150 + 1/75 = 0.02 ⇒ fo′ = 50 mm ✓（物在物镜前 75 mm） 4两镜间距：中间像正是目镜物方焦面上的物 d = l′ + fe′ = 150 + 50 = 200 mm 物镜 −2×、目镜 5×（视放大率），两镜间距 200 mm（光学筒长 100 mm）。", "img": 0, "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q007", "tag": "2016-四-2", "stem": "已知显微镜的视角放大率为 −125×，目镜的焦距为 20mm，求显微镜物镜的倍率。假定人眼的视角放大率为 60″，问使用该显微镜观察时，能分辨的两物点的最小距离等于多少。", "body": "1目镜视放大率 Γe = 250/20 = 12.5× βo = −12512.5 = −10× 2题给的\"60″\"就是人眼的分辨角 1′。换到明视距离 250 mm 上的线分辨 δ眼 = 250 × tan 1′ = 250 × 2.909×10−4 = 0.0727 mm 3显微镜把物放大 |Γ| 倍送到眼前，所以\"刚好被人眼分辨\"的物方间隔 δ = δ眼|Γ| = 0.0727125 = 5.82×10−4 mm = 0.58 μm 物镜倍率 −10×；能分辨的最小距离 ≈ 0.58 μm（5.8×10−4 mm）。 题面勘误：原文\"人眼的视角放大率为 60″\"应为\"人眼的视角分辨率（分辨角）为 1′ = 60″\"。这里按 1′ 计算。另外此解是\"按人眼极限倒推\"的口径；若给数值孔径 NA，应改用 δ = 0.61λ/NA。", "img": 0, "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q008", "tag": "2019-四-3", "stem": "现用显微镜观察一个物体，已知该显微镜的光学筒长为 150mm，物镜的焦距为 20mm，目镜的视放大率为 12.5×，求（长度的计算结果精确到 0.01mm）：（1）总的视角放大率；", "body": "", "img": 0, "chap": "C · 显微镜5 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q009", "tag": "2021-四-4", "stem": "想设计一个由两个正的薄透镜构成的放大倍率为 10× 的望远镜，如果物镜的像方焦距为 20cm。（1）试问应该选择焦距为多大的目镜；（2）如果眼睛的角分辨极限为 1′，要求通过该望远", "body": "", "img": 0, "chap": "D · 望远镜4 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q010", "tag": "2019-四-2", "stem": "一架望远镜由两个正薄透镜组成，已知物镜的像方焦距 f′ = 1000mm，其通光口径 D = 50mm，物镜与目镜的空间间隔为 1200mm，目镜的通光口径 D = 20mm。今在", "body": "", "img": 0, "chap": "D · 望远镜4 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q011", "tag": "2023-四-4", "stem": "有一个筒长为 280mm，物镜架开口大小为 30mm 的镜架，在其镜架上安装两个薄透镜构成放大率大小为 15× 成直立像的望远镜：（1）应选择的物镜、目镜的焦距各为多少？（2）如物", "body": "", "img": 0, "chap": "D · 望远镜4 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第10章-光学仪器.html", "id": "q012", "tag": "2020-四-4", "stem": "现有焦距分别为 −10mm、10mm 和 200mm 的三个薄透镜和一个光阑，试用其中的两个薄透镜和光阑设计一个无渐晕的望远镜系统：画出光学系统的结构图；该系统的视角放大率为多少；", "body": "", "img": 1, "chap": "D · 望远镜4 题 ·", "doc": "851 计算题 · 第十章 光学仪器"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q001", "tag": "2015-3", "stem": "设空气中一单色平面光波的频率为 ν = 1014 Hz，电场强度的振幅大小为 1 V/m。t = 0 时刻，在 xoy 平面（z = 0）上的相位分布如图所示，等相位线与 x 轴垂", "body": "", "img": 1, "chap": "一 · 光波场表达式与空间频率1 题 · 考纲点名 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q002", "tag": "2017-二-1", "stem": "一束自然光由空气经红宝石（n = 1.76）的表面反射，若检测其反射光为全偏振光，则入射角应为多少？求此入射角入射条件下，透射光的强度和偏振度。", "body": "", "img": 0, "chap": "二 · 布儒斯特角与偏振度3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q003", "tag": "2019-二-1", "stem": "一束光由空气经透明玻璃平板（n = 1.56）的表面反射，若检测到反射光强为零，求这束光的偏振态和入射角。（计算结果用反三角函数表示）", "body": "1反射光强为零 ⇒ 满足布儒斯特条件，且入射光不能含 s 分量 θ = θB = arctan 1.56 ≈ 57.3° 2偏振态：线偏振光，振动方向平行于入射面（纯 p 分量）。 入射角 θ = arctan 1.56 ≈ 57.3°；入射光为振动面平行于入射面的线偏振光。 反向问法也常考：若问\"反射光为全偏振光\"，答案是自然光或部分偏振光（只要含 p、s，反射后只剩 s）。", "img": 1, "chap": "二 · 布儒斯特角与偏振度3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q004", "tag": "2016-二-2", "stem": "光强为 I0 的线偏振光以 θi 角由空气斜入射到玻璃片 M（n = 1.50，背面涂黑）上，若入射线偏振光的振动平面与入射面的夹角为 45°，入射角 θi = 30°，求玻璃片的", "body": "", "img": 1, "chap": "二 · 布儒斯特角与偏振度3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q005", "tag": "2022-三-1", "stem": "一平面光波以 30° 角由空气入射到折射率为 1.52 的平行平板上，其振动平面与入射面的夹角为 45°，试求该平板上表面的反射率和平板上、下表面反射光的振动方向。", "body": "", "img": 0, "chap": "三 · 菲涅尔公式、反射率与振动方向3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q006", "tag": "2024-二-2", "stem": "振动方向与入射面夹角为 45° 的线偏振光，30° 角入射时，n = 1.5 的玻璃，求反射光的反射率 R 和振动方向。", "body": "1θt：sin θt = 1/3 ⇒ θt = 19.47° 2 Rs = 5.78%， Rp = 2.53% 3等幅两分量 ⇒ R = (Rs + Rp)/2 = 4.2% 4 tan α′ = rs/rp = −0.240/0.159 = −1.512 ⇒ α′ ≈ −56.5° R ≈ 4.2%；反射光振动方向与入射面成 56.5°（因 rs 反相，偏向入射面另一侧）。 速记：45° 入射 + rs、rp 异号 ⇒ 反射光振动面对称\"翻转\"，角度从 45° 变到 ≈56.5°。", "img": 0, "chap": "三 · 菲涅尔公式、反射率与振动方向3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q007", "tag": "2018-二-1", "stem": "自然光以 20° 角方向入射到某种晶体上，n = 1.52。 （1）求晶体表面的反射率和反射光的偏振度； （2）给晶体外加一电场时，晶体由各向同性变为单轴晶体，且光轴平行于晶体表面", "body": "", "img": 0, "chap": "三 · 菲涅尔公式、反射率与振动方向3 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q008", "tag": "2020-二-1", "stem": "迎着光传播方向观察，一束左旋圆偏振光的光强为 I0，由空气垂直入射到折射率为 1.5 的玻璃上，求反射光的偏振态和光强。", "body": "1正入射反射系数 r = (n2−n1)/(n2+n1) = (1.5−1)/(1.5+1) = 0.2 2反射率 R = r² = 0.04 ⇒ Ir = 0.04 I0 3偏振态：正入射时 rp = −rs，两分量都反号但相对相位差增加 π，圆偏振的旋向反转 左旋 → 右旋圆偏振光 反射光为右旋圆偏振光，光强 0.04 I0。 易错点：① 忘记 rp、rs 反号，答\"仍是左旋\"；② 把光强算成 0.2 I0（那是振幅比，不是光强比）。 记忆：圆偏振光正入射反射，旋向必反转；斜入射时不一定。", "img": 1, "chap": "四 · 正入射与全反射2 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第1章-电磁理论.html", "id": "q009", "tag": "2023-二-1", "stem": "如图，经两侧面反射后从斜面反方向射出，入射光强 I0，求 I。", "body": "1光路分解：正入射进入（一次透射）→ 两个侧面各全反射一次 → 再正入射射出（一次透射）。 2全反射时若无吸收、无散射，反射率 = 1，两次全反射不损失能量（这是全反射的特点，也是它被用作反射棱镜的原因）。 3进、出两个表面都是正入射，各有一次反射损失。设棱镜折射率 n： R = [(n−1)/(n+1)]²， 透射率 T = 1 − R I = I0 · T · 1 · 1 · T = I0(1 − R)² 理想情形（忽略表面反射损失、全反射无损耗）：I ≈ I0。 计入两表面反射：I = I0[1 − ((n−1)/(n+1))²]²（n = 1.5 时约 0.92 I0；n = 1.52 时约 0.919 I0）。 题干未给 n，两种写法都留——先写\"全反射无损失 ⇒ I ≈ I0\"，再补\"若计表面反射则为 …\"，不会丢分。", "img": 1, "chap": "四 · 正入射与全反射2 题 ·", "doc": "851 计算题 · 第一章 光的电磁理论基础"}, {"file": "851-计算题-第2章-干涉.html", "id": "q001", "tag": "2016-二-1", "stem": "在双缝干涉实验中，缝间距为 0.5 mm，观察屏距离缝 1.2 m，现用读数显微镜测得 10 个干涉条纹（准确说是 11 个亮条或暗条）之间的距离为 12 mm，试求所用光的波长。", "body": "111 个亮条之间是 10 个间距 Δx = 12 mm / 10 = 1.2 mm 2 λ = Δx·d/D = 1.2×10−3 × 0.5×10−3 / 1.2 = 5.0×10−7 m λ = 500 nm；白光时：中央（k=0）仍是白光，两侧形成彩色条纹，因 Δx ∝ λ 使红光条纹最宽、紫光最窄，高级次处各色重叠 → 只能看到少数几级彩色，再往外模糊成白色。", "img": 1, "chap": "A · 杨氏双缝4 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q002", "tag": "2017-二-2", "stem": "S1、S2 小孔的间距为 0.5 mm，光屏离小孔的距离为 50 cm，当以厚度为 1.667×10−2 mm、折射率为 1.60 的透明薄片贴住小孔 S1 时，发现屏上的条纹有移", "body": "", "img": 1, "chap": "A · 杨氏双缝4 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q003", "tag": "2021-二-1", "stem": "杨氏双缝实验中，双缝间距 d = 0.5 mm，接收屏距双缝 D = 1 m，点光源距双缝 l = 30 cm，点光源发射波长为 500 nm 的单色光，试求：（1）屏上的条纹间距", "body": "", "img": 0, "chap": "A · 杨氏双缝4 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q004", "tag": "2023-二-2", "stem": "杨氏干涉实验中，用波长为 640 nm 的光垂直照射间距为 0.4 mm 的两个小孔，小孔离接受屏幕 50 cm，求：（1）距离中央条纹 0.1 mm 处的 p 点的光强和中央点的", "body": "", "img": 1, "chap": "A · 杨氏双缝4 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q005", "tag": "2022-三-2", "stem": "如图所示，两相干平面光波，其一在 xz 平面沿与 z 轴夹角 θ1 方向传播，其二在 xz 平面沿与 z 轴夹角 θ2 方向传播，试求该二光波在 z 平面上的干涉条纹形状和条纹间距", "body": "", "img": 1, "chap": "B · 两束平面波干涉2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q006", "tag": "2024-二-3", "stem": "如图，两相干平面光波 k1、k2 在 xz 平面内传播、对称入射到 z = 0 平面，与 z 轴夹角均为 θ = 30°，波长 λ = 632.8 nm；两波振动方向均在 xoz ", "body": "", "img": 1, "chap": "B · 两束平面波干涉2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q007", "tag": "2018-二-2", "stem": "如图所示的劈尖薄膜，右端厚度 h 为 0.05 mm，折射率为 1.5，波长为 707 nm 的光以 30° 角入射到上表面，求在这个面上产生的条纹数。若以两块玻璃片形成的空气尖劈", "body": "", "img": 1, "chap": "B · 两束平面波干涉2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q008", "tag": "2019-二-2", "stem": "某光源发出波长很接近的两单色光，平均波长为 600 nm，通过间隔 d = 10 mm、腔镜反射率为 0.98 的法布里–珀罗干涉仪观察时，看到波长为 λ1 的光所产生的干涉条纹正", "body": "", "img": 0, "chap": "D · F-P 干涉仪与干涉滤光片2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q009", "tag": "2020-二-2", "stem": "今有一干涉滤光片，其间隔层厚度为 2×10−4 mm，折射率 n = 1.5，高反膜的反射率 R = 0.9，试求：光波垂直入射，滤光片在可见光区的中心波长及其透射带波长半宽度；当", "body": "", "img": 0, "chap": "D · F-P 干涉仪与干涉滤光片2 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第2章-干涉.html", "id": "q010", "tag": "2021-二-3", "stem": "在折射率 n = 1.6 的光学玻璃基底上镀氟化镁膜层 n = 1.38，要求对波长为 500 nm 的光在正入射时给出最小反射率，试求：镀膜材料氟化镁膜层厚度及相应的最小反射率；", "body": "", "img": 0, "chap": "E · 光学薄膜1 题 ·", "doc": "851 计算题 · 第二章 光的干涉"}, {"file": "851-计算题-第3章-衍射.html", "id": "q001", "tag": "2023-二-3", "stem": "夫朗和费双缝衍射中，双缝间距 0.178 mm，缝宽 0.0445 mm。透镜的焦距 f = 50 cm，用波长为 532 nm 的平行光垂直照射双缝衍射屏，求：（1）其衍射图样在", "body": "", "img": 0, "chap": "A · 双缝夫琅和费衍射1 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q002", "tag": "2018-二-3", "stem": "若人造卫星上的宇航员恰好能分辨离他 100 km 地面上的两个点光源，则这两个点光源的距离为多大？假设光波的波长为 550 nm，宇航员的瞳孔直径为 4 mm。", "body": "1最小分辨角 θmin = 1.22λD = 1.22 × 550×10−94×10−3 = 1.68×10−4 rad 2换算成地面距离 s = L·θmin = 100×103 × 1.68×10−4 ≈ 16.8 m 两点距离约 16.8 m —— 所以从太空肉眼是分不清汽车和楼房细节的。", "img": 0, "chap": "B · 分辨本领3 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q003", "tag": "2024-二-1", "stem": "人眼瞳孔直径 D = 2 mm，光波长 λ = 550 nm，能否看清 20 m 外间隔 5 mm 的两条线。", "body": "1能分辨的最小距离（20 m 处） smin = L · 1.22λD = 20 × 1.22 × 550×10−92×10−3 = 20 × 3.355×10−4 ≈ 6.7 mm 2比较：5 mm < 6.7 mm 5 mm < smin = 6.7 mm 看不清。要看清 5 mm，瞳孔至少需 ≈ 2.7 mm（或把距离缩到 15 m 内）。", "img": 0, "chap": "B · 分辨本领3 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q012", "tag": "2024-二-4", "stem": "单缝夫琅禾费衍射，λ1 = 400 nm，λ2 = 660 nm，缝宽 a = 1×10−2 cm，透镜焦距 f = 50 cm。 （1）求两光第一级衍射明纹中心的距离； （2）用", "body": "", "img": 0, "chap": "B · 分辨本领3 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q013", "tag": "2014-4", "stem": "波长为 589.3 nm 的平行光以 30° 斜入射照射光栅，光栅宽 40 mm，每毫米有 500 条刻痕，透明与不透明宽度相等。求： （1）该光栅能呈现的全部级次； （2）正入射", "body": "", "img": 0, "chap": "B · 分辨本领3 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q004", "tag": "2021-二-2", "stem": "反射式天文望远镜物镜的通光孔径为 2.5 m，求当发射波长为 550 nm 的光波时，可以分辨的双星的最小夹角？为充分利用物镜的分辨本领，该望远镜的放大率以多大为宜？（人瞳孔的直径", "body": "1最小分辨角 θmin = 1.22550×10−92.5 = 2.68×10−7 rad ≈ 0.055″ 2\"充分利用口径\"的判据：出射光瞳直径等于人眼瞳孔 M = Dd = 25002 = 1250× 3验算：放大后要能被人眼分辨 M ≥ 1′θmin = 2.91×10−42.68×10−7 ≈ 1090 1250 > 1090 ✓，两个判据都满足。 最小分辨角 2.68×10−7 rad（0.055″）；放大率宜取 1250×。", "img": 0, "chap": "B · 分辨本领3 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q005", "tag": "2020-二-3", "stem": "一光栅宽为 5 cm，每毫米内有 500 条刻线。当用波长为 500 nm 的平行光垂直照射时，其第 3 级衍射光谱处在单缝衍射第一极小位置。试求：光栅每个缝的宽度；光栅第二级可分", "body": "1光栅常数与缝宽：第 3 级缺级 ⇒ d/a = 3 d = 1500 mm = 2 μm， a = d3 ≈ 0.667 μm 2总缝数 N = 500 条/mm × 50 mm = 25000 δλ = λkN = 500 nm2×25000 = 0.01 nm 3二级衍射角：sinθ = 2λ/d = 1.0/2 = 0.5 ⇒ θ = 30°，cosθ = 0.866 Δθ = λNd cosθ = 500×10−925000×2×10−6×0.866 ≈ 1.15×10−5 rad 缝宽 0.667 μm；二级最小波长差 0.01 nm；二级半角宽度 1.15×10−5 rad。", "img": 0, "chap": "C · 光栅5 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q006", "tag": "2017-二-3", "stem": "用波长为 600 nm 的光垂直照射总宽度为 36 mm、缝宽为 0.8 μm 的光栅，观察到第三级衍射谱线处在单缝衍射的第一极小值位置，求：（1）零级谱线半角宽度；（2）第二级谱", "body": "1d = 3a = 2.4 μm；N = 36 mm / 2.4 μm = 15000 Δθ0 = λNd = 600×10−915000×2.4×10−6 ≈ 1.67×10−5 rad 2 δλ = λkN = 600 nm2×15000 = 0.02 nm 3最高级次 kmax = d/λ = 2.4/0.6 = 4；缺级 d/a = 3 ⇒ ±3 缺 可见：0、±1、±2、±4 共 7 条 零级半角宽 1.67×10−5 rad；二级最小波长差 0.02 nm；实际可见 7 条（0、±1、±2、±4）。", "img": 0, "chap": "C · 光栅5 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q007", "tag": "2019-二-3", "stem": "平面透射光栅每毫米内 400 条刻线，光栅宽为 5 cm。当波长为 500 nm 的平行光垂直入射到该光栅，发现第 4 级衍射光谱处在单缝衍射的第一极小位置，试求：衍射中央峰的角宽", "body": "", "img": 0, "chap": "C · 光栅5 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q008", "tag": "2018-二-4", "stem": "单色平行光的波长为 λ = 490 nm，透光缝的宽度 a = 1.0×10−4 cm，不透光缝的宽度 b = 2.0×10−4 cm。（1）若单色光垂直照射在光栅上，最多能观察到", "body": "", "img": 0, "chap": "C · 光栅5 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q009", "tag": "2021-二-4", "stem": "钠黄光中包含 589.0 nm 和 589.6 nm 两条谱线，使用宽度为 50 mm、每毫米含有 100 条狭缝的平面透射式光栅，求其夫朗和费衍射第 2 级光谱中两条谱线的角间距", "body": "1d = 1/100 mm = 10 μm，N = 100×50 = 5000 2二级衍射角：sinθ = 2λ/d = 2×589.3e-9/10e-6 = 0.1179 ⇒ θ = 6.77°，cosθ = 0.9930 3角色散率与角间距 dθdλ = kd cosθ = 210×10−6×0.9930 ≈ 2.01×105 rad/m Δθ = 2.01×105 × 0.6×10−9 ≈ 1.21×10−4 rad 4分辨判据 R实际 = kN = 2×5000 = 104 > λΔλ = 589.30.6 ≈ 982 角间距 1.21×10−4 rad；R = 104 远大于所需的 982，能分辨。", "img": 0, "chap": "C · 光栅5 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q010", "tag": "2023-二-4", "stem": "Q 为垂直光轴切割、表面平行的单轴晶片，R 是一块刻痕密度为 500 条/mm，有效宽度为 50 mm 的衍射光栅。问： （1）垂直入射的平行可见光（380–780 nm）通过 Q", "body": "", "img": 1, "chap": "A · 一块晶片 + 光栅1 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第3章-衍射.html", "id": "q011", "tag": "2016-二-3", "stem": "设计一块光栅，要求使波长 λ = 600 nm 的第二级谱线的衍射角 θ ≤ 30°，色散尽可能大，第三级谱线缺级，对于波长 λ = 600 nm 的二级谱线能分辨 0.02 nm", "body": "", "img": 0, "chap": "B · 设计光栅1 题 ·", "doc": "851 计算题 · 第三章 光的衍射"}, {"file": "851-计算题-第4章-光在各向异性介质中的传播特性.html", "id": "q001", "tag": "2020-二-4", "stem": "一细光束掠入射厚度为 5 cm 的单轴晶体平行平板，晶体的光轴与入射面垂直。若 n0 = 1.525，ne = 1.479，试计算在第二个面上输出二光分开的距离，并绘出光路图。", "b var input = document.getElementById('q'), out = document.getElementById('out'),
    hint = document.getElementById('hint'), N = DATA.length;
var FLT = { real: false, img: false };
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function hl(s, terms){
  var parts = [{ t: String(s == null ? '' : s), hit: false }];
  for (var i = 0; i < terms.length; i++) {
    var term = terms[i];
    if (!term) continue;
    var lowTerm = term.toLowerCase(), next = [], p, seg;
    for (p = 0; p < parts.length; p++) {
      seg = parts[p];
      if (seg.hit) { next.push(seg); continue; }
      var low = seg.t.toLowerCase(), k = 0;
      while (true) {
        var q = low.indexOf(lowTerm, k);
        if (q < 0) { next.push({ t: seg.t.slice(k), hit: false }); break; }
        if (q > k) next.push({ t: seg.t.slice(k, q), hit: false });
        next.push({ t: seg.t.slice(q, q + term.length), hit: true });
        k = q + term.length;
      }
    }
    parts = next;
  }
  return parts.map(function (x) { return x.hit ? '<mark>' + esc(x.t) + '</mark>' : esc(x.t); }).join('');
}
function isReal(d){ return /真题/.test(d.doc || '') || /真题/.test(d.chap || ''); }
function run(){
  try {
    var k = (input.value || '').trim().toLowerCase();
    var terms = k ? k.split(/\s+/) : [];
    var list = [], i, j;
    for (i = 0; i < N; i++) {
      var d = DATA[i];
      if (FLT.real && !isReal(d)) continue;
      if (FLT.img && !d.img) continue;
      var s = (d.tag + ' ' + d.chap + ' ' + d.doc + ' ' + d.stem + ' ' + (d.body || '')).toLowerCase();
      var ok = true;
      for (j = 0; j < terms.length; j++) { if (terms[j] && s.indexOf(terms[j]) < 0) { ok = false; break; } }
      if (ok) list.push(d);
    }
    var extra = (FLT.real ? '　· 只看真题' : '') + (FLT.img ? '　· 只看有图' : '');
    if (!terms.length && !extra) {
      hint.textContent = '共 ' + N + ' 条　·　空格分隔多个词，全部命中才列出';
      out.innerHTML = '';
      return;
    }
    hint.textContent = '命中 ' + list.length + ' 条' + (list.length > 60 ? '（显示前 60）' : '') + extra;
    var html = [], m, e;
    for (m = 0; m < list.length && m < 60; m++) {
      e = list[m];
      html.push('<li><a href="' + e.file + '#' + e.id + '">' + hl(e.tag, terms) + '</a>'
        + '<button class="g851-ai-btn g851-ai-mini" type="button" data-ai-tag="' + esc(e.tag)
        + '" data-ai-title="' + esc(e.stem || '') + '" title="AI 讲这题">AI</button>' +
        '<span class="m">' + hl(e.chap || e.doc, terms) + '　' + hl(e.stem, terms) +
        (e.body ? '<span class="bd">' + hl(e.body.slice(0, 90), terms) + '…</span>' : '') + '</span></li>');
    }
    out.innerHTML = html.join('');
    if (window.G851AI) G851AI.bind(out);
  } catch (err) { hint.textContent = '搜索出错：' + err.message; }
}

<script>
/* G851_RAIL_JS */
(function(){
  var el = document.getElementById('g851-rail');
  if (!el || el.getAttribute('data-init')) return;
  el.setAttribute('data-init', '1');
  var tab = el.querySelector('.tab'), openT = null, closeT = null;
  function open(){ clearTimeout(closeT); el.classList.add('open'); tab.setAttribute('aria-expanded','1'); }
  function close(){ el.classList.remove('open'); tab.setAttribute('aria-expanded','0'); }
  tab.addEventListener('mouseenter', function(){
    clearTimeout(openT);
    openT = setTimeout(function(){ if (tab.matches(':hover')) open(); }, 150);
  });
  tab.addEventListener('mouseleave', function(){ clearTimeout(openT); });
  el.addEventListener('mouseleave', function(){ closeT = setTimeout(close, 350); });
  el.addEventListener('mouseenter', function(){ clearTimeout(closeT); });
  tab.addEventListener('click', function(e){
    e.stopPropagation();
    if (el.classList.contains('open')) close(); else open();
  });
  document.addEventListener('click', function(e){ if (!el.contains(e.target)) close(); });
  window.addEventListener('scroll', function(){ close(); }, {passive:true});
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') close();
    else if (e.key === '?' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) {
      e.preventDefault(); el.classList.contains('open') ? close() : open();
    }
  });
  var here = decodeURIComponent((location.pathname.split('/').pop() || 'index.html'));
  Array.prototype.forEach.call(el.querySelectorAll('a'), function(a){
    if (a.getAttribute('href') === here) a.classList.add('cur');
  });
  var parts = (document.title || '').split('·').map(function(s){ return s.replace(/^851\s*/, '').trim(); })
    .filter(function(s){ return s && s !== '851'; });
  el.querySelector('.cur-page').textContent = parts[0] || here;

  /* ── 新版本提示 / 离线提示 ── */
  (function () {
    function toast(msg, actionText, onClick, ms) {
      var d = document.createElement('div');
      d.id = 'g851-toast';
      var s = document.createElement('span');
      s.textContent = msg;
      d.appendChild(s);
      if (actionText) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = actionText;
        b.addEventListener('click', onClick);
        d.appendChild(b);
      }
      document.body.appendChild(d);
      setTimeout(function () { d.classList.add('on'); }, 30);
      if (ms) setTimeout(function () {
        d.classList.remove('on');
        setTimeout(function () { d.parentNode && d.parentNode.removeChild(d); }, 300);
      }, ms);
    }
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      if (navigator.serviceWorker.controller) {
        var fired = 0;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (fired) return;
          fired = 1;
          toast('库已更新到新版本', '刷新', function () { location.reload(); }, 15000);
        });
      }
    }
    var off = null;
    function refreshOffline() {
      if (navigator.onLine) {
        if (off && off.parentNode) { off.parentNode.removeChild(off); off = null; }
      } else if (!off) {
        off = document.createElement('div');
        off.id = 'g851-offline';
        off.textContent = '离线中 · 已缓存的内容仍可看';
        document.body.appendChild(off);
      }
    }
    window.addEventListener('online', refreshOffline);
    window.addEventListener('offline', refreshOffline);
    refreshOffline();
  })();
