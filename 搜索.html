<script>
var DATA = [{"file": "851-应用光学-简答与画图-p49-56.html", "id": "q001", "tag": "2017-三-2", "stem": "什么是光学系统的完善像，光学系统成完善的条件是什么？", "body": "完善像：由同一物点发出的所有光线，经系统后都交于同一点（点对点成像），像面上得到清晰的点像，称该像点为物点的完善像。等价说法：系统把发散的球面波变换成会聚的球面波。 成完善像的条件： 等光程（费马原理）：物点到像点的任意两条光路，光程相等； 正弦条件：轴外点还要满足 n y sinu = n′y′ sinu′，否则宽光束有彗差。 背：完善像 = 点对点 + 等光程；轴外点再加正弦条件。", "img": 0, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q002", "tag": "2018-三-1（前）", "stem": "光学系统的完善的成像条件是什么？", "body": "物点与像点之间所有光线的光程相等（等光程条件），即实际波面为以像点为中心的球面；对轴外点还要满足正弦条件，保证宽光束无彗差。同时满足这两条的系统称为理想光学系统。 背：等光程 + 正弦条件。", "img": 0, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q003", "tag": "2019-三-1", "stem": "光学系统成完善像的条件是什么？试由该条件确定将无穷远的物点经单一曲面反射成完善实像点的曲面形状。", "body": "条件：等光程（轴外点再加正弦条件）。 面形：旋转抛物面。平行光（无穷远物点）沿轴入射，反射后会聚于焦点，焦点就是像点；抛物面上任一点到焦点的距离等于它到准平面的距离，故各条光路光程相等 —— 满足等光程，成完善像。 背：无穷远物点 → 抛物面（焦点即像点）；有限共轭点 → 椭球面（两焦点为物、像点）。", "img": 0, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q004", "tag": "2020-三-2（前）", "stem": "光学系统的完善成像条件是什么？", "body": "同一物点发出的所有光线经系统后光程相等并交于同一点；轴外点还需正弦条件 n y sinu = n′y′ sinu′。 背：等光程（轴上）+ 正弦条件（轴外）。", "img": 0, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q005", "tag": "2021-三-1", "stem": "什么是光学系统的完善像？格里高利双反射式望远镜的次镜为了将主镜在有限位置的实像（对次镜为实物）进一步成像为有限处的实像，它的次镜反射面的几何面应该是什么形状，并说明原因？", "body": "完善像：同一物点发出的所有光线经系统后交于同一点。 次镜面形：旋转椭球面（凹面）。椭球的两个焦点分别与被成像的物点（主镜所成的实像点）和最终像点重合。 原因：次镜要把有限距离的实物点成实像于另一有限距离处，等光程要求 |AP| + |PA′| = 常数；到两定点距离之和为常数的曲面正是以这两点为焦点的旋转椭球面。 背：主镜抛物面（无穷远→焦点），次镜椭球面（焦点对焦点）；两个焦点就是物点与像点。", "img": 1, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q006", "tag": "2023-三-3", "stem": "关于 z 坐标轴旋转对称的反射曲面经过坐标原点 O，可以将旋转对称轴上实物点 A 反射成像在 A′，如果 AO = 4 cm，AA′ = 2 cm，试基于光完善条件确定反射面的方程", "body": "等光程：|AP| + |PA′| = 常数；取 P = O 得常数 = 4 + 2 = 6 cm。 到两定点距离之和为常数 ⇒ 旋转椭球面，A、A′ 为焦点：2a = 6 ⇒ a = 3，2c = 2 ⇒ c = 1，b2 = 8；中心在 z = −3（O 为原点、光沿 +z）。 (z + 3)29 + x2 + y28 = 1 （cm） 答：旋转椭球面，(z+3)2/9 + (x2+y2)/8 = 1（cm）。详细推导见《计算题-应用光学-解析法》附录 C。", "img": 1, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q007", "tag": "2024-三-1", "stem": "成完善像的物理含义与条件是什么？分析单个球面折射镜（透镜）能不能成完善像；单个球面反射镜成的是什么像？有限距离实物点经单一曲面反射成完善像点，曲面形状是什么？", "body": "条件：等光程 +（轴外）正弦条件。 物理含义：物点发出的同心光束经系统后仍是同心光束（等价说法：物点到像点沿各条光路光程相等）。 单个球面折射镜（透镜）：不能 —— 球面折射对有限孔径有球差，只有近轴小光束才近似完善（齐明点等特例除外）。 单个球面反射镜：一般也不能 —— 同样有球差。能完善成像的只有特殊共轭位置： 物点在球心 C：所有光线沿半径入射、原路返回，像也在 C； 物点在镜面顶点：像与物重合于顶点（平凡情形）。 要在有限共轭距下真正完善成像，面形须是椭球面（两焦点为物、像点）；物在无穷远时须是抛物面。 背：球面镜只有“物在球心”“物在顶点”两处完善，其余有球差。", "img": 0, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q037", "tag": "2016-三-1", "stem": "解释光学系统的两种像差：像散和场曲。", "body": "像散：光学系统在两个相互垂直的方向上聚焦本领不同 —— 一个物点发出的两束相互垂直的光（子午、弧矢）交于不同位置，在像面上形成两条互相垂直的焦线。 场曲：考虑有一定大小的物面成像时，平面物所成的清晰像面是一张曲面（匹兹伐面），平面接收面上只有中心或边缘能同时清晰。 背：像散 = 两个方向的焦点不重合；场曲 = 清晰像面是弯的。两者都随视场增大（∝视场²），常同时出现。", "img": 0, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q038", "tag": "2016-三-2", "stem": "简述物方远心光路和像方远心光路的特点及应用情况。", "body": "物方远心光路：把孔径光阑放在像方焦平面上，使物方主光线平行于光轴（汇聚中心在物方无穷远）。物平面位置有误差时像高不变 ⇒ 消除视差，用于测长。 像方远心光路：把孔径光阑放在物方焦平面上，使像方主光线平行于光轴（汇聚中心在像方无穷远）。像面位置有误差时像高不变 ⇒ 用于测距（如带分划板的测距仪）。 一句话记：光阑放在像方焦点 ⇒ 物方远心（测长）；光阑放在物方焦点 ⇒ 像方远心（测距）。光阑放哪边焦点，哪边就「远心」。", "img": 1, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q039", "tag": "2016-三-3", "stem": "用图解法画出垂轴实物 AB 的像 A′B′（已知 H、H′、F、F′）。", "body": "图 · 点开看作图答案（2016 答案册 p106）规范作图（答案册原图）：由 B 作平行光轴光线 → 出射后（延长线）过 F′；由 B 作过 F 的光线 → 出射后平行光轴。两条出射光线的反向延长线交于 B′，A′ 在轴上 ⇒ 虚像、正立、缩小（A′B′ 比 AB 短，且与物同侧）。注意本题 F′ 在 H 左侧、F 在 H′ 右侧 —— 负光组。 作图三线（任取两条即可）： 过 B 作平行于光轴的光线 → 射到像方焦平面后过 F′ 出射； 过 B 作过物方焦点 F 的光线 → 出射后平行于光轴； 过 B 作过物方主点 H 的光线 → 从像方主点 H′ 沿同方向射出。 两条出射线的交点即 B′，由 A 作垂轴得 A′B′。 判虚实：实物在一倍焦距以内 ⇒ 出射线发散、交点在同侧 ⇒ 正立放大虚像；在一倍焦距以外 ⇒ 倒立实像。", "img": 1, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q040", "tag": "2016-三-4", "stem": "已知物体为右手坐标系，oz 为光轴方向，画出棱镜系统的像方成像坐标方向。", "body": "", "img": 1, "chap": "A · 完善像与完善成像条件7 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q008", "tag": "2018-三-1（后）", "stem": "解释实际光学系统的像差概念？光学系统的几何像差主要包括哪几种？", "body": "像差：实际光学系统所成的像与理想（高斯）像之间的偏差。本质是实际出射波面偏离了理想的球面波。 几何像差： 单色像差 5 种：球差、彗差、像散、场曲、畸变； 色差 2 种：位置色差（轴向色差）、倍率色差（垂轴色差）。 背：单色五种“球彗像场畸”，色差两种“位置、倍率”。", "img": 0, "chap": "B · 几何像差与色差5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q009", "tag": "2020-三-2（后）", "stem": "光学系统的色差主要包括哪几种，解释其产生的原因？", "body": "位置色差（轴向色差）：轴上物点不同波长的光成像位置不同（焦距随波长变），像点沿光轴前后分开，屏上看到彩色圆斑。 倍率色差（垂轴色差）：不同波长的垂轴放大率不同，同一物高的像高不同，像的边缘出现彩色镶边。 原因：光学材料折射率随波长变化（色散），n 随 λ 减小而增大，使不同色光的焦距和放大率不同。 背：色差 = 色散引起；位置色差沿轴、倍率色差垂轴。", "img": 1, "chap": "B · 几何像差与色差5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q010", "tag": "2021-三-2", "stem": "什么是光学系统的像差？下图 (a) 和 (b) 分别给出了物体经过两个光学系统成像后像面，试问这时它们各自主要存在哪种单色像差？", "body": "像差：实际像与理想像的偏差（实际波面偏离理想球面波）。 (a) 畸变：正方形像四边内凹、四角外伸，放大率随视场增大 —— 是正（枕形）畸变。像本身仍清晰，只是形状变了（物像不相似）。 (b) 像散：同心圆（切向）与辐射线（弧矢）属于子午、弧矢两个方向，两者不能同时清晰，说明子午像与弧矢像不重合 —— 典型像散（通常伴随场曲）。 答：(a) 正畸变（枕形）；(b) 子午面上的像散。「(a)正畸变，(b)子午面上的像散」—— 与判读一致。怎么一眼分：畸变看直线弯不弯（方形物体边变弯；四角外拉=枕形/正畸变，四边外鼓=桶形/负畸变）；像散看两个方向能不能同时清晰（同心圆与辐射线一个清晰另一个必糊，就是子午、弧矢焦线不重合）。", "img": 1, "chap": "B · 几何像差与色差5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q011", "tag": "2023-三-1", "stem": "从物像关系画图说明什么是光学成像的畸变像差，并解释其形成原因。", "body": "定义：同一物平面内，不同视场的垂轴放大率不同，使像与物不相似（直线变弯），但每个像点仍清晰。定量：主光线与高斯像面的交点高度 y′ 不等于理想像高 y0′，畸变 Δy′ = y′ − y0′。 原因：畸变来自孔径光阑的位置——光阑不在透镜上时，不同视场的主光线以不同高度穿过透镜，主光线本身的球差使像高 y′ 偏离理想值 y0′，于是垂轴放大率 β = y′/y 不再是常数，像与物不相似。两个要点别写错：①光阑与透镜重合（主光线过透镜中心）时畸变为零 —— 所以“光阑位置是主因”，不是“透镜不同区域焦距不同”；②畸变不模糊（每点仍是清晰点），这一点与球差、彗差、像散、场曲都不同，别把它归因于一般球差。 两种：正畸变（枕形，β 随视场增大，四角外伸）；负畸变（桶形，β 随视场减小，四边外鼓）。 背：畸变 = 放大率随视场变 → 物像不相似但清晰；正枕形、负桶形；光阑位置是主因。", "img": 1, "chap": "B · 几何像差与色差5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q012", "tag": "2024-三-2", "stem": "两个像散，场曲的概念，对成像又有何影响？", "body": "像散：轴外物点发出的细光束经系统后，子午方向与弧矢方向的聚焦位置不同，形成两条互相垂直的短焦线（子午焦线、弧矢焦线），两线之间为最小弥散圆。影响：轴外点不能成清晰的点像，像被拉成椭圆或短线，视场越大越明显。 场曲：即使没有像散，平面物体的像面也不是平面而是曲面（子午场曲、弧矢场曲，两者一般不重合）。影响：用平面探测器接收时，中心调焦清晰则边缘离焦模糊，反之亦然，有效视场受限。 背：像散 = 子午/弧矢焦线分离；场曲 = 像面是弯的；两者都使轴外像质下降，且常同时出现。", "img": 0, "chap": "B · 几何像差与色差5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q013", "tag": "2018-三-2", "stem": "对于一个光学系统，什么是孔径光阑，它与入瞳和出瞳的关系是什么？什么是视场光阑，它与入窗和出窗的关系是什么？", "body": "孔径光阑：系统中限制轴上物点成像光束孔径角（光束立体角）的那个光阑，它决定进入系统的光能量和系统的分辨率。 入瞳：孔径光阑经它前方光组所成的像，是物方孔径角的入口； 出瞳：孔径光阑经它后方光组所成的像，是像方孔径角的出口； 三者互为共轭；入瞳对轴上物点的张角即物方孔径角。 视场光阑：限制物平面（或像平面）上成像范围的光阑，决定视场大小。 入窗：视场光阑经前方光组所成的像； 出窗：视场光阑经后方光组所成的像； 入窗对入瞳中心的张角 = 物方视场角；出窗对出瞳中心的张角 = 像方视场角；过入瞳中心的光线叫主光线。 背：光阑→入瞳/出瞳（前/后成像），视场光阑→入窗/出窗；入瞳定孔径，入窗定视场。", "img": 0, "chap": "C · 孔径光阑与视场光阑1 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q014", "tag": "2017-三-3", "stem": "什么是光亮度和光照度？并写出它们定义的数学表达式。", "body": "光亮度 L：发光面上一点在给定方向上的发光强度 dI，与该面元在垂直于该方向的投影面积 dA cosθ 之比。 L = dIdA cosθ （cd/m2） 光照度 E：照射到面元上的光通量 dΦ 与该面元面积 dA 之比。 E = dΦdA （lx） 配套的两个量：发光强度 I = dΦ/dΩ（cd），光通量 Φ（lm）。 背：亮度 = 单位投影面积上的发光强度（cd/m²）；照度 = 单位面积上的光通量（lx）。", "img": 0, "chap": "D · 光度学：光亮度与光照度1 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q015", "tag": "2019-三-2", "stem": "费马原理的内容是什么？试用该原理解释光在均匀各向同性的介质中沿直线传播。", "body": "内容：光从一点传播到另一点，其实际路径使光程取极值（极小、极大或稳定值），即光程的一阶变分为零： δ∫AB n ds = 0 解释直线传播：均匀各向同性介质中 n = 常数，光程 = n × 几何路程；两点间几何路程以直线最短，故光程也最小，光沿直线传播。 背：费马 = 光程取极值（δ∫n ds = 0）；均匀介质 n 为常数 → 直线最短 → 直线传播。", "img": 0, "chap": "E · 费马原理1 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q016", "tag": "2019-三-3", "stem": "什么是光学系统的景深？景深的大小受哪些因素影响？照相时为了增加景深，光圈应该增大还是减小？", "body": "景深：在像面上能成清晰像的物空间深度（= 远景深度 + 近景深度），即物平面前后能清晰成像的范围。景深端点对应弥散圆直径等于允许值。 影响因素： 光圈（相对孔径）：越小（F 数越大）景深越大； 焦距：越短景深越大； 摄距：越远景深越大； 允许弥散圆：越大景深越大。 增加景深：缩小光圈（增大 F 数）。 背：景深 ∝ 1/光圈、∝ 1/焦距²、∝ 摄距²；要景深就收小光圈。", "img": 0, "chap": "F · 景深1 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q017", "tag": "2019-三-4", "stem": "什么是屋脊棱镜？试列举一个屋脊棱镜，并给出平面表示图。", "body": "定义：把直角棱镜的一个反射面（通常是斜面）做成 90° 屋脊（两个互相垂直的反射面）的棱镜。屋脊的两个面各反射一次（共两次），使像在垂直于屋脊的方向上倒转，常用于望远系统/双筒望远镜的倒像。 举例：屋脊直角棱镜（阿贝棱镜）、屋脊五角棱镜、屋脊半五角棱镜。 平面表示图画法（答题时按这四步画）： 画直角棱镜的三角形轮廓（直角在左上，斜边朝右下）； 把斜边改画成“人”字形折线（两条 45° 线交于屋脊棱），在棱上标 90°； 画出光线：从前表面入射 → 在屋脊两面各反射一次 → 从另一表面出射； 用箭头标出出射方向相对入射方向折转 180°（反向），像上下颠倒。 背：屋脊棱镜 = 斜面做成 90° 双反射面的棱镜；两次反射、像沿垂直屋脊方向倒转；例：屋脊直角棱镜。", "img": 0, "chap": "G · 屋脊棱镜1 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q018", "tag": "2020-三-1", "stem": "阐述显微镜光学系统结构组成和成像放大原理；显微镜分辨率受哪些物理参量影响？", "body": "组成：物镜 + 目镜（外加聚光镜、光源、载物台）。 放大原理：物体放在物镜前焦点外不远处，物镜先成放大实像于目镜前焦面附近；目镜再把该实像放大成虚像（正常调节时在无穷远，或成在明视距离）供人眼观察。两次放大： Γ = β物 · Γ目 = (−Δf′物) · 250 mmf′目 其中 Δ 为光学筒长（物镜后焦点到目镜前焦点的距离）。 分辨率：受物镜数值孔径 NA = n sinu 与波长限制， δ = 0.61λNA 影响因素：波长 λ（越短越好）、介质折射率 n、孔径角 u（NA 越大越好），以及照明方式与像差校正水平。 背：物镜成实像、目镜再放大；Γ = β物·250/f′目；分辨率 δ = 0.61λ/(n sin u)。", "img": 0, "chap": "H · 显微镜1 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q019", "tag": "2023-三-2", "stem": "什么是放大镜的视角放大率？放大倍数 5× 的放大镜焦距多少？", "body": "定义：视角放大率 = 用仪器后像对人眼的张角 ω′，与不用仪器、把物放在明视距离（250 mm）处时对人眼的张角 ω 之比：Γ = tanω′/tanω。 放大镜把物放在前焦点内、像成在无穷远（正常调节）时：Γ = 250 mm/f′。 f′ = 2505 = 50 mm 答：f′ = 50 mm（按像在无穷远）；若约定像成在明视距离，则 Γ = 1 + 250/f′，f′ = 62.5 mm。", "img": 0, "chap": "I · 放大镜与视角放大率1 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q020", "tag": "2017-三-4", "stem": "作出虚物 A 经光组所成的像 A′。", "body": "", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q021", "tag": "2017-三-5", "stem": "作图确定下图的节点 J 和 J′。", "body": "", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q022", "tag": "2018-三-3", "stem": "作实物 ABC 的像 A′B′C′。", "body": "", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q023", "tag": "2019-三-5", "stem": "作出虚物 AB 经光组所成的像 A′B′。", "body": "", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q024", "tag": "2019-三-6", "stem": "如图，一个理想光学系统，π1 和 π1′ 为一对垂直放大率为 1 的共轭面，π2 和 π2′ 为一对垂直放大率为 −1 的共轭面，试作图确定物点 A 的像点。", "body": "", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q025", "tag": "2020-三-3", "stem": "作虚物 AB 的像 A′B′。", "body": "", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q026", "tag": "2021-三-3", "stem": "作图确定物体 AB 的像。", "body": "", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q027", "tag": "2021-三-4", "stem": "作图确定下面光组的基点 H′ 和 J。", "body": "", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q028", "tag": "2022-二-2", "stem": "作垂轴实物 AB 的像 A′B′", "body": "作图：同 2021-三-3。平行于光轴的光线出射后反向延长过 F′；过 F 的光线出射后平行于光轴；两线延长交点 = B′，轴上得 A′。 结果：虚像、正立、缩小，位于 F′ 与 H 之间，与物同侧。 答：负光组实物 → 虚像（F′–H 之间），正立缩小。 关于答案图：2022 卷没有官方答案册，本题的作图只能按「特殊光线 + 交点」自行核对（步骤见上），本站不再补图。", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q029", "tag": "2023-三-5", "stem": "定 A 的像。", "body": "判断：F 在 H 左侧、F′ 在 H′ 右侧 → 正光组；A 在 F 之外（|l| > f），故像为实像、倒立，位于 F′ 以右。 作图：A 在轴上，取轴外辅助光线：过 A 作一条光线交 H 于 M，在 H′ 取等高 M′；过 F 作与 AM 平行的辅助光线，出射后平行于光轴，它与 M′ 的出射光线交于 A′（轴上）。 结果：A′ 在 F′ 右侧，实像；A 越靠近 F，A′ 越远、放大率越大。 答：A′ 为实像，位于 F′ 以右（物在 F 外 → 实像倒立）。", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q030", "tag": "2024-三-3", "stem": "画出 AB 所成的像。", "body": "图 · 点开看作图答案（24 年答案册 p6）规范作图（答案册原图）：系统是负光组（F′ 在 H 左侧、F 在 H′ 右侧）。① 由 B 作平行光轴的光线，出射后发散，其反向延长线过 F′；② 由 B 作过 F 的光线，出射后平行于光轴。两条出射光线的反向延长线交于 B′（落在 F′–H 之间、轴上侧）⇒ 虚像、正立、缩小。 作图：与 2021-三-3 同。注意 F′ 在左侧，平行光线的出射光线要往左下方反向延长才与 F′ 相交。 结果：虚像、正立、缩小，在 F′ 与 H 之间。 答：负光组 → 虚像（F′–H 之间），正立缩小。", "img": 1, "chap": "J · 图解法：物像作图11 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q031", "tag": "2017-三-6", "stem": "已知物空间的右手坐标系 o-xyz，oz 为光轴方向，作平面镜与一个等腰直角棱镜构成系统的像方坐标系 o′-X′Y′Z′。", "body": "光路：光沿 +z 进入棱镜 → 在“/”斜面全反射，折向 +y（向上）→ 出射后打在“\\”平面镜上 → 再反射，折回 −z（向左）。 反射次数：2 次 → 手性不变，仍为右手系。 坐标轴：两个镜面法线都在 yz 平面内，x 轴不变；两次反射把 z、y 各反一次： X′ = x， Y′ = −y， Z′ = −z 即出射光轴与入射反向，像上下、前后都反，左右不变（角反射器效果）。 答：出射沿 −z；X′ = x、Y′ = −y、Z′ = −z；两次反射，右手系。", "img": 1, "chap": "K · 棱镜系统的像方坐标系5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q032", "tag": "2018-三-4", "stem": "已知物体为右手坐标系，oz 为光轴方向，作棱镜系统的像方成象坐标方向。", "body": "", "img": 1, "chap": "K · 棱镜系统的像方坐标系5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q033", "tag": "2020-三-4", "stem": "已知物体为右手坐标系，oz 为光轴方向，作棱镜系统的像方成象坐标方向。", "body": "同 2018-三-4：三块棱镜共 4 次反射 → 右手系；出射光轴与入射同向 ⇒ z′ = z。 答：4 次反射 → 右手系；z′ = z，两块直角棱镜各把横向翻一次 ⇒ x′ = −x、y′ = −y，即绕光轴转 180°（与 2018-三-4 同型链、同一结论）。已改：本页原写「三轴同向」，与本文件 2018-三-4 的结论（同型链、答案册 p118 图给出横向两轴反向）自相矛盾，按 2018 的逐次镜像改正。若本卷原图棱镜摆向不同，以原图逐个数反射面。", "img": 1, "chap": "K · 棱镜系统的像方坐标系5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q034", "tag": "2022-二-1", "stem": "已知物体为右手坐标系，oz 为光轴方向，作棱镜系统的像方成象坐标方向。", "body": "光路：光沿 +z → 先经“\\”平面镜反射，折向 −x（向下）→ 进入直角棱镜，在“\\”斜面再反射 → 折回 +z 出射。 次数与手性：2 次 → 右手系。 坐标轴：两面平行（潜望镜式），出射与入射同向，每个轴反射两次回到原方向： X′ = x， Y′ = y， Z′ = z 只是光轴平移了一段距离（原点 o′ 在出射点）。 答：两镜平行 → 出射沿 +z，三轴同向，右手系（与物方完全相同，只平移）。", "img": 1, "chap": "K · 棱镜系统的像方坐标系5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q035", "tag": "2024-三-4", "stem": "物体先经薄透镜（物在一倍焦距之外），再过一块平面镜，再过一块等腰直角反射镜（带一个屋脊面），画出像的 xyz 坐标系。题面两源有出入：答案册写「一倍焦距外」，回忆版（计算题分题型 ", "body": "判读：按答案册题面，系统是「薄透镜（物在一倍焦距外，成倒立实像）→ 平面镜 → 带屋脊面的等腰直角反射镜」。本页配图只画了后两个镜子，缺薄透镜与屋脊，画图时以题面为准。 作图：与 2022-二-1 同一系统 —— 平面镜与棱镜斜面平行，2 次反射，出射光轴 +z。 X′ = x， Y′ = y， Z′ = z（右手系） 像（竖直箭头）相对物：上下、左右都不变（两次反射抵消），只是位置平移；若物恰在透镜前焦点，像在无穷远，仅方向有意义。 答：光轴方向不变（出射仍沿 +z）。要点左右手系取决于反射总次数：平面镜 1 次 + 等腰直角反射镜 1 次，屋脊面再多算 1 次 ⇒ 共 3 次（奇），横向轴应反号 ⇒ 应为左手系；若不计屋脊（按本页原图 2 次）则为右手系。答案册只给图不给结论，考场按原卷图数反射面：数出几个反射面就是几次，奇数次必镜像。", "img": 1, "chap": "K · 棱镜系统的像方坐标系5 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q036", "tag": "2023-三-4", "stem": "施密特棱镜的入射面前面有一个物体 AB，画出图中经过物点 A 的入射光线的光路及其在出射光线上像 A′B′ 的方向。", "body": "", "img": 1, "chap": "L · 施密特棱镜光路1 条 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q-2010-8", "tag": "2010-8", "stem": "作图。(1) 作轴上虚物点 A 的像点 A′。(2) 作垂轴虚物 AB 的像 A′B′。", "body": "按上面五条要点作图即可；原卷图已附在上方，用于核对光路走向与虚实线。（1）作轴上虚物点 A 的像 A′：三条特殊光线——平行于光轴的光线出射后过 F′；过 F 的光线出射后平行于光轴；过主点 H 的光线方向不变。虚物取入射光线的反向延长线，交点即 A′，虚线画。（2）作垂轴虚物 AB 的像 A′B′：由 B 引两条特殊光线交于 B′，由 B′ 向光轴作垂线得 A′；虚物、虚像一律取延长线并画虚线。判分点：三条特殊光线 + 实线/虚线（虚物、虚像部分画虚线）。2010 卷只考这两小问，没有像散/棱镜坐标系那两问（那是 2011、2012 卷的）。", "img": 1, "chap": "早年图解法作图题（2010–2015）6 题 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q-2011-8", "tag": "2011-8", "stem": "画图题。(1) 作垂轴虚物 AB 的像 A′B′。(2) 同心圆＋沿半径方向直线的平面物，圆心在轴上；系统旋转对称并考虑像散，分别画出子午焦面与弧矢焦面上的图像。(3) 右手坐标系", "body": "按上面五条要点作图即可；原卷图已附在上方，用于核对光路走向与虚实线。（1）按三条特殊光线求像：平行于光轴→过 F′，过 F→平行出射，过主点→方向不变；虚物、虚像取延长线并画虚线。（2）像散：子午焦面上弧矢方向线条清晰、同心圆拉成沿子午方向的椭圆，弧矢焦面反之；场曲则\"中心清晰\"与\"边缘清晰\"各画一幅。（3）棱镜坐标系按四步法：Oy 沿棱线、屋脊面个数定 O′y′ 是否反向、反射面数（屋脊算两个）定右手/左手系。", "img": 1, "chap": "早年图解法作图题（2010–2015）6 题 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q-2012-8", "tag": "2012-8", "stem": "画图题。(1) 作垂轴实物 AB 的像 A′B′。(2) 十字线分划板平面物，存在严重场曲；分别画出中心调焦清晰与边缘调焦清晰两种情况下的图像。(3) 右手坐标系、oz 为光轴，作", "body": "按上面五条要点作图即可；原卷图已附在上方，用于核对光路走向与虚实线。（1）按三条特殊光线求像：平行于光轴→过 F′，过 F→平行出射，过主点→方向不变；虚物、虚像取延长线并画虚线。（2）像散：子午焦面上弧矢方向线条清晰、同心圆拉成沿子午方向的椭圆，弧矢焦面反之；场曲则\"中心清晰\"与\"边缘清晰\"各画一幅。（3）棱镜坐标系按四步法：Oy 沿棱线、屋脊面个数定 O′y′ 是否反向、反射面数（屋脊算两个）定右手/左手系。", "img": 1, "chap": "早年图解法作图题（2010–2015）6 题 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q-2013-8", "tag": "2013-8", "stem": "画图题。(1) 作垂轴虚物 AB 的像 A′B′。(2) 十字线＋同心圆平面物；考虑场曲和像散，画出中心调焦清晰时的场曲图像，以及弧矢焦面上的像散图像。(3) 右手坐标系、oz 为", "body": "按上面五条要点作图即可；原卷图已附在上方，用于核对光路走向与虚实线。（1）按三条特殊光线求像：平行于光轴→过 F′，过 F→平行出射，过主点→方向不变；虚物、虚像取延长线并画虚线。（2）像散：子午焦面上弧矢方向线条清晰、同心圆拉成沿子午方向的椭圆，弧矢焦面反之；场曲则\"中心清晰\"与\"边缘清晰\"各画一幅。（3）棱镜坐标系按四步法：Oy 沿棱线、屋脊面个数定 O′y′ 是否反向、反射面数（屋脊算两个）定右手/左手系。", "img": 1, "chap": "早年图解法作图题（2010–2015）6 题 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q-2014-8", "tag": "2014-8", "stem": "画图题。(1) 已知理想系统的主点 H、H′ 与焦点 F、F′，画图求垂轴实物 AB 的像 A′B′。(2) 同心圆＋辐条平面物，考虑像散，分别画出子午焦面与弧矢焦面上的图像。(3", "body": "按上面五条要点作图即可；原卷图已附在上方，用于核对光路走向与虚实线。（1）按三条特殊光线求像：平行于光轴→过 F′，过 F→平行出射，过主点→方向不变；虚物、虚像取延长线并画虚线。（2）像散：子午焦面上弧矢方向线条清晰、同心圆拉成沿子午方向的椭圆，弧矢焦面反之；场曲则\"中心清晰\"与\"边缘清晰\"各画一幅。（3）棱镜坐标系按四步法：Oy 沿棱线、屋脊面个数定 O′y′ 是否反向、反射面数（屋脊算两个）定右手/左手系。", "img": 1, "chap": "早年图解法作图题（2010–2015）6 题 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-应用光学-简答与画图-p49-56.html", "id": "q-2015-8", "tag": "2015-8", "stem": "画图题。(1) 作垂轴实物 AB 的像 A′B′。(2) 同心圆＋辐条平面物，只考虑像散，分别画出子午焦面与弧矢焦面上的图像。(3) 右手坐标系、oz 为光轴，作棱镜系统像方空间坐", "body": "按上面五条要点作图即可；原卷图已附在上方，用于核对光路走向与虚实线。（1）按三条特殊光线求像：平行于光轴→过 F′，过 F→平行出射，过主点→方向不变；虚物、虚像取延长线并画虚线。（2）像散：子午焦面上弧矢方向线条清晰、同心圆拉成沿子午方向的椭圆，弧矢焦面反之；场曲则\"中心清晰\"与\"边缘清晰\"各画一幅。（3）棱镜坐标系按四步法：Oy 沿棱线、屋脊面个数定 O′y′ 是否反向、反射面数（屋脊算两个）定右手/左手系。", "img": 1, "chap": "早年图解法作图题（2010–2015）6 题 ·", "doc": "851 应用光学 · 简答与画图（p49–56）"}, {"file": "851-真题-2025-2026.html", "id": "q250101", "tag": "2025-一-1", "stem": "法布里-波罗干涉仪透射光的干涉条纹跟反射光的干涉条纹的区别？", "body": "1两套条纹是互补的。设镜面反射率 R、透射率 T（吸收略去），精细度系数 F = 4R/(1−R)²，δ 为相邻两束的相位差 IT = IiT2(1−R)211+F sin2(δ/2) ， IR = IiF sin2(δ/2)1+F sin2(δ/2) 2透射光：极大处 IT = Ii，极小处几乎为 0 ⇒ 暗背景上的细亮纹；反射光：极大处接近 Ii，只在 δ = 2kπ 处掉到很小 ⇒ 亮背景上的细暗纹。 3二者满足 IT + IR = Ii（无吸收时），一条亮一条就暗，明暗位置互换。 一句话：透射＝暗底上的细亮纹，反射＝亮底上的细暗纹，两者互补；R 越大，亮纹越细锐。", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250102", "tag": "2025-一-2", "stem": "平行平板多光束干涉透射光和反射光图样的区别，工程上一般使用透射光还是反射光？等倾干涉条纹要清晰对光源有什么要求？", "body": "1图样区别：与一·1 完全同构 —— 透射光是暗背景上的细亮纹，反射光是亮背景上的细暗纹（互补）。 2工程上用透射光：反射条纹是\"亮背景上的细暗纹\"，背景太亮、暗纹对比度低，眼睛和探测器都不易辨别；透射条纹背景黑、亮纹锐，信噪比高。 3对光源的要求（把答案册两条展开成可背的四条）： ① 单色性要好 ② 相干性要好（时间相干：2nh cosθ ≤ 相干长度） ③ 观察等倾圆环要用扩展光源 + 会聚透镜（同一入射角的光会聚到焦面同一点，才形成同心圆环）；④ 平板两表面要平行、平整（面形误差直接叠加到条纹上）。 用透射光；光源要单色性好、相干性好（并配扩展光源 + 会聚透镜看等倾环）。", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250103", "tag": "2025-一-3", "stem": "FP 干涉仪和光栅分光的原理有什么区别，一般在较大范围内分光采用那种元件，为什么？", "body": "1原理不同：F-P 用多光束干涉（等倾多光束干涉，靠相邻光束的相位差 δ = (4π/λ)·nh·cosθ 选频）；光栅用多缝衍射（靠 d sinθ = kλ 把不同波长送到不同方向）。 2自由光谱范围 Δλ = λ/k 决定\"能一次看多宽\"： 光栅：k = 1~2 ⇒ Δλ ≈ 250~500 nm（覆盖整个可见区） F-P 标准具：k = 2nh/λ ≈ 4×104（h = 1 cm） ⇒ Δλ = λ/k ≈ 0.0125 nm 3所以大范围分光用光栅光谱仪：级次低、自由光谱范围大、不重叠；F-P 级次高到 10⁴–10⁵，只能在极窄波段内工作（专门用来分辨谱线的精细/超精细结构，分辨本领极高）。 原理：干涉 vs 衍射；大范围分光选光栅（Δλ = λ/k 大）；F-P 级次 10⁴–10⁵，只能用来看极窄波段。", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250104", "tag": "2025-一-4", "stem": "在一个白纸上画一个黑点，用方解石晶体放在纸上观察黑点能看到什么现象？", "body": "1现象：看到两个清晰的黑点（双像）。 2原因：方解石（CaCO₃）是负单轴晶体（no = 1.658 > ne = 1.486）。自然光斜射入晶体后分解为 o 光（遵守折射定律、振动垂直于主截面）和 e 光（一般不遵守折射定律、振动在主截面内），两束传播方向不同，各自成一个像 ⇒ 双折射双像。 3可加分的观察细节：转动晶体时，o 光的像不动，e 光的像绕 o 光的像转动；沿光轴方向观察时两像重合、只剩一个。 两个黑点（双折射双像）；转晶体时一个不动、一个绕转；沿光轴看只有一个。", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250105", "tag": "2025-一-5", "stem": "自然光射入一间暗室，分别从 45°、90°、180° 观察，观察到的瑞利散射光强比是多少？", "body": "1瑞利散射（微粒线度 ≪ λ）对自然光入射的角分布 I(θ) = Iz(1 + cos2θ) （θ 为观察方向与入射光传播方向的夹角；另有 1/λ4 因子） 2逐项代入 I(45°) = Iz(1 + 0.5) = 1.5Iz ； I(90°) = Iz ； I(180°) = Iz(1 + 1) = 2Iz 3取比 1.5 : 1 : 2 = 3 : 2 : 4 4顺带记：90° 方向的散射光是完全线偏振的（振动垂直于观察面），180° 方向仍是自然光 —— 这是\"天空为什么蓝、且偏振\"的同一套公式。 I(45°) : I(90°) : I(180°) = 3 : 2 : 4。", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250106", "tag": "2025-一-6", "stem": "纵向应用 KDP 晶体图示为一电光调制器。A 为纵向运用的电光晶体 KDP（no = 1.512，γ63 = 10.6×10−10 cm/V），P 为偏振器，入射的线偏振光波长 λ", "body": "", "img": 1, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250201", "tag": "2025-二-1", "stem": "一束振幅为 A 的自然光从空气垂直入射到折射率为 1.5 的玻璃上。（1）反射光和透射光的振幅和强度。（2）反射光和透射光的偏振度。", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250202", "tag": "2025-二-2", "stem": "如图，杨氏双缝干涉，S′ 与 S 分别为两个点光源。（1）若 S′S1 − S′S2 = λ/2，求 S 开或 S′ 开或同时开时的干涉光强分布；（2）若 S′S1 − S′S2 ", "body": "", "img": 1, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250203", "tag": "2025-二-3", "stem": "在折射率 n = 1.6 的光学玻璃基底上镀膜层 n = 2.35，要求对波长为 500 nm 的光在正入射时给出最小反射率，试求：最大最小反射率以及对应膜层厚度为多少？", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250204", "tag": "2025-二-4", "stem": "有一束直径为 2 mm 的红宝石激光（λ = 694.3 nm）自地面射向月球，已知地面—月球距离为 3.76×105 km，试问在月球上的光斑有多大？如果反向运用望远镜将激光束扩", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250205", "tag": "2025-二-5", "stem": "一光栅宽为 5 cm，每毫米内有 500 条刻线。当用波长为 500 nm 的平行光垂直照射时。试求：光栅第二级可分辨的最小波长差；光栅第二级衍射光谱的半角宽度；如果遮住一半的缝，", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250206", "tag": "2025-二-6", "stem": "如图所示，一负单轴晶体构成的直角棱镜，光轴平行于直角棱，自然光从左方垂直入射。（1）画出 o 光、e 光的光路并确定它们的振动方向。（2）求证：e 光经棱镜反射后与光轴夹角为 θe", "body": "", "img": 1, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250301", "tag": "2025-三-1", "stem": "成完善像的条件？有限距离物成有限距离像，其折射面形状？按照该条件分析一个物点经曲面反射后成实像的曲面形状，实物点成虚像曲面形状？无穷远处物成实像的曲面形状？", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250302", "tag": "2025-三-2", "stem": "光学系统的像差是影响光学系统成像质量的一个关键因素，试问什么是光学系统的像差？畸变的定义和形成原理。", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250303", "tag": "2025-三-3", "stem": "分别画出等腰直角棱镜作为一次反射棱镜和二次反射棱镜的光路图。", "body": "1一次反射棱镜：光垂直射入一个直角面 → 在 45° 斜面上反射一次 → 垂直射出另一个直角面。出射光相对入射光折转 90°；一次反射 → 成镜像（右手系变左手系，物像奇偶性改变）。 2二次反射棱镜：光垂直射入斜面（或直角面）→ 在两个面上各反射一次 → 出射光与入射光反向平行（折转 180°）；两次反射 → 正像（奇偶性不变，右手系仍为右手系）。 3判据（考试常问）：反射次数为奇数 → 镜像；偶数 → 正像；\"折转 90°/180°\"由两次镜面的夹角决定（两面夹角 φ ⇒ 折转 2φ）。 图 手写答案册第 4 页的原图（红笔）：左＝一次反射棱镜，水平入射、斜面反射一次、竖直出射（折转 90°）；右＝二次反射棱镜（蓝笔），在两个面上各反射一次后反向平行射出（折转 180°）。 一次反射：折转 90°、成镜像；二次反射：折转 180°、成正像。", "img": 1, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250304", "tag": "2025-三-4", "stem": "作轴上虚物点 A 的像点 A′。（图：光轴上从左到右依次为 F、H、H′、F′、A，A 在 F′ 之外）", "body": "", "img": 1, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250305", "tag": "2025-三-5", "stem": "作图确定下图的节点 J 和 J′。（图：光轴上标出 F、H、H′、F′）", "body": "", "img": 1, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250401", "tag": "2025-四-1", "stem": "后视镜要使车后方物体成缩小的像，应该选择凹面镜还是凸面镜？若要使车后方物体成放大的像，应该选择凹面镜还是凸面镜？", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250402", "tag": "2025-四-2", "stem": "如图，一焦距为 120 cm 的薄透镜后 100 cm 处放置一个与水平方向成 45° 的平面镜，在平面镜上方 60 cm 处有一焦距 30 cm 的薄透镜，薄透镜上方 50 cm", "body": "", "img": 1, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250403", "tag": "2025-四-3", "stem": "一个光学系统由两个薄透镜构成，两个薄透镜的焦距依次为 60 cm 和 40 cm，两者相距 45 cm，已知一个物体位于第一个透镜前 30 cm 处，物高为 1 mm。（1）试计算", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250404", "tag": "2025-四-4", "stem": "在足球场上有一个直径 20 cm 的足球，人在观众席距离场内球 150 m 远观察，人眼的极限分辨角为 1′。（1）人眼能否看清这个足球？（2）足球边上有一个直径 4 cm 的乒乓", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q250405", "tag": "2025-四-5", "stem": "某显微镜系统的参数如下：物镜的数值孔径在空气介质中为 NA1 = 1，在油浸介质中为 NA2 = 1.25；照明光源采用可见光，中心波长（λ = 550 nm）；目镜焦距 fe′ ", "body": "", "img": 0, "chap": "2025 年真题（2024 年 12 月考试）22 题 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260201", "tag": "2026-物-1", "stem": "影响反射率大小的因素。", "body": "1反射率由菲涅耳系数决定：R = |r|²，而 rs ≠ rp ⇒ 偏振态本身就是影响因素。 2四个主要因素： 折射率比 n2/n1：差越大 R 越大；正入射 R = [(n1−n2)/(n1+n2)]²。 入射角：Rs 单调增到 1（掠入射）；Rp 先降到 0（布儒斯特角 taniB = n2/n1）再升到 1。n1 > n2 且超过临界角时全反射，R ≡ 1。 波长（色散）：n = n(λ) ⇒ R 随 λ 变；金属的 R 强烈依赖 λ，所以金属有颜色。 界面状况：粗糙度（漫反射）、镀膜（λ/4 膜可把 R 从 4% 调到 99.9%）、吸收（复折射率）。 四个因素：折射率比、入射角（含布儒斯特角、全反射）、波长/色散、界面状况（粗糙度/镀膜/吸收）；本质都通过菲涅耳系数 r 起作用。 易错：①别漏偏振——问「反射率」要说明是 Rs 还是 Rp；②同一对介质，正入射和掠入射的 R 能差几十倍；③镀膜没改材料，改的是等效反射率", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260202", "tag": "2026-物-2", "stem": "菲涅尔波带片与普通透镜的区别。", "body": "1原理：波带片靠衍射——把波面分成半波带，只让奇数带透光（偶数带遮住），各带在轴上等光程差叠加而会聚；普通透镜靠折射连续改变光程。 2焦点：波带片有多个焦点 f、f/3、f/5 …（主焦点 f = ρ1²/λ，ρ1 为第一半波带半径）；普通透镜单色光下只有一个焦点。 3色差：波带片 f ∝ 1/λ ⇒ 色差远大于普通透镜；透镜可用组合（双胶合）消色差。 4结构与用途：波带片是平面元件，轻、薄、可做大孔径；X 射线、极紫外没有合适透镜，只能用波带片。普通透镜是连续曲面，成像质量好。 一句记：波带片 = 衍射 + 多焦点 + 平面；透镜 = 折射 + 单焦点 + 曲面。主焦点 f = ρ1²/λ。 易错：①不是「菲涅耳螺纹透镜」——那种是把连续面阶梯化，仍是折射，只有一个焦点；②波带片的焦点不唯一，只有问「主焦点」才答 ρ1²/λ；③波带片能成实像这一点和透镜相同。", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260203", "tag": "2026-物-3", "stem": "晶体电光效应可开发的有用器件，至少列举四种。", "body": "1四类核心器件： 电光强度调制器：KDP / LiNbO₃ 横向或纵向运用，I = I0sin²(δ/2)； 电光开关（调 Q 开关）：把 δ 在 0 与 π 之间切换，使谐振腔 Q 值突变，输出巨脉冲； 电光偏转器（扫描器）：棱镜型或双折射型，用电场控制光束偏折方向； 电光相位调制器：只改变相位不改变强度，用于相干通信。 2还可补：空间光调制器 / 电光光阀（显示、光计算）、电光调谐滤波器。 四种：强度调制器、电光开关（Q 开关）、电光偏转器、相位调制器；再补空间光调制器就是五种。 易错：题目问的是电光效应（折射率随电场变）开发的器件，别混进声光器件（布拉格盒、声光偏转器）或磁光器件（法拉第旋转器）——那是别的效应。", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260204", "tag": "2026-物-4", "stem": "什么是一般性吸收和选择性吸收？列举应用实例。", "body": "1一般性（普遍）吸收：吸收系数 α 在很宽的波长范围内几乎不随 λ 变，只让光变弱、不改颜色。例：中性灰滤光片、烟尘、墨汁；玻璃在可见光区的弱吸收。 2选择性吸收：α 随 λ 强烈变化，只在某些波段吸收特别强（吸收带）。例：红玻璃吸蓝绿、透红；叶绿素吸红光与蓝光；原子/分子特征谱线吸收（太阳夫琅禾费线、原子吸收光谱、比色分析）。 3两者定量公式相同：I = I0e−αl，区别只在 α(λ) 的形状。 一般吸收 = α 与 λ 无关、变暗不变色；选择性吸收 = α(λ) 有吸收带、透射光带颜色；公式同为 I = I0e−αl。 易错：①物体显什么颜色由剩下没被吸收的波长决定；②这不是两种介质，而是同一介质在不同波段的表现——玻璃在可见光区接近一般吸收，在紫外/红外就是强选择性吸收。", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260301", "tag": "2026-二-1", "stem": "一右旋圆偏光以 45° 角由水射向空气，n水 = 1.33，其反射、透射光的偏振状态如何变化？如果入射角度为 60° 时，情况如何？（12 分）", "body": "", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260302", "tag": "2026-二-2", "stem": "双光束干涉实验如图：波长 λ = 1.414 μm 的细光束以 30° 角入射到厚度 h = 1 μm、折射率 n1 = 1.5 的介质薄膜，求 P₀ 点是亮纹还是暗纹？若经上表面", "body": "", "img": 1, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260303", "tag": "2026-二-3", "stem": "人眼 De ≈ 2.5 mm，对 λ = 500 nm 的光（8 分）。 （1）求人眼最小分辨角 αe；若要分开相距 d = 0.5 m 的两光点，人眼应距光点多远？ （2）若望远", "body": "", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260304", "tag": "2026-二-4", "stem": "设计一块光栅：要求使 λ = 500 nm 的第二级谱线的衍射角 θ ≤ 30°，且能分辨 0.02 nm 的波长差，第四级谱线缺级，色散尽可能大。（8 分）", "body": "", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260305", "tag": "2026-二-5", "stem": "杨氏双缝实验，小孔 d = 1 mm，圆形光源波长 λ = 500 nm，光源与两小孔中点距离 R = 500 mm。为看清晰条纹，求允许的光源最大宽度 b。此时距孔 1 m 远的", "body": "", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260306", "tag": "2026-二-6", "stem": "单轴晶体的光轴与晶体表面成 θ 角，一束光由空气沿平行光轴的方向入射晶体，是否会发生双折射？原因？", "body": "", "img": 1, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260307", "tag": "2026-二-7", "stem": "顶角 α = 30° 的两个直角三棱镜组成的偏振棱镜，晶体对 o 光和 e 光的折射率分别为 no = 1.49、ne = 1.68，两晶体光轴方向互相垂直，自然光垂直入射（12 ", "body": "", "img": 1, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260101", "tag": "2026-应-1", "stem": "解释投影光学系统成像无渐晕的原因。", "body": "1渐晕是什么：轴外点发出的、本应充满孔径光阑的光束，被其他镜框拦截掉一部分，使像面照度从中心向边缘下降。 2投影（放映）系统用柯勒照明：光源经聚光镜成像在投影物镜的入瞳上；照明系统的出射窗与物面（幻灯片）重合。 3这样轴外点的照明光束与轴上点同样充满物镜入瞳（光瞳衔接），不被镜框切割 ⇒ 无渐晕。幻灯片框本身就是视场光阑（放在中间像面）。 一句话：柯勒照明把光源成像在物镜入瞳、照明出窗与物面重合 ⇒ 轴上轴外光束截面相同 ⇒ 无渐晕。判据就是「光瞳衔接 + 窗与物面重合」。 易错：①无渐晕 ≠ 照度均匀（还有 cos⁴ 衰减、距离平方衰减）；②消渐晕靠光瞳衔接，不是靠把透镜口径做大。", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260102", "tag": "2026-应-2", "stem": "设计一种光学材料折射率的实验测量方法。", "body": "1首选：最小偏向角法（棱镜法）。把材料做成顶角 A 的三棱镜，用单色平行光照射，转动棱镜找到最小偏向角 δmin。 n = sin[(A + δmin)/2]sin(A/2) 只测 A 和 δmin 两个量，精度高，是测固体折射率的标准方法。 2备选方法（写上可显示知识面）： 布儒斯特角法：找反射光只剩 s 分量的角度，taniB = n； 临界角法（阿贝折射仪）：sinic = n2/n1； 干涉法：测厚度 d 与条纹移动数 m，Δn = mλ/(2d)（测的是折射率差）。 3注意事项：必须单色光（否则色散使像模糊）、棱镜面要抛光、多次读数取平均。 主答棱镜最小偏向角法 n = sin[(A+δmin)/2]/sin(A/2)，再补布儒斯特角法 / 临界角法 / 干涉法。 易错：①δmin 必须取偏向角最小时的值，不是任意读数；②布儒斯特角法要用检偏器确认反射光为纯 s 偏振；③干涉法测的是折射率差，不是绝对值。", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260103", "tag": "2026-应-3", "stem": "已知一个十字叉平面物，十字叉中心在某光学系统的光轴上，画出该物经过成像轴外像差——彗差作用后，在理想像面上的光学模糊图像样式。", "body": "", "img": 1, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260104", "tag": "2026-应-4", "stem": "已知物体为右手坐标系 o-xyz，oz 为光轴方向，画出该物体坐标系经过棱镜系统成像后的像方坐标系方向。 （题图：o-xyz 右手系，z 沿光轴向右、x 向上、y 指向纸面外；右侧", "body": "", "img": 1, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260401", "tag": "2026-四-1", "stem": "一个由焦距为 100 mm 的薄透镜和一个二次反射五角棱镜（介质折射率 1.5，两个直角边长均为 60 mm）构成的光学系统，在透镜前 150 mm 处有一个 2 mm 高的物体 ", "body": "", "img": 1, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260402", "tag": "2026-四-2", "stem": "已知双薄光组组合，合成光组焦距为 f′ = 1000 mm，总长（第一光组到系统像方焦点的距离）L = 700 mm，总焦点 l′F = 400 mm，求组成该系统的双光组焦距及其", "body": "", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260403", "tag": "2026-四-3", "stem": "如果照相物镜的对准平面以后的整个空间都能在景像平面上成清晰像，物镜的焦距 f′ = 75 mm，所用光圈数 F = 16。求对准平面位置和近景面的位置。如果调焦于无限远处，即 p ", "body": "", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-真题-2025-2026.html", "id": "q260404", "tag": "2026-四-4", "stem": "设计开普勒望远镜系统的外形尺寸，要求能消除渐晕：镜筒长 L = 250 mm，视角放大率 Γ = −24×，视场角 2ω = 1°40′。求： （1）物镜、目镜的焦距；（2）视场光", "body": "", "img": 0, "chap": "2026 年真题（2025 年 12 月考试）19 题 / 150 分 ·", "doc": "851 真题 · 2025 & 2026（补最近两年）"}, {"file": "851-简答题-按章节.html", "id": "q001", "tag": "2016-1(1)", "stem": "光由光密介质射向光疏介质，在一定条件下会发生全反射。当发生全反射时，光疏介质中是否有光场？如果有，请说明该光场的性质。", "body": "有。光疏介质中存在倏逝波（衰逝波）。 性质： 沿界面方向传播、振幅沿界面法线方向（伸入光疏介质）按指数衰减的非均匀平面波； 穿透深度约为波长量级（d ~ λ）； 沿界面方向平均能流不为零，但沿法线方向平均能流为零，即不向外传输能量； 用受抑全反射（光学隧道效应）实验可证实其存在。", "img": 0, "chap": "一 · 光的电磁理论基础考纲 15 分 · 6 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q002", "tag": "2018-1(1)", "stem": "表达式 E = E0e−i(ωt−kz) 和 E = E0e−i(ωt+kz) 表示的是什么光波？", "body": "两者都是沿 z 轴传播的单色平面波：角频率 ω、波数 k = 2π/λ，等相位面垂直于 z 轴。 区别只在指数中 kz 的符号 —— 它决定传播方向： e−i(ωt−kz)：沿 +z 方向传播（正向行波）； e−i(ωt+kz)：沿 −z 方向传播（反向行波）。", "img": 0, "chap": "一 · 光的电磁理论基础考纲 15 分 · 6 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q003", "tag": "2014-1(1)", "stem": "若使线偏振的激光通过一折射率为 1.76 的介质表面反射后没有反射损失，对入射光有何要求？", "body": "两条要求同时满足： 入射角为布儒斯特角：θB = arctan(1.76/1) ≈ 60.4°； 入射光振动方向平行于入射面（即只有 p 分量）。 此时 p 分量反射系数 rp = 0，反射光中没有该成分，能量全部透射，故\"无反射损失\"。若含 s 分量，s 分量仍会反射，就有损失。", "img": 0, "chap": "一 · 光的电磁理论基础考纲 15 分 · 6 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q004", "tag": "2021-1(1)", "stem": "一束右旋圆偏振光从空气正入射到折射率为 1.5 的玻璃上，反射光的偏振态如何？（迎着光传播方向观察）", "body": "正入射 θ1 = 0，n1 = 1、n2 = 1.5： rp = −rs = n2 − n1n2 + n1 = 0.2 反射光两分量振幅仍是等幅（同为 0.2E），但 p 分量相对 s 分量多一个 π 相位（因 rp、rs 符号相反），因此旋向反转。 结论：反射光为左旋圆偏振光（迎着光的传播方向看）。 约定说明：以入射面为基准取 p、s 正方向，正入射时 rs = −0.2、rp = +0.2（反号），故 p 相对 s 附加 π 相位；再叠加\"迎着传播方向看\"这一约定（反射光传播方向与入射光相反），最终判为左旋圆偏振。", "img": 0, "chap": "一 · 光的电磁理论基础考纲 15 分 · 6 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q005", "tag": "2023-1(2)", "stem": "可以在两个透明介质交界面完全透射的条件是什么？", "body": "入射光为振动方向平行于入射面的线偏振光（只有 p 分量）； 入射角等于布儒斯特角 θB = arctan(n2/n1)。 此时 rp = 0，界面无反射，光全部透射。补充：若为正入射，则须 n1 = n2（无界面）。", "img": 0, "chap": "一 · 光的电磁理论基础考纲 15 分 · 6 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q006", "tag": "2024-1(1)", "stem": "光纤传播应用了什么光学原理？对于纤芯折射率 1.55、包层折射率 1.5 的光纤，其数值孔径是多少？", "body": "原理：全反射。光在纤芯（n1 = 1.55）与包层（n2 = 1.5）界面上，当入射角大于临界角 θc = arcsin(n2/n1) 时发生全反射，光被限制在纤芯内以锯齿形前进。 NA = √(n1² − n2²) = √(1.55² − 1.50²) = √0.1525 ≈ 0.39 数值孔径决定光纤的收光能力，NA 越大能耦合进光纤的光越多。", "img": 0, "chap": "一 · 光的电磁理论基础考纲 15 分 · 6 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q007", "tag": "2013-1(1)", "stem": "许多光学仪器的玻璃表面镀有增透膜。为达到增透效果，膜层材料的折射率应如何选择？", "body": "单层增透膜（空气 n0、膜 n1、玻璃 n2）要求： 折射率满足 n1 = √(n0·n2)（使膜上下表面两反射光振幅相等）； 膜厚 d = λ/(4n1)，即光学厚度 λ/4，使两反射光光程差 λ/2、相位差 π，干涉相消。 振幅相等 + 反相 ⇒ 反射光完全抵消，透射增强。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q008", "tag": "2016-1(2)", "stem": "有人说牛顿环的条纹形状与等倾干涉圆条纹相同，产生干涉的两束光之间的光程差表示式也相同，因此也属于等倾干涉，这种说法正确吗？为什么？", "body": "不正确。两者只是\"条纹形状都是同心圆\"这一点巧合。 牛顿环是等厚干涉：由平凸透镜下表面与平板玻璃上表面之间的空气楔形成，光程差 Δ = 2nh + λ/2 随膜厚 h 变化，同一厚度同一级 → 中心 h=0 处只有半波损失，故中心是暗斑，级次由中心向外递增（内疏外密）。 等倾干涉：平行平板上不同入射倾角 i 的光光程差 Δ = 2nh·cos i 不同，同一倾角同一级 → 中心级次最高，由中心向外级次递减。 判据：看\"同一级条纹对应的是等厚还是等倾角\"。牛顿环对应等厚，不是等倾。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q009", "tag": "2017-1(1)", "stem": "一束相干平面光波以夹角 θ 在观察屏相遇，发生干涉，试说明干涉条纹的形状和宽度。", "body": "条纹为平行于两波矢角平分线的等间距直条纹。 Δx = λ / (2 sin(θ/2)) ≈ λ/θ （θ 很小时） θ 越大，条纹越密；θ 越小，条纹越疏。这是\"两平面波干涉\"的基本结论，也是全息光栅形成的原理。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q010", "tag": "2017-1(2)", "stem": "试比较牛顿环和法布里–珀罗干涉环这两种干涉条纹的异同。", "body": "相同点：都是同心圆环条纹，且内疏外密。 不同点： 机理：牛顿环是等厚干涉（双光束）；F-P 是多光束干涉（平行平板多次反射）。 级次：牛顿环中心级次最低（中心暗）；F-P 中心级次最高。 锐度：F-P 条纹细锐（反射率越高越锐，精细度大）；牛顿环条纹宽而缓。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q011", "tag": "2017-1(3)", "stem": "若想在玻璃上镀一层保护膜，则该膜应满足什么条件？该膜层的反射率是多少？", "body": "保护膜的作用是保护玻璃表面但不改变它的光学性能，所以要让这层膜等效于不存在： 膜的光学厚度取 n1h = λ0/2（半波层，mλ0/2，m = 1,2,…）； 此时膜上下两表面反射光相差 2π，与没有膜时完全一样。 所以反射率就是裸玻璃表面的反射率（正入射）： R = [ (n0 − n2) / (n0 + n2) ]² 其中 n0 为空气、n2 为玻璃（n1 只要满足膜厚条件，取值不影响结果）。 别答成增反膜：增反膜是 n1 > n2 + 光学厚度 λ0/4，反射率 RM = [(n0n2 − n1²)/(n0n2 + n1²)]²；增透膜是 n1 = √(n0n2) + λ0/4。本题问的是保护膜，条件就是 λ0/2。 考场速答（3 句，背这个）：① 保护膜要求\"等效不存在\" ⇒ 光学厚度 n1h = λ0/2（半波层）；② 于是反射率 = 裸玻璃的反射率 R = [(n0−n2)/(n0+n2)]²；③ 别答成增反（n1 ", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q012", "tag": "2018-1(2)", "stem": "平行平板的双光束干涉和多光束干涉同为等倾干涉，为什么前者应用的常是反射光，而后者应用的通常是透射光？", "body": "双光束 → 看反射光：平板反射率低时，反射光中两束（表面直接反射 + 一次内反射后出射）强度接近， 可见度 V = 2√(I1I2) / (I1+I2) → 1； 而透射光是 t2 与 t2r2 一强一弱，V 很低。 多光束 → 看透射光：高反射率腔里透射的一串光强相近，叠加后条纹极细锐 （半宽随 R 增大而变窄，精细度 F = π√R / (1−R) 上升）； 反射光是它的互补——“亮背景上的细暗线”，对比差。所以取透射。 一句话：双光束拼的是两束强度是否相称（看可见度），多光束拼的是条纹够不够锐（看精细度）。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q013", "tag": "2019-1(2)", "stem": "已知波长为 500 nm 的光波，其谱线宽度为 Δλ = 8×10−5 nm，若用这一光源来进行干涉测距，能实现的最大测距量程如何确定？", "body": "由相干长度 Lc = λ2Δλ = (500×10−9)28×10−14 ≈ 3.1 m 严格说：相干长度限制的是\"两束光能够有效干涉的最大光程差\"，即|OPD| ≤ Lc ≈ 3.1 m而\"绝对测距量程\"要看干涉仪结构——题目只说\"用这一光源进行干涉测距\"，没给结构：迈克尔逊式（光往返一次被测距离）：OPD = 2L ⇒ Lmax = Lc/2 ≈ 1.6 m（最常见的口径，答案册按这个）；马赫-曾德尔式（两臂各走一次）：OPD = ΔL ⇒ Lmax = Lc ≈ 3.1 m。作答建议：先写 Lc = λ²/Δλ ≈ 3.1 m，再说\"光程差不得超过相干长度；若采用往返式（迈克尔逊）则量程减半 ≈ 1.6 m\"。这样无论哪种结构都不会被判错。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q014", "tag": "2020-1(2)", "stem": "用白光做等倾干涉实验，对于同一级圆环，各个颜色光的空间位置如何分布？", "body": "等倾条件 2nh·cos i = kλ。同一级 k 下，λ 越大 ⇒ cos i 越小 ⇒ 倾角 i 越大。 所以同一级圆环中：红光在最外，紫光在最内，中间按光谱次序排列。 中心附近级次最高，因各色重叠而接近白色；向外展开成彩色环。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q015", "tag": "2020-1(3)", "stem": "室内自然光照明下，光盘存储面会呈现漂亮的彩色条纹，为什么？", "body": "原答给的是薄膜干涉：光盘镀膜面在自然光照射下，膜前后两表面反射的光相遇发生干涉，自然光为复色光，不同波长满足相长/相消条件的角度不同，在膜面上形成彩色条纹。 补充（存疑点）：光盘表面还有极密的同心/螺旋沟槽，也常被解释为反射式光栅的衍射色散。若阅卷按\"薄膜干涉\"给分，就写薄膜干涉；若允许发挥，可两句都写 —— 但先写薄膜干涉。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q016", "tag": "2021-1(2)", "stem": "法布里–珀罗干涉仪两反射镜的反射率为 0.5，试说明其最大透射率和最小透射率各是多少？（不考虑系统的吸收）", "body": "多光束透射光强： It = (1−R)2(1−R)2 + 4R sin2(φ/2) · Ii sin²(φ/2) = 0 时最强：Tmax = 1（无吸收时全部透过）； sin²(φ/2) = 1 时最弱：Tmin = (1−R)² / [(1−R)² + 4R]，代入 R = 0.5 → (0.25)/(0.25+2) = 1/9。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q017", "tag": "2024-1(2)", "stem": "杨氏双缝干涉实验中，光源上移，条纹会出现什么变化？增加光源到双缝的距离，条纹如何变化？", "body": "①光源上移：零级条纹向相反方向（下方）平移，整个条纹图样下移；条纹间距不变（Δx = λD/d 只与 D、d 有关）。 ②增大光源到双缝的距离：亮度下降（照度 ∝ 1/l²），但空间相干性反而变好 —— 光源对双缝的张角变小，允许的最大缝距 dmax = λl/a 变大，条纹可见度不会因此下降，条纹间距也仍不变。易错（这题最容易答反）：光源离双缝越远，空间相干性越好（张角小）；光源越宽或离得越近，相干性才越差。答案册 2024 p2 只写「光源远离双缝，干涉条纹亮度下降」——讲的是亮度，不是相干性。判据与本库 2023-二-2 的 dmax = λl/a 一致。", "img": 0, "chap": "二 · 光的干涉考纲 15 分 · 11 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q018", "tag": "2019-1(1)", "stem": "光的干涉和光的衍射本质上的联系与区别是什么？", "body": "联系：本质都是相干光波叠加引起的光强重新分布；衍射可以看作无限多个连续分布的次波之间的干涉。 区别： 干涉是有限个（分立）相干光波的叠加； 衍射是无限多个连续次波的叠加，且伴随光偏离直线传播、出现明暗条纹。", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q019", "tag": "2014-1(2)", "stem": "观察光栅产生的衍射光谱，现隔缝遮住光栅的狭缝，光栅的分辨本领和色散本领如何变化？", "body": "隔缝遮住后，参与衍射的缝数 N 减半，而相邻有效缝距变为 2d（光栅常数变成 2d，出现缺级）。 分辨本领 R = kN → 降为原来的 1/2； 色散本领（角色散率 dθ/dλ = k/(d′cosθ)）→ 也降为 1/2，谱线间距变为原来的 2 倍，谱线变稀。", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q020", "tag": "2014-1(3)", "stem": "提高显微镜分辨率的主要途径是什么？", "body": "显微镜最小分辨距离 δ = 0.61λ / (n·sin u) = 0.61λ / NA 途径： 减小波长 λ（用紫外光、电子束）； 增大数值孔径 NA：增大孔径角 u（加大物镜口径），或用油浸物镜使 n > 1。 单纯提高放大率无效（那只是空放大）。", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q021", "tag": "2015-1(1)", "stem": "在望远镜的设计中，如何提高望远镜的分辨本领？在望远镜的分辨本领确定的前提下，如何考虑其视角放大率？", "body": "提高分辨本领：望远镜的分辨角 θ0 = 1.22λ/D，只由物镜通光口径 D 决定 → 增大物镜口径。 口径确定后：θ0 已定，视角放大率 Γ 必须与之匹配 —— 使物镜刚能分辨的两点经放大后恰好达到人眼的分辨极限（约 1′）： Γ ≈ 1′ / θ0 （θ0 用角分表示） Γ 过小 → 物镜分辨的细节人眼看不见（浪费口径）；Γ 过大 → 无效放大（空放大），像变大但更模糊。", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q022", "tag": "2015-1(2)", "stem": "光栅光谱仪和法布里–珀罗标准具的分辨本领都很高，解释它们分辨本领高的原因。", "body": "两者都取决于参与干涉的单元数目： 光栅：R = kN，狭缝数 N 极大（每毫米上千条），故 R 高； F-P 标准具：R = 0.97 mN，其中干涉级 m 很大（腔长可达厘米级，m 上千），故 R 高。 本质上：分辨本领 ∝ 参与叠加的相干光束数目 × 级次。", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q023", "tag": "2016-1(3)", "stem": "显微镜用紫外光（λ = 300 nm）照明时的分辨本领，是采用可见光（λ = 550 nm）照明时的多少倍？", "body": "δ ∝ λ，分辨本领 ∝ 1/λ： 倍数 = 550/300 ≈ 1.83 倍", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q024", "tag": "2018-1(3)", "stem": "菲涅尔衍射和夫琅禾费衍射是傍轴近似下的两种衍射情况，如果光波长 λ = 0.632 μm、孔径线度 d = 2 mm，估计一下观察屏到衍射屏的距离 l 为多少看作菲涅尔衍射，而 l", "body": "取孔径边缘坐标 x1 = y1 = d/2 = 1 mm。 菲涅尔（近场）条件：l³ ≫ (x₁²+y₁²)²/(4λ)（分子要整体平方、分母要乘 4）⇒ 代入 (x₁²+y₁²) = 2 mm² 得 l³ ≫ 1.58×10⁻⁶ m³ ⇒ l ≫ 1.2 cm（这是菲涅尔二次相位近似可用的下限，不是\"多远都算近场\"；距离再增大、满足远场判据时就该改用夫琅禾费近似）； 夫琅禾费（远场）条件：l ≫ (x₁²+y₁²)/λ ⇒ l ≫ 3.2 m 才可看作夫琅禾费衍射（有的书写 l ≫ 2(x₁²+y₁²)/λ，则约 6.3 m；本题按前者）。 记忆：孔径越大、波长越短，远场条件越苛刻（远场 l ∝ d²/λ；近场 l ∝ (d⁴/λ)^{1/3}，取 x₁=y₁=d/2 时 l³ ≫ d⁴/(16λ)）。菲涅尔条件是 l³ ≫ (x₁²+y₁²)²/(4λ) —— ① 分子 (x₁²+y₁²) 整体平方（(x₁²+y₁²)²/λ", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q025", "tag": "2019-1(3)", "stem": "写出光波斜入射平面光栅时的光栅方程，并说明方程中各量的物理意义。", "body": "d ( sin i ± sin θ ) = kλ d：光栅常数（相邻两缝间距）； i：入射角（入射光与光栅法线夹角）； θ：衍射角；衍射光与入射光在法线同侧取\"+\"、异侧取\"−\"； k：衍射级次（0, ±1, ±2…）；λ：波长。 意义：相邻两缝对应光线的光程差等于 kλ 时，该方向上各缝衍射光同相叠加，形成主极大。正入射时 i = 0，退化为 d sinθ = kλ。", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q026", "tag": "2021-1(3)", "stem": "光栅光谱仪的分辨率和光学成像系统的分辨率有何区别？", "body": "光栅光谱仪：R = λ/Δλ = kN，表征把两条波长相差极小的谱线分开的能力 —— 是\"波长（光谱）分辨\"。 成像系统：用最小分辨距离/最小分辨角表示，表征把两个靠得很近的物点或细节分开的能力 —— 是\"空间分辨\"。 一句话：一个分\"颜色\"，一个分\"点\"。", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q027", "tag": "2024-1(3)", "stem": "菲涅尔圆屏衍射中，圆屏半径为有限长，沿中垂线观察中心为亮斑还是暗斑？", "body": "亮斑（泊松亮斑）。 圆屏挡住前 k 个半波带后，露出的第一个半波带起主要作用；相邻半波带贡献相消，未被完全抵消的部分在轴上叠加，故中心恒为亮点 —— 且只要圆屏不无限大，亮点始终存在（与屏的大小无关）。 对照：圆孔衍射轴线上随孔径变化明暗交替；圆屏则恒亮。", "img": 0, "chap": "三 · 光的衍射考纲 15 分 · 10 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q028", "tag": "2015-1(3)", "stem": "自然光通过透光轴与 x 轴方向夹角为 45° 的起偏器垂直入射到一块 1/4 波片上，波片的慢轴在 y 轴方向，问：透过 1/4 波片的光是什么偏振光？如果其后我再放一块 1/4 ", "body": "①自然光经起偏器 → 线偏振光，振动方向与 x 轴成 45°。它入射 1/4 波片（慢轴 y、快轴 x），两分量振幅相等；慢轴 y 落后 π/2 ⇒ 出射为左旋圆偏振光（迎着光看逆时针，δ = φy−φx = −90°）。 ②圆偏振光过任何方位的 1/4 波片都出线偏振（圆偏振\"没有主轴\"，这是与①的线偏振不同的地方）。要让它与检偏器（透光轴与起偏器相同，45°）平行，第二块波片应这样放： 快轴沿 y、慢轴沿 x，即两块波片主轴互相平行、快慢互换（与第一块比，等于转了 90°）； 这样第二块给 x 分量再补 π/2，两分量同相 ⇒ 出射为线偏振，方向平行于起偏器透光轴 45°，与检偏器平行 ⇒ 全透射； 别答\"与第一块成 45°\"：那样出射是 −45° 方向的线偏振，正好被这块检偏器消光。 一句话验算：两块 1/4 波片主轴平行（快慢同向）合起来等于一块半波片 ⇒ 45° 线偏振出射 −45°（被消光）；快慢互换才等效\"抵消\"，", "img": 0, "chap": "四 · 光在各向异性介质中的传播考纲 15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q029", "tag": "2016-1(4)", "stem": "为了检验光束的偏振特性，在检偏器前放置一块 1/4 波片，旋转检偏器一周，看到光强为两亮两黑，则该光束的偏振特性如何？请简要说明。", "body": "该光束是线偏振光（或至少含明确线偏振成分）。 理由：1/4 波片把入射的线偏振光变成椭圆（或圆）偏振，检偏器旋转一周出现两个极大、两个极小；若极小处完全消光（黑），说明存在一个方向振动为零 → 入射光本身是线偏振的。 对照：圆偏振光过 1/4 波片后是线偏振 → 也是两亮两黑，所以答\"线偏振光\"即可（若极小处不消光，则是椭圆偏振）。", "img": 0, "chap": "四 · 光在各向异性介质中的传播考纲 15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q030", "tag": "2019-1(4)", "stem": "两种入射情况：1）光波沿晶体的光轴入射；2）若光轴平行于晶体表面，光波正入射于晶体表面。问这两种情况下是否会发生双折射现象？请说明理由。", "body": "①沿光轴入射：不发生双折射。此时 o 光与 e 光传播方向相同、速度也相同（都等于 no），两束光不分开。 ②光轴平行于表面、光垂直入射：发生双折射。此时光轴垂直于传播方向，o 光与 e 光速度不同（分别为 no、ne），产生双折射 —— 但因两者仍沿法线传播，传播方向相同，只是速度不同（不分开）。 口径（答案册 p121）：答案册对第 2 问写「此时 tanα = 0，也不会发生双折射」—— 它说的是不分开（离散角为零）。物理上 o、e 的速度不同（no ≠ ne），严格说仍属双折射，只是两条光线重合；这正是波片能产生相位差的原因。答题写全：①（沿光轴）不发生双折射，两光同速；②（垂直光轴）光线不分开，但 o、e 速度不同、有相位差，器件上就是波片。若按答案册口径答「不发生」，必须把「不分开」三个字写出来。 同类问法见 2024-1(4)：ne 只在波法线⊥光轴时才叫 e 光折射率。", "img": 0, "chap": "四 · 光在各向异性介质中的传播考纲 15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q031", "tag": "2020-1(1)", "stem": "自然光正入射，分别通过玻璃和左旋晶体，出射光的偏振态如何？", "body": "①通过玻璃（各向同性）：出射仍为自然光。 ②通过左旋晶体：原答给\"出射为线偏振光（振动面旋转）\"。 ⚠ 这一问答案册写「线偏振光」，但物理上应为自然光（自然光经旋光介质仍是非偏振）。考试按答案册写，心里知道即可。", "img": 0, "chap": "四 · 光在各向异性介质中的传播考纲 15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q032", "tag": "2021-1(4)", "stem": "若让一束线偏振光分别垂直入射通过全波片和半波片，其偏振状态如何改变？", "body": "全波片（相位差 2π）：偏振态不变，出射仍是原方向的线偏振光。 半波片（相位差 π）：出射仍是线偏振光，但振动面相对入射方向转过 2α（α 为入射振动方向与波片光轴的夹角）。α = 45° 时转过 90°。 记忆：全波片\"什么都不做\"，半波片\"镜像反转\"。⚠ 答案册这里写错了（2021 答案册 p133 一.4）：它写「线偏振光过半波片后变为圆偏振光」——错。通过全波片、半波片后仍是线偏振（全波片方向不变，半波片转 2α）；1/4 波片不是：α = 45° 时出圆偏振，其他 α（除 0°/90°）出椭圆偏振。别被机构答案带跑：把「只有 1/4 波片能把线偏振变圆偏振」记死。", "img": 0, "chap": "四 · 光在各向异性介质中的传播考纲 15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q033", "tag": "2022-1(1)", "stem": "简述线偏振光、部分偏振光、圆偏振光、椭圆偏振光，如何检验区分？", "body": "第一步：只用检偏器旋转一周，看光强变化： 光强不变 → 自然光 或 圆偏振光； 有两明两暗（能完全消光） → 线偏振光； 两强两弱但不消光 → 部分偏振光 或 椭圆偏振光。 第二步：在检偏器前加 1/4 波片（光轴对准检偏器测到的极值方向）： 对\"光强不变\"者：仍不变 → 自然光；变成两明两暗 → 圆偏振光； 对\"两强两弱\"者：能消光 → 椭圆偏振光；仍不消光 → 部分偏振光。", "img": 0, "chap": "四 · 光在各向异性介质中的传播考纲 15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q034", "tag": "2023-1(1)", "stem": "说明 0°–90° 的非寻常光的变化，是否存在双折射？", "body": "e 光的折射率随\"波法线与光轴夹角 θ\"变化： 1/ne²(θ) = cos²θ/no² + sin²θ/ne² θ 从 0°（沿光轴）到 90°（垂直光轴），ne(θ) 由 no 连续变到 ne；而 o 光折射率恒为 no。 只要传播方向不与光轴平行（θ ≠ 0），o 光与 e 光速度就不同 → 存在双折射；仅 θ = 0 时两者速度相同、无双折射。 通用表述见 2024-1(4)：ne(θ) 随方向变，θ=0 时等于 no。", "img": 0, "chap": "四 · 光在各向异性介质中的传播考纲 15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q035", "tag": "2024-1(4)", "stem": "有人说，n1 = n2 = no，n3 = ne，则 o 光 n = no，e 光 n = ne，对还是不对，说明理由？", "body": "", "img": 0, "chap": "四 · 光在各向异性介质中的传播考纲 15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q036", "tag": "2013-1(2)", "stem": "一束入射光通过声光晶体后发生布拉格衍射，如果声波频率发生变化，衍射光将会怎样变化？", "body": "sinθB = λ/(2λs)， λs = vs/fs声频 fs ↑ → λs ↓ → sinθB ↑ → θB 变大，0 级与 1 级夹角（≈2θB）变大；同时频移 = ±fs（0 级无频移），故频移也变大。声频减小则相反。易错：θB 是与声波波前的夹角；频移只有一个 fs，不是 2fs。", "img": 0, "chap": "五 · 晶体的感应双折射考纲 15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q037", "tag": "2018-1(4)", "stem": "解释什么是晶体的感应双折射？常见的感应双折射效应有哪几种？", "body": "晶体受到应力、电场、磁场、声波等外界作用时，结构发生改变，使光在其中的传播规律改变 —— 即原本各向同性的介质变为各向异性（或各向异性改变），产生与外加作用有关的双折射，称为感应双折射（人工双折射）。 常见四种： 电光效应（克尔效应、普克尔斯效应） 声光效应 磁光效应（法拉第效应） 光弹效应（应力双折射）", "img": 0, "chap": "五 · 晶体的感应双折射考纲 15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q038", "tag": "2020-1(4)", "stem": "法拉第效应又称为磁致旋光效应，其与晶体的旋光效应是一回事吗？如果是，简述理由；如果不是，简述理由和两者的不同点。", "body": "不是一回事。 晶体旋光效应是晶体本身固有的性质（自然旋光），与外加场无关； 法拉第效应是在强磁场作用下产生的旋光（磁致旋光），属于人工方法。 关键区别：法拉第效应的旋转方向只由磁场方向决定，与光的传播方向无关 —— 光往返一次旋转角加倍；而自然旋光的光往返一次旋转角相互抵消。这一点是光隔离器的原理。", "img": 0, "chap": "五 · 晶体的感应双折射考纲 15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q039", "tag": "2021-1(5)", "stem": "简述 KDP 晶体的线性电光效应，产生 γ63 的纵向运用和横向运用的条件。", "body": "KDP 加电场后由单轴晶体变为双轴晶体，折射率变化与场强成正比（普克尔斯效应），比例系数即 γ63。 纵向运用：外加电场方向与光传播方向平行（都沿光轴 z），两端加透明电极； 横向运用：电场方向与光传播方向垂直（如电场沿 z、光垂直光轴传播）。 纵向运用时半波电压与晶体长度无关；横向运用可增大长度/减小厚度来降低半波电压。", "img": 1, "chap": "五 · 晶体的感应双折射考纲 15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q040", "tag": "2023-1(5)", "stem": "电光开关，P1、P2 透振方向正交的偏振片，电光晶体纵向运用的 KDP 晶体，通电时，要使偏振片 P2 的透振光强最强，需满足哪些条件，此时 KDP 相当于哪种波片？", "body": "不加电场时 P1、P2 正交，出射消光。要透射最强，须让 KDP 把光的振动面旋转 90°，使从 P1 出来的线偏振光变为与 P2 平行。 条件（相位差为 π）： Δφ = 2π (ne′ − no) lλ = π 即所加电压为半波电压 Uλ/2，且 KDP 的感应主轴与 P1 透光轴成 45°（使两分量等幅）。 此时 KDP 相当于一块半波片。", "img": 1, "chap": "五 · 晶体的感应双折射考纲 15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q041", "tag": "2016-1(5)", "stem": "为什么点燃的香烟冒出的烟是淡蓝色，而吸烟者口中吐出的却是白色？", "body": "点燃的烟（淡蓝色）：烟中微粒直径远小于可见光波长，发生瑞利散射，散射光强 ∝ 1/λ⁴，短波（蓝紫）散射强 → 呈淡蓝色。 口吐的烟（白色）：含大量水蒸气，微粒尺寸接近或大于可见光波长，发生米氏散射，散射强度与波长关系不大 → 各色均匀散射，呈白色。 一句话判据：粒子远小于 λ → 瑞利 → 偏蓝；粒子 ~ λ → 米氏 → 白。", "img": 0, "chap": "六 · 光的吸收、色散和散射15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q042", "tag": "2017-1(5)", "stem": "对光的散射现象而言，若入射光是自然光，试确定散射角分别为 0°、45°、90° 时相应散射光的偏振态。", "body": "散射角 0°：散射光为自然光（沿原方向，无偏振化）； 散射角 45°：部分偏振光； 散射角 90°：线偏振光，振动方向垂直于散射平面。 原因：偶极子辐射在垂直于振动方向最强，沿振动方向为零，故 90° 方向上只剩一个振动分量。", "img": 1, "chap": "六 · 光的吸收、色散和散射15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q043", "tag": "2018-1(5)", "stem": "如图所示为观察色散的交叉棱镜装置，如果两棱镜 P1 和 P2 的材料相同，大致画出光屏 N 上的光谱分布并简单解释。", "body": "没有 P2 时，P1 的色散把光在水平方向展开成连续光谱 a→b。 加上 P2（材料相同、与 P1 交叉放置）后，P2 的色散方向与之垂直，使每条谱线在竖直方向下移；因棱镜对长波偏向小： 红光一端 a1 下移最小； 紫光一端 b1 下移最大； 零级光谱 a1b1 仍为直线，但与 ab 成倾斜角。 所以屏上是一个倾斜的平行四边形/斜条状光谱带，不是水平条。", "img": 1, "chap": "六 · 光的吸收、色散和散射15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q044", "tag": "2019-1(5)", "stem": "dn/dλ 表示介质折射率随波长改变的变化率，即为色散率。当色散率 dn/dλ < 0 和 dn/dλ > 0 时，相应介质的光色散类型是什么？", "body": "dn/dλ < 0：折射率随波长增大而减小，V > Vg → 正常色散； dn/dλ > 0：折射率随波长增大而增大，V < Vg → 反常色散。 补充：正常色散出现在远离吸收带的区域；反常色散出现在吸收带附近。", "img": 0, "chap": "六 · 光的吸收、色散和散射15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q045", "tag": "2020-1(5)", "stem": "太阳光通过大气时的散射有哪几种？简述其各自特点。", "body": "①瑞利散射（分子散射）：散射微粒远小于波长，散射光强 ∝ 1/λ⁴，短波散射强。 → 解释：天空呈蓝色；正午太阳偏白、朝阳夕阳偏红。 ②米氏散射（大粒子散射）：微粒尺寸与波长相当或更大，散射强度与波长关系不大，各色均匀散射。 → 解释：云雾呈白色；雾天能见度下降。", "img": 0, "chap": "六 · 光的吸收、色散和散射15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q046", "tag": "2021-1(6)", "stem": "设海水的吸收系数为 α = 2/cm，人眼能感受的光强为太阳光强的 10−18。试说明在海水多深处，人眼还能看见光？", "body": "吸收定律 I = I0e−αl，令 I/I0 = 10−18： e−2l = 10−18 ⇒ l = 18·ln102 ≈ 20.7 cm 即水下约 20.7 cm 处人眼刚好还能看见。", "img": 0, "chap": "六 · 光的吸收、色散和散射15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q047", "tag": "2023-1(3)", "stem": "描述光的散射。在雾天时，为了拍摄清晰的照片，人们往往在照相机物镜前放一片红色玻璃片，试分析其原理。", "body": "散射：光通过光学性质不均匀的介质时，部分光偏离原传播方向向各方向传播的现象。 红玻璃片的作用（两条都要写）： 雾滴尺寸较大，米氏散射使各波长散射相近，形成白茫茫的散射背景光；红片只让长波红光通过，滤掉被强烈散射的蓝紫光，削弱背景杂散光； 红光的散射较弱、穿透雾的能力较强，到达物镜的成像光相对更强 → 像的对比度提高，照片更清晰。", "img": 0, "chap": "六 · 光的吸收、色散和散射15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q048", "tag": "2024-1(5)", "stem": "同一个 He-Ne 激光器发出的光束，在超净室观察与在一般实验室环境观察到的结果一样吗？为什么？", "body": "不一样。 一般实验室空气中悬浮微粒多，激光通过时发生明显的散射（丁达尔现象），能看到一条明亮的光路； 超净室微粒极少，散射很弱，光路几乎看不见。 结论：散射由介质的不均匀性（微粒）引起，不是光本身的性质 —— 这也说明\"光路可见\"的前提是存在散射体。", "img": 0, "chap": "六 · 光的吸收、色散和散射15 分 · 8 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q049", "tag": "2011-9(1)", "stem": "解释费马原理。", "body": "光线在介质中传播时，所走的路径使光程取极值（极小值、极大值或稳定值），即实际光程为所有可能路径中的极值。 数学表达式： δL = δ ∫AB n(s) ds = 0 它是几何光学的最高原理：由它可以推出反射定律、折射定律，以及光线可逆、光程可逆等结论。", "img": 0, "chap": "七 · 几何光学基础15 分 · 4 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q050", "tag": "2015-1(5)", "stem": "解释费马原理，给出其数学表达式？", "body": "与 2011-9(1) 完全同题，答案照搬那一题即可（光程取极值 + δ∫n ds = 0）。 连续两年考同一个概念，说明是必背项 —— 别只背\"光走最短路径\"，要写\"极值\"（含极大、极小、稳定值）。", "img": 0, "chap": "七 · 几何光学基础15 分 · 4 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q051", "tag": "2022-1(5)", "stem": "光焦度的概念，以及公式表示、与焦距的关系？", "body": "光焦度 Φ 表示光学系统对光线的会聚或发散本领，定义为 Φ = n′/f′ = −n/f （空气中 Φ = 1/f′） 单位：屈光度 D（m−1）。 Φ > 0：会聚系统（正透镜，f′ > 0）； Φ < 0：发散系统（负透镜，f′ < 0）。 与焦距成反比：焦距越短，光焦度越大。", "img": 0, "chap": "七 · 几何光学基础15 分 · 4 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q052", "tag": "2023-四-3", "stem": "空气中由玻璃构成的透镜，有人说双凸透镜一定是正透镜，双凹透镜一定是负透镜，试分析其对错。", "body": "不一定对：对\"薄透镜\"成立，对\"厚透镜\"不成立。 正负由光焦度定。厚透镜（两折射球面 + 厚度 d）： Φ = (n − 1)[1/r1 − 1/r2 + (n − 1)d/(n r1r2)] 双凸是 r1 > 0、r2 < 0；双凹是 r1 < 0、r2 > 0。令 Φ = 0 得临界厚度 d0 = n(r1 − r2)/(n − 1) 双凸：d < d0 时 f′ > 0（正透镜）；d > d0 时 f′ < 0，双凸变成负透镜。双凹反之（d > d0 时变正）。所以形状不能定正负，厚度也能改变光焦度符号（课件 8-3 厚透镜表：双凸 d > d0 ⇒ f′ < 0）。 再补一句介质：以上默认透镜在空气中、n > 1；若透镜材料折射率小于周围介质（如水中的空气泡），双凸双凹的正负直接反过来。 考场三句：不一定 → 厚透镜 Φ 里还有 d 项，d > d0 = n(r1−r2)/(n−1) 时双凸变负 → 形状只是外形，Φ 才", "img": 0, "chap": "七 · 几何光学基础15 分 · 4 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q053", "tag": "2011-9(2)", "stem": "解释光学系统景深产生的原因，景深的大小受哪些因素影响？", "body": "", "img": 0, "chap": "八 · 理想光学系统15 分 · 4 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q054", "tag": "2014-9(1)", "stem": "解释光学系统的景深概念，景深的大小受哪些因素影响？", "body": "与 2011-9(2) 同题：景深 = 像面上获得足够清晰像的物空间深度；影响因素 = 入射光瞳大小、对准距离、允许弥散斑大小。 补充一句更完整的：景深与光圈成反比、与拍摄距离成正比 —— 这就是\"小光圈、远距离 → 大景深\"的由来。", "img": 0, "chap": "八 · 理想光学系统15 分 · 4 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q055", "tag": "2015-1(4)", "stem": "解释光学系统的景深概念，景深的大小受哪些因素影响？", "body": "同 2011-9(2) / 2014-9(1)，第三次考，答案一字不差。 答题模板：①定义（物空间深度）②原因（允许弥散斑）③三因素（光瞳、对准距离、允许弥散斑）。", "img": 0, "chap": "八 · 理想光学系统15 分 · 4 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q056", "tag": "2022-1(4)", "stem": "什么是景深？", "body": "同 2011-9(2)，第四次考。这题更短，只问定义 —— 写\"在像面上能获得足够清晰像的物空间深度\"即可，再补一句成因（允许弥散斑）更保险。", "img": 0, "chap": "八 · 理想光学系统15 分 · 4 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q057", "tag": "2009-10(1)", "stem": "光学系统的像差是影响光学系统像质量的一个关键因素，试问：什么是光学系统的像差？光学系统的单色像差可以分为哪几种？", "body": "像差：实际光学系统所成的像，与近轴（理想）条件下所成像之间的差异。 单色像差 5 种：球差、彗差、像散、场曲、畸变。 （另有色差：位置色差、倍率色差 —— 属复色光引起的，不算单色像差，别混。）", "img": 1, "chap": "九 · 光学系统像差基础与光路计算15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q058", "tag": "2009-10(2)", "stem": "如下图 (a) 所示，一个正方形的物，经过光学系统成像后像面如图所示，试问这时主要存在哪种单色像差？", "body": "畸变（枕形畸变）。 判据：像整体变形（方格变弯曲、比例失真）但每个点仍清晰，说明是垂轴放大率随视场变化所致，不是\"模糊\"类像差。 边缘向外弯 = 正畸变（枕形）；向内弯 = 负畸变（桶形）。", "img": 1, "chap": "九 · 光学系统像差基础与光路计算15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q059", "tag": "2009-10(3)", "stem": "如下图 (b) 所示，一个辐条形的物，经过光学系统成像后像面如图所示，试问这时又主要存在哪种单色像差？", "body": "像散。 判据：不同方向的线条清晰程度不同（子午方向与弧矢方向聚焦位置不同），造成辐条在某一方向变粗、呈十字状。这是检验像散的经典图案 —— 若换成畸变，所有方向会一起变形；若是场曲，中心与边缘不能同时清晰。 三种\"糊涂账\"的区分口诀：畸变只变形、场曲不共面、像散分方向。", "img": 1, "chap": "九 · 光学系统像差基础与光路计算15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q060", "tag": "2012-9(1)", "stem": "光学系统的完善成像条件是什么？解释实际光学系统的像差概念？单色像差有哪几种？", "body": "完善成像（理想成像）：物点发出的同心光束经系统后仍为同心光束（所有光线交于同一点）。 条件：从物点到像点的所有光线的光程相等（等光程条件）。 像差：实际像与理想像的差异。单色像差：球差、彗差、像散、场曲、畸变。", "img": 0, "chap": "九 · 光学系统像差基础与光路计算15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q061", "tag": "2022-1(3)", "stem": "简述五种单色像差的概念。", "body": "球差：轴上物点发出的宽光束经系统后不交于一点，近轴光线与边缘光线交点在轴上前后分散，形成弥散斑。 彗差：轴外物点的宽光束经系统后，上下（子午面两侧）不对称，形成彗星状弥散斑。 像散：轴外物点的光束，子午与弧矢方向聚焦位置不同，形成两条互相垂直的焦线。 场曲：平面物经系统后，清晰像面是弯曲的（匹兹伐面），不能与平面像面重合。 畸变：垂轴放大率随视场变化，像与物不成比例（枕形/桶形），但不影响清晰度。 记忆串：球差在轴上、彗差在轴外、像散分方向、场曲弯像面、畸变改形状。", "img": 0, "chap": "九 · 光学系统像差基础与光路计算15 分 · 5 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q062", "tag": "2012-9(2)", "stem": "解释光度学中的光亮度、光照度概念，说明他们之间联系？并写出他们定义的数学表达式。", "body": "光亮度 L：发光体表面单位面积、在给定方向上单位立体角内辐射的光通量。 L = dΦ / (cos θ · dS · dΩ) （单位 cd/m²） 光照度 E：被照射物体单位面积上接收到的光通量。 E = dΦ / dS （单位 lx，勒克斯） 联系：都描述光通量的空间/面积密度，但 亮度描述\"发出\"的光（含方向信息，与观察方向有关）； 照度描述\"收到\"的光（与接收面有关）； 点光源照明时 E ∝ cos θ / r²（距离平方反比），而亮度与距离无关。", "img": 0, "chap": "十 · 光学仪器与光度学15 分 · 7 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q063", "tag": "2013-9(2)", "stem": "解释光度学中的光亮度、光照度概念，说明它们之间联系？", "body": "同 2012-9(2)，连续第二年考。答案照搬，务必把两个定义式写出来（很多考生只写文字，丢分）。", "img": 0, "chap": "十 · 光学仪器与光度学15 分 · 7 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q064", "tag": "2014-9(2)", "stem": "解释光度学中光亮度、光照度的概念，说明它们之间联系？", "body": "同 2012-9(2)，连续第三年考 —— 这是全卷最稳的送分题，必须满分。", "img": 0, "chap": "十 · 光学仪器与光度学15 分 · 7 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q065", "tag": "2013-9(1)", "stem": "设计一个实用的光学系统有几个步骤？分别是什么？给出一款你所熟悉的光学系统设计软件。", "body": "两个阶段： ①初步设计：根据使用要求，确定系统的基本结构——外形尺寸、各光组的光焦度分配等，理论依据是近轴光学（高斯光学）； ②像差设计：根据像质要求，确定各光学元件的具体结构参数（曲率半径、厚度、间隔、材料），反复校正像差，理论依据是像差理论。 软件：ZEMAX（也答 CODE V、LightTools、TracePro 均可）。", "img": 0, "chap": "十 · 光学仪器与光度学15 分 · 7 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q066", "tag": "2017-1(4)", "stem": "望远镜、照相物镜的分辨本领分别由什么因素决定？", "body": "望远镜：θ0 = 1.22λ/D，由物镜（入瞳）通光口径 D 决定 —— 口径越大，分辨本领越高。 照相物镜：δ = 1.22λ·F（F = f′/D 为光圈数），由相对孔径 D/f′ 决定 —— 相对孔径越大（光圈开得越大、F 越小），分辨本领越高。 注意别写反：望远镜看口径，照相物镜看相对孔径。", "img": 0, "chap": "十 · 光学仪器与光度学15 分 · 7 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q067", "tag": "2022-1(2)", "stem": "简述物面消渐晕的两种方法，且在投影仪、照相机怎么消渐晕？", "body": "渐晕：轴外点发出的光束被透镜框拦截，使像面边缘照度下降的现象。 两种方法： 加大透镜（光组）的口径，让轴外光束不被拦； 使入射窗与物平面重合 —— 让限制光束的孔径光阑与物面共轭，使各视场成像光束形状一致。 投影仪：在物镜附近加场镜，使物面成为入射窗，实现\"入射窗与物面重合\"。 照相机：适当缩小光圈（减小相对孔径），使边缘光束不被拦截（代价是分辨率下降）。", "img": 0, "chap": "十 · 光学仪器与光度学15 分 · 7 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-简答题-按章节.html", "id": "q068", "tag": "2023-1(4)", "stem": "显微镜的放大率给定，为了充分利用物镜分辨率，说明物镜分辨率和人眼分辨率率满足的条件。", "body": "需满足有用放大率条件：物镜能分辨的最小距离 δ 经显微镜放大后，应恰好等于人眼的分辨极限。 人眼分辨极限（明视距离 250 mm 处）约 0.073 mm，故 Γ = 0.073 mm / δ ≈ (250 mm / 0.61λ) · NA Γ 小于该值 → 物镜分辨出的细节人眼看不见（浪费物镜）； Γ 大于该值 → 无效放大（空放大），像变大但更模糊。", "img": 0, "chap": "十 · 光学仪器与光度学15 分 · 7 问 ·", "doc": "851 物理光学与应用光学 · 简答题（按考纲章节）"}, {"file": "851-计算题-应用光学-解析法.html", "id": "q001", "tag": "2019-四-1", "stem": "一折射率为 1.5 的正弯月薄透镜，其左面曲率半径为 5 cm，右面曲率半径为 15 cm，如图 a 所示，该透镜前 30 cm 处有一个高为 1 mm 的物体。 （1）试确定该物", "body": "", "img": 1, "chap": "A · 薄透镜 + 全反射膜1 题 ·", "doc": "851 计算题 · 应用光学（解析法）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q001", "tag": "2009-1", "stem": "一平面光波以 30° 角由空气入射到折射率为 1.52 的平行平板上，其振动平面与入射面的夹角为 45°，试求该平板上表面的反射率和平板上、下表面反射光的振动方向。", "body": "", "img": 0, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q002", "tag": "2010-2", "stem": "一束自然光从空气入射到折射率为 1.5 的玻璃上，入射角 θ1 = 30°，求反射率以及反射光的偏振度。", "body": "", "img": 0, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q003", "tag": "2011-1", "stem": "若要使线偏振光在红宝石晶体（n = 1.76）表面没有反射损失，对入射光有何要求？入射角应为多大？", "body": "1介质界面反射率为零的唯一途径（空气→介质）是 布儒斯特角入射，此时反射光只留 s 分量、p 分量反射率为 0。所以要求：线偏振光的振动方向在入射面内（纯 p 偏振），且入射角等于布儒斯特角。 2布儒斯特角（n1 = 1，n2 = 1.76） tan θB = n2n1 = 1.76 ⇒ θB = 60.4° 3此时的折射角（反射光⊥折射光的必然结果） θ2 = 90° − θB = 29.6° 入射光须为振动方向平行于入射面的线偏振光（p 分量），入射角取 θB = arctan1.76 ≈ 60.4°（折射角 29.6°）。此时 Rp = 0，反射损失为零。", "img": 1, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q004", "tag": "2011-10", "stem": "沿 A0 = i 方向的光线，从 n = 1 的介质入射到 n′ = √3 的介质中，已知界面的法线方向为 n0 = −½i + (√3/2)j，求反射和折射光线的方向矢量。", "body": "", "img": 0, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q005", "tag": "2011-11", "stem": "有一双平面镜系统，光线与其中的一个镜面平行入射，经两次反射后，出射光线与另一镜面平行，问两平面镜的夹角为多少。", "body": "1双平面镜的基本结论：入射光线经两镜依次反射后，偏向角 δ = 2α（α 为两镜夹角，取主截面内计算），且 δ 与入射角无关。 2题设\"入射光线 ∥ 镜 1、出射光线 ∥ 镜 2\"。出射方向相对入射方向转过的角度，正是两镜方向之间的夹角 —— 但它是 180° − α（出射光被\"折回\"到另一侧），不是 α。 δ = 2α = 180° − α 3解出 3α = 180° ⇒ α = 60° 4验算（α = 60°，镜 1 取 x 轴、镜 2 与它成 60°）：入射 (1,0) 先在镜 2 上反射得 (cos120°, sin120°)，再在镜 1 上反射得 (cos120°, −sin120°) ∝ −(½, √3/2)，恰与镜 2 的方向 (½, √3/2) 平行 ✓ 两平面镜夹角 α = 60°（此时偏向角 δ = 120°，出射光与入射光反向偏折 120°）。 易错：直接写\"δ = 2α 且 δ = α ⇒ α = 0\"是", "img": 0, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q006", "tag": "2012-2", "stem": "一束自然光由红宝石（n = 1.76）以布儒斯特角斜入射到空气中，试求界面反射率、透射率及反射光、透射光的偏振度。", "body": "", "img": 0, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q007", "tag": "2013-2", "stem": "一束自然光从玻璃垂直入射到空气，求玻璃表面的反射率。若光束以 30° 角入射，求此时的反射率和反射光的偏振度。（已知玻璃的折射率为 1.5）", "body": "", "img": 0, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q008", "tag": "2014-2", "stem": "现有一振动平面与入射面成 45° 的平面偏振光，入射到两种透明介质的分界面上，若入射角 θ1 = 30°，n1 = 1，n2 = 1.46，求（1）反射光的光矢量与入射面的夹角；（", "body": "", "img": 1, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q009", "tag": "2015-2", "stem": "一左旋圆偏振光以 50° 角入射到空气—玻璃界面上，如图所示，试分析反射光和透射光的偏振状态？（玻璃的折射率 n = 1.52）", "body": "", "img": 1, "chap": "第一章 · 光的电磁理论基础10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q010", "tag": "2009-2", "stem": "如右图所示，两束相干平行光与观察屏法线的夹角分别为 θO 和 θR，试推导确定 z = 0 处观察屏上干涉图样的形状，并求出干涉图样的周期。", "body": "", "img": 1, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q011", "tag": "2009-3", "stem": "右图为一双光束干涉实验示意图。一束波长为 λ = 10 μm、相干长度 lc = 5λ 的细光束，以 60° 角入射到厚度为 h = 10 μm、折射率为 n1 = √3 的介质片", "body": "", "img": 0, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q012", "tag": "2010-1", "stem": "如图所示，两相干平面光波其一在 xz 平面沿与 z 轴夹角 θ1 方向传播，其二在 xz 平面沿与 z 轴夹角 θ2 方向传播，试求二光波在 z = 0 平面上的干涉条纹形状和条纹", "body": "", "img": 1, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q013", "tag": "2010-5", "stem": "在杨氏双缝干涉实验装置中，双缝相距 0.5 mm，接收屏距双缝 1 m，点光源距双缝 30 cm，它发射 λ = 500 nm 的单色光。试求：（1）屏上干涉条纹的间距。（2）若点", "body": "", "img": 0, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q014", "tag": "2010-6", "stem": "在两个正交偏振器之间插入一块 λ/2 片，强度为 I0 的单色光通过这一系统。如果将波片绕光的传播方向旋转一周，问：（1）将看到几个光强的极大和极小值？相应的波片方位及光强数值；（", "body": "", "img": 1, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q015", "tag": "2011-2", "stem": "如图所示的两相干平面光波夹角 2α，在垂直于角平分线放置一观察屏，两光波在 z = 0 处，求出屏上的干涉条纹的间距和形状（波长 λ）。", "body": "1取角平分线为 z 轴（屏的法线就是它），两波对称：k1,2 = k(±sinα, 0, cosα)，屏在 z = 0 2 Δφ = (k2−k1)·r = −2k x sinα ⇒ I = 2I0[1 + cos(2k x sinα)] 3条纹间距（亮纹条件 2k x sinα = 2mπ） d = 2π2k sinα = λ2 sinα 形状：一组等间距平行直条纹（垂直于两波矢所在平面、即沿屏上 y 方向延伸）；间距 d = λ/(2sinα)。α 很小时 d ≈ λ/(2α) —— 这就是双光束干涉\"夹角越小条纹越疏\"的定量表述。", "img": 1, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q016", "tag": "2011-3", "stem": "把折射率为 1.5 的玻璃片插入杨氏干涉实验的一束光路中，光屏上中央亮条纹移动至原来第 5 级亮条纹所在位置，求插入玻璃片的厚度。已知光波长为 600 nm。", "body": "1插入玻璃片后，该束光多走的光程（几何厚度 t 换成 (n−1)t） Δ = (n − 1)t 2\"中央亮纹（零级）移到原第 5 级处\" ⇒ 附加光程差恰好等于 5 个波长 (n − 1)t = 5λ ⇒ t = 5λn−1 = 5 × 600 nm0.5 = 6000 nm = 6 μm 玻璃片厚度 t = 6 μm（此时附加光程差 3000 nm = 5λ，零级亮纹平移到原第 5 级位置）。", "img": 1, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q017", "tag": "2012-1", "stem": "如图所示，两相干平面光波其一在 xz 平面沿与 z 轴夹角 θ 方向传播，其二在 xz 平面沿 z 轴方向传播。试求该二光波在 z = 0 平面上干涉条纹的形状和间距。", "body": "1两个波矢（都在 xz 面内，与 y 无关） k1 = k(sinθ, 0, cosθ)， k2 = k(0, 0, 1)， k = 2π/λ 2相位差只由\"波矢差\"决定：Δφ = (k2 − k1)·r，在观察面 z = 0 上 r = (x, y, 0) Δφ = −k x sinθ ⇒ I = 2I0[1 + cos(k x sinθ)] 3Δφ 只随 x 变、与 y 无关 ⇒ 条纹是平行于 y 轴的直条纹（即与 xOz 面垂直的那些直条）；亮纹条件 k x sinθ = 2mπ d = 2πk sinθ = λsinθ 条纹为平行于 y 轴、等间距的直条纹，间距 d = λ/sinθ（θ 越小条纹越疏；θ→0 时两波同向，屏上不再有明暗变化）。", "img": 1, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q018", "tag": "2013-3", "stem": "如图所示，三束相干平面光波在 xOz 平面内传播，在 O 点的相位均为 0，其与 z 轴的夹角分别为 θ、0 和 −θ，振幅分别为 A、2A 和 A。求（1）xy 平面上的光强分布", "body": "", "img": 1, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q019", "tag": "2014-3", "stem": "某种放电管产生的镉红光，其中波长 λ = 644 nm，相干长度 L = 200 mm，试估计红光的线宽 Δλ 和频宽 Δν。", "body": "1相干长度与谱宽的关系 L = λ²/Δλ Δλ = λ²L = (644×10−9)²0.200 = 2.07×10−12 m ≈ 2.1×10−3 nm 2频宽（Δν = cΔλ/λ² = c/L） Δν = cL = 3×1080.200 = 1.5×109 Hz 3自检：Δν·L = 1.5×109×0.2 = 3×108 = c ✓（相干时间 τ = L/c = 6.7×10−10 s） 线宽 Δλ ≈ 2.1×10−3 nm（相对宽度 Δλ/λ ≈ 3.2×10−6）；频宽 Δν ≈ 1.5 GHz；相干时间 6.7×10−10 s。", "img": 0, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q020", "tag": "2014-5", "stem": "如图所示，在杨氏双缝实验装置中，波长为 λ 的单色平面光波入射到间距为 d 的双缝上，光屏离缝的距离为 D，把一块厚度为 t、折射率为 n 的透明薄片放在缝和屏之间，不讨论衍射效应", "body": "", "img": 1, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q021", "tag": "2015-4", "stem": "在杨氏干涉实验中，两个小孔间距为 1 mm，光源发光波长为 500 nm，离开两个小孔中点的距离为 500 mm，为了使观察屏上看到清晰条纹，求允许的光源宽度最大值，此时离开小孔 ", "body": "1光源宽度 b 在双孔处张角 b/l，空间相干宽度 = λl/b；要能看到条纹须 d < λl/b bmax = λld = 500×10−9 × 0.51×10−3 = 2.5×10−4 m = 0.25 mm 2屏上条纹间距（D = 1 m） Δx = Dλd = 1 × 500×10−91×10−3 = 0.5 mm 光源宽度最大 0.25 mm（超过则条纹对比度下降到看不清）；此时屏上条纹间距 0.5 mm。 延伸 · 点开物理含义：光源越宽，它上面各点各自产生一套条纹、彼此错开，错开量达到一个条纹间距时对比度归零（bmax = λl/d）。所以\"光源宽度上限\"与\"条纹间距\"是同一件事的两种说法。", "img": 0, "chap": "第二章 · 光的干涉12 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q022", "tag": "2009-4", "stem": "在双缝夫朗和费衍射实验中，光波长 λ = 0.532 μm，透镜的焦距 f = 50 cm，在观察屏上相邻亮条纹的间距 l = 1.5 mm，且第四级亮纹缺级，试求：（1）该双缝的", "body": "", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q023", "tag": "2010-3", "stem": "一天文望远镜的物镜直径 D = 100 mm，人眼瞳孔的直径 d = 2 mm，用该望远镜观察发射波长为 λ = 500 nm 光的物体。为充分利用物镜的分辨本领，试确定该望远镜物", "body": "1\"充分利用分辨本领\"⇒ 物镜的出射光瞳（= D/M）缩到等于人眼瞳孔 d M = Dd = 1002 = 50× 2物镜的最小分辨角 θmin = 1.22λD = 1.22 × 500×10−90.1 = 6.1×10−6 rad 31000 km 处对应的线距离 s = L θmin = 1.0×106 × 6.1×10−6 ≈ 6.1 m 放大率宜取 M = 50×（此时出瞳 2 mm，正好不浪费口径也不过剩）；1000 km 处恰能分辨的两点相距约 6.1 m。", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q024", "tag": "2010-4", "stem": "试求一宽为 5 cm、每毫米内有 400 条刻线的光栅，对于波长为 500 nm 入射光的一级角色散率。今若入射光与栅平面法线成 30° 方向斜入射，求该光栅能分辨的谱线的最小波长", "body": "", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q025", "tag": "2011-4", "stem": "电子显微镜的孔径角为 2u = 8°，电子束的波长为 10 nm，试求其最小分辨距离。若人眼在明视距离处能分辨 67 μm 的距离，则此显微镜的放大倍数是多少？", "body": "1孔径角 2u = 8° ⇒ 半孔径角 u = 4°，数值孔径 NA = sin4° = 0.0698（电子显微镜在真空中，n = 1） 2最小分辨距离 δ = 0.61λn sinu = 0.61 × 10 nmsin4° = 6.10.0698 ≈ 87 nm 3放大倍数 = 人眼能分辨的细节 / 显微镜能分辨的细节 M = 67 μm87 nm = ≈ 770× 最小分辨距离 δ ≈ 0.087 μm（87 nm）；要把这个细节放大到人眼在明视距离能分辨（67 μm），需 M ≈ 770×（再大就是\"无效放大\"）。 题面照录（不改数）：原题给\"电子束波长 10 nm\"，比真实电镜（0.001–0.01 nm）大两三个量级，但真题不改，本页照 10 nm 算：δ ≈ 87 nm、M ≈ 770×。仅作对照：若真是 10 pm，则 δ ≈ 0.087 nm、M ≈ 7.7×105。考场照题面写。", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q026", "tag": "2011-5", "stem": "用波长为 624 nm 的单色光照射缝宽为 0.012 mm、不透明部分的宽度为 0.029 mm、缝数为 1000 条的光栅，试求：（1）单缝衍射图样的中央亮纹角宽度；（2）单缝", "body": "", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q027", "tag": "2012-3", "stem": "一天文望远镜的放大倍数为 M = 50，用该望远镜观察发射波长为 λ = 500 nm 光的物体。试确定该望远镜物镜的最小直径 Dmin，设人眼瞳孔的直径 d = 2 mm。用该望", "body": "1要\"不浪费\"分辨本领，出瞳不能小于人眼瞳孔：D/M ≥ d Dmin = M d = 50 × 2 mm = 100 mm 2分辨角（按 D = 100 mm 计） θmin = 1.22500×10−90.1 = 6.1×10−6 rad 3500 km 处 s = 5.0×105 × 6.1×10−6 ≈ 3.0 m 物镜最小直径 Dmin = 100 mm（M·d = 50×2 mm）；500 km 处恰能分辨的距离约 3.0 m。 延伸 · 点开与 2010-3 对比：两题是同一组参数的正反问法（D = 100 mm ↔ M = 50）。s 正比于距离、反比于 D，所以 500 km 给出 3.05 m 正好是 1000 km 那题 6.1 m 的一半。", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q028", "tag": "2012-4", "stem": "图示 Q 为垂直光轴切割、表面平行的单轴晶片，R 为光栅常数 d = 1/600 mm 的衍射光栅，试求垂直入射的可见光（400 ~ 760 nm）由 R 出射后的一级光谱散开的角", "body": "", "img": 1, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q029", "tag": "2013-4", "stem": "已知一显微镜的数值孔径 NA = 1.32，物镜焦距 f0 = 1.91 mm，目镜焦距 fe = 50 mm，求：（1）此显微镜的最小分辨距离；（2）有效放大率；（3）光学筒长。", "body": "", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q030", "tag": "2013-6", "stem": "一块光栅面积为 5 cm×5 cm、每毫米内有 1000 条刻痕。求（1）此光栅对波长为 600 nm 光的一级角色散率；（2）比较此光栅与空气间隔为 5 cm、两镜面反射率均为 ", "body": "", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q031", "tag": "2015-5", "stem": "在双缝夫朗和费衍射实验中，所用波长 λ = 632.8 nm，透镜焦距 f = 50 cm，观察到两相邻亮条纹间距 e = 1.5 mm，且第四级亮纹缺级，试求：（1）双缝的缝距和", "body": "", "img": 0, "chap": "第三章 · 光的衍射10 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q032", "tag": "2009-5", "stem": "如图所示，一入射线偏振光的振动方向与晶片光轴方向的夹角为 θ = 26.57°，试问该光经过厚度为 0.081 mm 的晶片后，其偏振状态如何？（入射光波长 λ = 589 nm，", "body": "", "img": 1, "chap": "第四章 · 光在各向异性介质中的传播特性7 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q033", "tag": "2009-6", "stem": "图示方解石棱镜的主折射率为 n0 = 1.6408，ne = 1.4790。（1）若要使其成为格兰科棱镜工作，其直角棱镜底角 θ 应为多大？画出光自空气正入射时的传输光路及光的偏振", "body": "", "img": 1, "chap": "第四章 · 光在各向异性介质中的传播特性7 题 ·", "doc": "851 计算题 · 早年真题 Part 1（第 1–28 页）"}, {"file": "851-计算题-早年真题-合集.html", "id": "q034", "tag": "2011-7", "stem": "方解石制成的两块偏振棱镜，中间留空气隙。棱镜 1 的光轴垂直于纸面（图中 ⊙），棱镜 2 的光轴在纸面内竖直（图中 ↑），入射面为纸面。光线按图
