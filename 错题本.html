var PFX = "g851-mock2-";

function nums(s){ return String(s).split("|").map(parseFloat); }

function collect(){
  var groups = [], totalLost = 0, totalWrong = 0, papersDone = 0;
  for (var i = 0; i < IDX.length; i++){
    var P = IDX[i], raw = null;
    try { raw = JSON.parse(localStorage.getItem(PFX + P[0]) || "null"); } catch (e) {}
    if (!raw || typeof raw !== "object") continue;
    var items = P[3], rows = [], lostG = 0;
    for (var j = 0; j < items.length; j++){
      var wid = items[j][0], lab = items[j][1], ms = nums(items[j][2]);
      var rec = raw[wid];
      if (!rec || typeof rec !== "object") continue;
      var wrong = [], lost = 0, touched = 0;
      for (var k = 0; k < ms.length; k++){
        var f = rec[k];
        if (f === undefined) continue;
        touched++;
        f = parseFloat(f);
        if (f < 1){ wrong.push({ k: k, f: f }); lost += ms[k] * (1 - f); }
      }
      if (touched) papersDone |= 1;
      if (wrong.length){
        rows.push({ wid: wid, lab: lab, ms: ms, wrong: wrong, lost: lost });
        lostG += lost;
        totalWrong += wrong.length;
      }
    }
    if (!rows.length) continue;
    rows.sort(function(a, b){ return b.lost - a.lost || a.lab.localeCompare(b.lab); });
    groups.push({ key: P[0], file: P[1], title: P[2], rows: rows, lost: lostG });
    totalLost += lostG;
  }
  groups.sort(function(a, b){ return b.lost - a.lost; });
  return { groups: groups, lost: totalLost, wrong: totalWrong };
}

function partText(w){
  if (w.f === 0) return "0 分";
  return "半分";
}

function render(){
  var d = collect(), sum = document.getElementById("sum"), list = document.getElementById("list");
  if (!d.groups.length){
    sum.innerHTML = '<div class="big">还没有错题记录</div>'
      + '<div class="line">去 <a href="按年份.html">按年份</a> 做一套整卷，判完分这里就有了。</div>';
    list.innerHTML = '<div class="empty"><b>暂无错题</b>判过分之后，错的、半对的会自动收进来。</div>';
    return;
  }
  sum.innerHTML = '<div class="big">错 <b>' + d.wrong + '</b> 处　累计失 <b>'
    + (Math.round(d.lost * 10) / 10) + '</b> 分</div>'
    + '<div class="line">涉及 ' + d.groups.length + ' 套卷，按失分从高到低排。</div>';

  var html = [];
  for (var i = 0; i < d.groups.length; i++){
    var g = d.groups[i];
    html.push('<div class="grp"><div class="gh">' + esc(g.key)
      + '<span class="cnt">' + g.rows.length + ' 题 / 失 '
      + (Math.round(g.lost * 10) / 10) + ' 分</span>'
      + '<a class="pr" href="' + esc(g.file) + '?wrong=1">只练这卷 →</a>'
      + '<button class="clr" data-k="' + esc(g.key) + '">清空</button></div>');
    for (var j = 0; j < g.rows.length; j++){
      var r = g.rows[j], subs = [];
      for (var t = 0; t < r.wrong.length; t++){
        var w = r.wrong[t];
        subs.push((r.ms.length > 1 ? "第 " + (w.k + 1) + " 小问 " : "") + partText(w)
          + "（−" + (Math.round(r.ms[w.k] * (1 - w.f) * 10) / 10) + "）");
      }
      html.push('<a class="it" href="' + esc(g.file) + '?wrong=1#' + esc(r.wid) + '">'
        + '<span class="lost">失 ' + (Math.round(r.lost * 10) / 10) + ' 分</span>'
        + '<span class="no">' + esc(r.lab) + '</span>'
        + '<span class="pl"></span>'
        + '<span class="sub2">' + esc(subs.join("；")) + '</span></a>');
    }
    html.push('</div>');
  }
  list.innerHTML = html.join("");

  list.querySelectorAll(".clr").forEach(function(b){
    b.onclick = function(ev){
      ev.preventDefault();
      var k = this.getAttribute("data-k");
      if (!confirm("清空「" + k + "」的判分记录？其他卷不受影响。")) return;
      try { localStorage.removeItem(PFX + k); } catch (e) {}
      render();
    };
  });
}

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

document.getElementById("exp").onclick = function(){
  var d = collect();
  if (!d.groups.length){ alert("还没有错题记录。"); return; }
  var out = ["851 错题清单　" + new Date().toLocaleString(), ""];
  for (var i = 0; i < d.groups.length; i++){
    var g = d.groups[i];
    out.push("【" + g.key + "】失 " + (Math.round(g.lost * 10) / 10) + " 分");
    for (var j = 0; j < g.rows.length; j++){
      var r = g.rows[j], subs = [];
      for (var t = 0; t < r.wrong.length; t++){
        var w = r.wrong[t];
        subs.push((r.ms.length > 1 ? "第" + (w.k + 1) + "小问" : "") + partText(w));
      }
      out.push("  " + r.lab + "　" + subs.join("、"));
    }
    out.push("");
  }
  var blob = new Blob([out.join("\n")], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "851错题清单.txt";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
};

document.getElementById("clr").onclick = function(){
  if (!confirm("清除全部错题记录？（各整卷的判分进度也会一起清掉）")) return;
  var ks = [];
  try {
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (k && k.indexOf(PFX) === 0) ks.push(k);
    }
  } catch (e) {}
  for (var j = 0; j < ks.length; j++) { try { localStorage.removeItem(ks[j]); } catch (e) {} }
  render();
};

render();

   if(ew+margin*2>W||ew+margin*2>H)continue;
   for(var attempt=0;attempt<360;attempt++){
    var cx=ew/2+margin+rand()*(W-ew-2*margin);
    var cy=ew/2+margin+rand()*(H-ew-2*margin);
    rect={l:cx-ew/2,t:cy-ew/2,r:cx+ew/2,b:cy+ew/2};
    if(!boxes.some(function(b){return collision(rect,b,22)})){found={x:cx-w/2,y:cy-h/2};break;}
   }
   if(!found)continue;
   boxes.push(rect);
   var kind=Math.floor(rand()*N);
   var el=document.createElement('div');el.className='naiwa';
   el.style.left=found.x.toFixed(2)+'px';el.style.top=found.y.toFixed(2)+'px';
   el.style.width=w.toFixed(2)+'px';el.style.height=h.toFixed(2)+'px';
   el.style.setProperty('--angle',angle.toFixed(1)+'deg');
   el.style.setProperty('--speed',(6+rand()*6).toFixed(2)+'s');
   el.style.setProperty('--delay',(-rand()*11).toFixed(2)+'s');
   var fl=document.createElement('div');fl.className='naiwa-float';
   var reaction=document.createElement('div');reaction.className='naiwa-react';
   var face=document.createElement('div');face.className='naiwa-face';
   face.style.setProperty('--atlas-scale',(N*100)+'%');
   face.style.setProperty('--sprite-pos',(N===1?0:100*kind/(N-1)).toFixed(4)+'%');
   reaction.appendChild(face);
   var pupil=null;
   // 只有主造型经过眼部坐标校准。其余新增造型不会被错误套上瞳孔。
   if(kind===0){pupil=document.createElement('div');pupil.className='naiwa-eye';reaction.appendChild(pupil)}
   fl.appendChild(reaction);el.appendChild(fl);layer.appendChild(el);
   sprites.push({el:el,react:reaction,pupil:pupil});
  }
 }
 window.addEventListener('resize',function(){if(resizeJob)cancelAnimationFrame(resizeJob);
  resizeJob=requestAnimationFrame(function(){resizeJob=0;relayout()})},{passive:true});
 document.addEventListener('pointermove',function(e){
  if(focus.checked||!eyes.checked||reduced||e.pointerType==='touch')return;
  mouse={x:e.clientX,y:e.clientY};
  if(eyeJob)return;
  eyeJob=requestAnimationFrame(function(){eyeJob=0;if(!mouse)return;
   for(var s of sprites){if(!s.pupil)continue;var r=s.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var dx=mouse.x-cx,dy=mouse.y-cy,dist=Math.hypot(dx,dy),a=dist<1?0:clamp(dist/250,0,1);
    var max=clamp(r.width*.04,2,5);
    s.pupil.style.setProperty('--look-x',(max*a*dx/Math.max(1,dist)).toFixed(2)+'px');
    s.pupil.style.setProperty('--look-y',(max*a*dy/Math.max(1,dist)).toFixed(2)+'px');
   }
  });
 },{passive:true});
 var reactions=['bop','wiggle','puff','jump'];
 document.addEventListener('pointerdown',function(e){
  if(focus.checked||reduced||!motion.checked)return;
  if(e.target.closest('a,button,input,select,textarea,label,[role="button"],[contenteditable="true"]'))return;
  for(var j=sprites.length-1;j>=0;j--){
   var s=sprites[j],r=s.el.getBoundingClientRect();
   if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
    s.react.classList.remove(...reactions);void s.react.offsetWidth;
    var reaction=reactions[Math.floor(Math.random()*reactions.length)];
    s.react.classList.add(reaction);
    (function(el,name){setTimeout(function(){el.classList.remove(name)},650)})(s.react,reaction);
    break;
   }
  }
 },{passive:true});
 relayout();
})();
</script>
