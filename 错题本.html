var PFX = "g851-mock2-";

function nums(s){ return String(s).split("|").map(parseFloat); }

function collect(){
  var groups = [], totalLost = 0, totalWrong = 0, papersDone = 0;
  for (var i = 0; i < IDX.length; i++){
    var P = IDX[i], raw = null;
    try { raw = JSON.parse(localStorage.getItem(PFX + P[0]) || "null"); } catch (e) {}
    if (!raw || typeof raw !== "object") continue;
    var items = P[3], rows = [], lostG = 0;
    for (var j = 0; j < items.length; j++){
      var wid = items[j][0], lab = items[j][1], ms = nums(items[j][2]);
      var rec = raw[wid];
      if (!rec || typeof rec !== "object") continue;
      var wrong = [], lost = 0, touched = 0;
      for (var k = 0; k < ms.length; k++){
        var f = rec[k];
        if (f === undefined) continue;
        touched++;
        f = parseFloat(f);
        if (f < 1){ wrong.push({ k: k, f: f }); lost += ms[k] * (1 - f); }
      }
      if (touched) papersDone |= 1;
      if (wrong.length){
        if (window.G851WR && G851WR.has(P[1], wid)) continue;
        rows.push({ wid: wid, lab: lab, ms: ms, wrong: wrong, lost: lost });
        lostG += lost;
        totalWrong += wrong.length;
      }
    }
    if (!rows.length) continue;
    rows.sort(function(a, b){ return b.lost - a.lost || a.lab.localeCompare(b.lab); });
    groups.push({ key: P[0], file: P[1], title: P[2], rows: rows, lost: lostG });
    totalLost += lostG;
  }
  groups.sort(function(a, b){ return b.lost - a.lost; });
  return { groups: groups, lost: totalLost, wrong: totalWrong };
}

function partText(w){
  if (w.f === 0) return "0 分";
  return "半分";
}

  if (!d.groups.length){
    sum.innerHTML = '<div class="big">还没有错题记录</div>'
      + '<div class="line">去 <a href="按年份.html">按年份</a> 做一套整卷，判完分这里就有了。</div>';
    list.innerHTML = '<div class="empty"><b>暂无错题</b>判过分之后，错的、半对的会自动收进来。</div>';
    return;
  }
  var rmN = window.G851WR ? G851WR.count() : 0;
  sum.innerHTML = '<div class="big">错 <b>' + d.wrong + '</b> 处　累计失 <b>'
    + (Math.round(d.lost * 10) / 10) + '</b> 分'
    + (rmN ? '　<span class="rmn">已订正 ' + rmN + ' 题（分数记录未变）</span>' : '')
    + '</div>'
    + '<div class="line">涉及 ' + d.groups.length + ' 套卷，按失分从高到低排。'
    + (rmN ? '订正过的不再显示，可在下方恢复。' : '') + '</div>';

  var html = [];
  for (var i = 0; i < d.groups.length; i++){
    var g = d.groups[i];
    html.push('<div class="grp"><div class="gh">' + esc(g.key)
      + '<span class="cnt">' + g.rows.length + ' 题 / 失 '
      + (Math.round(g.lost * 10) / 10) + ' 分</span>'
      + '<a class="pr" href="' + esc(g.file) + '?wrong=1">只练这卷 →</a>'
      + '<button class="clr" data-k="' + esc(g.key) + '">清空</button></div>');
    for (var j = 0; j < g.rows.length; j++){
      var r = g.rows[j], subs = [];
      for (var t = 0; t < r.wrong.length; t++){
        var w = r.wrong[t];
        subs.push((r.ms.length > 1 ? "第 " + (w.k + 1) + " 小问 " : "") + partText(w)
          + "（−" + (Math.round(r.ms[w.k] * (1 - w.f) * 10) / 10) + "）");
      }
      html.push('<div class="itwrap"><a class="it" href="' + esc(g.file) + '?wrong=1#' + esc(r.wid) + '">'
        + '<span class="lost">失 ' + (Math.round(r.lost * 10) / 10) + ' 分</span>'
        + '<span class="no">' + esc(r.lab) + '</span>'
        + '<span class="pl"></span>'
        + '<span class="sub2">' + esc(subs.join("；")) + '</span></a>'
        + '<span class="aiwrap"><button class="rm" type="button" data-f="' + esc(g.file) + '" data-w="'
        + esc(r.wid) + '" title="我从错题本移除（分数记录保留）">订正</button>'
        + '<button class="ai g851-ai-btn" type="button" data-ai-tag="' + esc(r.lab)
        + '" data-ai-lost="' + (Math.round(r.lost * 10) / 10) + '" data-ai-sub="' + esc(subs.join("；"))
        + '">AI 分析</button></span></div>');
    }
    html.push('</div>');
  }
  list.innerHTML = html.join("");

  bindAi();
  list.querySelectorAll(".rm").forEach(function(b){
    b.onclick = function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var f = this.getAttribute("data-f"), w = this.getAttribute("data-w");
      if (!confirm("把这题从错题本移除？（已判的分不退回，分数记录里照旧）")) return;
      if (window.G851WR) G851WR.add(f, w);
      render();
    };
  });
  renderRemoved();
  list.querySelectorAll(".clr").forEach(function(b){
    b.onclick = function(ev){
      ev.preventDefault();
      var k = this.getAttribute("data-k");
      if (!confirm("清空「" + k + "」的判分记录？其他卷不受影响。")) return;
      try { localStorage.removeItem(PFX + k); } catch (e) {}
      render();
    };
  });
}

function renderRemoved(){
  var box = document.getElementById("removed");
  if (!box) return;
  var rows = window.G851WR ? G851WR.list() : [];
  if (!rows.length) { box.innerHTML = ""; return; }
  rows.sort(function(a, b){ return a.at < b.at ? 1 : -1; });
  var h = ['<div class="grp" style="border-style:dashed"><div class="gh" style="background:#fcfaf7">'
    + '已订正（分数记录保留）<span class="cnt">' + rows.length + ' 题</span>'
    + '<button class="rstall" type="button">全部恢复</button></div>'];
  rows.forEach(function(r){
    h.push('<div class="itwrap" style="border-top:1px solid #f3eee6"><span class="it" style="flex:1">'
      + '<span class="no">' + esc(r.wid) + '</span>'
      + '<span class="pl">' + esc(String(r.file).replace(/\.html$/, "")) + '</span>'
      + '<span class="sub2">订正于 ' + esc(r.at) + '</span></span>'
      + '<span class="aiwrap"><button class="rst" type="button" data-f="' + esc(r.file)
      + '" data-w="' + esc(r.wid) + '">恢复</button></span></div>');
  });
  h.push("</div>");
  box.innerHTML = h.join("");
  box.querySelectorAll(".rst").forEach(function(b){
    b.onclick = function(){
      if (window.G851WR) G851WR.del(this.getAttribute("data-f"), this.getAttribute("data-w"));
      render();
    };
  });
  var all = box.querySelector(".rstall");
  if (all) all.onclick = function(){
    if (!confirm("恢复全部已订正的题？")) return;
    if (window.G851WR) G851WR.clear();
    render();
  };
}

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* AI 分析交给共用模块 ai-common.js：这里只负责在渲染后绑定按钮 */
function bindAi() {
  if (window.G851AI) window.G851AI.bind(list);
  else setTimeout(bindAi, 200);
}

render();
</script>

<script>
/* G851_RAIL_JS */
(function(){
  var el = document.getElementById('g851-rail');
  if (!el || el.getAttribute('data-init')) return;
  el.setAttribute('data-init', '1');
  var tab = el.querySelector('.tab'), openT = null, closeT = null;
  function open(){ clearTimeout(closeT); el.classList.add('open'); tab.setAttribute('aria-expanded','1'); }
  function close(){ el.classList.remove('open'); tab.setAttribute('aria-expanded','0'); }
  tab.addEventListener('mouseenter', function(){
    clearTimeout(openT);
    openT = setTimeout(function(){ if (tab.matches(':hover')) open(); }, 150);
  });
  tab.addEventListener('mouseleave', function(){ clearTimeout(openT); });
  el.addEventListener('mouseleave', function(){ closeT = setTimeout(close, 350); });
  el.addEventListener('mouseenter', function(){ clearTimeout(closeT); });
  tab.addEventListener('click', function(e){
    e.stopPropagation();
    if (el.classList.contains('open')) close(); else open();
  });
  document.addEventListener('click', function(e){ if (!el.contains(e.target)) close(); });
  window.addEventListener('scroll', function(){ close(); }, {passive:true});
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') close();
    else if (e.key === '?' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) {
      e.preventDefault(); el.classList.contains('open') ? close() : open();
    }
  });
  var here = decodeURIComponent((location.pathname.split('/').pop() || 'index.html'));
  Array.prototype.forEach.call(el.querySelectorAll('a'), function(a){
    if (a.getAttribute('href') === here) a.classList.add('cur');
  });
  var parts = (document.title || '').split('·').map(function(s){ return s.replace(/^851\s*/, '').trim(); })
    .filter(function(s){ return s && s !== '851'; });
  el.querySelector('.cur-page').textContent = parts[0] || here;

  /* ── 新版本提示 / 离线提示 ── */
  (function () {
    function toast(msg, actionText, onClick, ms) {
      var d = document.createElement('div');
      d.id = 'g851-toast';
      var s = document.createElement('span');
      s.textContent = msg;
      d.appendChild(s);
      if (actionText) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = actionText;
        b.addEventListener('click', onClick);
        d.appendChild(b);
      }
      document.body.appendChild(d);
      setTimeout(function () { d.classList.add('on'); }, 30);
      if (ms) setTimeout(function () {
        d.classList.remove('on');
        setTimeout(function () { d.parentNode && d.parentNode.removeChild(d); }, 300);
      }, ms);
    }
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      if (navigator.serviceWorker.controller) {
        var fired = 0;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (fired) return;
          fired = 1;
          toast('库已更新到新版本', '刷新', function () { location.reload(); }, 15000);
        });
      }
    }
    var off = null;
    function refreshOffline() {
      if (navigator.onLine) {
        if (off && off.parentNode) { off.parentNode.removeChild(off); off = null; }
      } else if (!off) {
        off = document.createElement('div');
        off.id = 'g851-offline';
        off.textContent = '离线中 · 已缓存的内容仍可看';
        document.body.appendChild(off);
      }
    }
    window.addEventListener('online', refreshOffline);
    window.addEventListener('offline', refreshOffline);
    refreshOffline();
  })();

  /* ── 返回上一页 ── */
  (function () {
    var b = document.createElement('button');
    b.id = 'g851-back'; b.type = 'button'; b.title = '返回上一页'; b.textContent = '←';
    b.setAttribute('aria-label', '返回上一页');
    b.addEventListener('click', function () {
      if (window.history.length > 1) window.history.back();
      else location.href = 'index.html';
    });
    document.body.appendChild(b);
  })();

  /* ── 夜间模式 ── */
  var darkBtn = document.getElementById('g851-dark');
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function paintDark(){
    if (!darkBtn) return;
    darkBtn.textContent = isDark() ? '☀ 日间' : '☾ 夜间';
    darkBtn.classList.toggle('on', isDark());
  }
  function setDark(on){
    if (on) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('g851-theme', on ? 'dark' : 'light'); } catch(e){}
    paintDark();
  }
  if (darkBtn) {
    paintDark();
    darkBtn.addEventListener('click', function(e){ e.stopPropagation(); setDark(!isDark()); });
  }

  /* ── 字号档 ── */
  var fsBtns = el.querySelectorAll('.fsz button');
  function curFs(){ return document.documentElement.getAttribute('data-fs') || 'm'; }
  function paintFs(){
    Array.prototype.forEach.call(fsBtns, function(b){
      b.classList.toggle('on', b.getAttribute('data-fs') === curFs());
    });
  }
  Array.prototype.forEach.call(fsBtns, function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var v = b.getAttribute('data-fs');
      if (v === 'm') document.documentElement.removeAttribute('data-fs');
      else document.documentElement.setAttribute('data-fs', v);
      try { localStorage.setItem('g851-fs', v); } catch(err){}
      paintFs();
    });
  });
  paintFs();
})();
</script>

    if(ec.mask){
     if(ec.colors){socket.style.setProperty('--iris-light',ec.colors[0]);socket.style.setProperty('--iris-mid',ec.colors[1]);socket.style.setProperty('--iris-dark',ec.colors[2]);}
     mover=document.createElement('span');mover.className='naiwa-eye-dot';
     mover.style.width=(ec.pupilW||56)+'%';mover.style.height=(ec.pupilH||56)+'%';
     socket.appendChild(mover);
    }
    reaction.appendChild(socket);eyeParts.push({anchor:socket,mover:mover,masked:!!ec.mask});
   }
   fl.appendChild(reaction);el.appendChild(fl);layer.appendChild(el);
   sprites.push({el:el,react:reaction,eyes:eyeParts});
  }
 }
 function scheduleRelayout(){
  if(resizeJob)cancelAnimationFrame(resizeJob);
  resizeJob=requestAnimationFrame(function(){resizeJob=0;relayout();});
 }
 window.addEventListener('resize',scheduleRelayout,{passive:true});
 window.addEventListener('pageshow',scheduleRelayout);
 if(window.ResizeObserver){
  var main=document.querySelector('body > .wrap,body > .wr,body > main,body > article');
  if(main){var ro=new ResizeObserver(scheduleRelayout);ro.observe(main);}
 }
 document.addEventListener('pointermove',function(e){
  if(focus.checked||!eyes.checked||reduced||e.pointerType==='touch')return;
  mouse={x:e.clientX,y:e.clientY};
  if(eyeJob)return;
  eyeJob=requestAnimationFrame(function(){eyeJob=0;if(!mouse)return;
   for(var s of sprites){
    var sr=s.el.getBoundingClientRect();
    for(var eye of s.eyes){
     var r=eye.anchor.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
     var dx=mouse.x-cx,dy=mouse.y-cy,dist=Math.hypot(dx,dy),a=dist<1?0:clamp(dist/250,0,1);
     var max=clamp(sr.width*.04,2,5);
     // 双眼瞳孔不能离开绿色眼眶；单眼保持旧版幅度。
     if(eye.masked)max=Math.min(max,Math.min(r.width,r.height)*.16);
     eye.mover.style.setProperty('--look-x',(max*a*dx/Math.max(1,dist)).toFixed(2)+'px');
     eye.mover.style.setProperty('--look-y',(max*a*dy/Math.max(1,dist)).toFixed(2)+'px');
    }
   }
  });
 },{passive:true});
 var reactions=['bop','wiggle','puff','jump'];
 document.addEventListener('pointerdown',function(e){
  if(focus.checked||reduced||!motion.checked)return;
  if(e.target.closest('a,button,input,select,textarea,label,[role="button"],[contenteditable="true"]'))return;
  for(var j=sprites.length-1;j>=0;j--){
   var s=sprites[j],r=s.el.getBoundingClientRect();
   if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
    s.react.classList.remove(...reactions);void s.react.offsetWidth;
    var reaction=reactions[Math.floor(Math.random()*reactions.length)];
    s.react.classList.add(reaction);
    (function(el,name){setTimeout(function(){el.classList.remove(name)},650)})(s.react,reaction);
    break;
   }
  }
 },{passive:true});
 relayout();
})();
</script>
