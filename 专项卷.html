function jget(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fnv(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

/* ---- 读取本机进度 ---- */
var WRONG = {}, MASTER = {};
try {
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (!k) continue;
    if (k.indexOf("g851-mock2-") === 0) {
      var ob = JSON.parse(localStorage.getItem(k) || "null");
      if (ob && typeof ob === "object") {
        for (var id in ob) {
          var rec = ob[id];
          if (!rec || typeof rec !== "object") continue;
          for (var p in rec) { if (parseFloat(rec[p]) < 1) { WRONG[id] = 1; break; } }
        }
      }
    } else if (/mastered$/.test(k) || k === "g851-zhenti-2526" || k === "g851-appo-qa-p4956") {
      var m = JSON.parse(localStorage.getItem(k) || "null");
      if (m && typeof m === "object") Object.keys(m).forEach(function(t){ MASTER[t] = 1; });
    }
  }
} catch (e) {}

function tierOf(d) {
  if (WRONG[d.w]) return 0;
  if (d.y >= RECENT && !MASTER[d.t]) return 1;
  if (!MASTER[d.t]) return 2;
  return 3;
}

/* ---- 选题：三层 + 同考点最多 2 题 ---- */
function pick(n, seed) {
  var pool = DATA.map(function (d) { return { d: d, tier: tierOf(d), r: fnv(seed + d.t) }; });
  pool.sort(function (a, b) { return a.tier - b.tier || b.d.y - a.d.y || a.r - b.r; });
  var cap = {}, out = [], used = {};
  for (var i = 0; i < pool.length && out.length < n; i++) {
    var d = pool[i].d;
    if (used[d.t]) continue;
    var key = d.f + "|" + d.s;
    if ((cap[key] || 0) >= 2) continue;
    cap[key] = (cap[key] || 0) + 1;
    used[d.t] = 1;
    out.push(d);
  }
  out.sort(function (a, b) { return b.y - a.y || String(a.t).localeCompare(String(b.t)); });
  return out;
}

var N = 10, items = [], rec = { items: [], sc: {} };

function loadState() {
  var saved = jget(KEY);
  if (saved && saved.items && saved.items.length) {
    var byTag = {};
    DATA.forEach(function (d) { byTag[d.t] = d; });
    var keep = saved.items.map(function (t) { return byTag[t]; }).filter(Boolean);
    if (keep.length) {
      items = keep; rec = saved; return true;
    }
  }
  return false;
}

function regen(force) {
  if (!force && loadState()) return;
  var seed = TODAY + "|" + N + "|" + Math.random().toString(36).slice(2, 8);
  items = pick(N, seed);
  rec = { items: items.map(function (d) { return d.t; }), sc: {} };
  save();
}

function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} }

function paint() {
  var got = 0, max = 0, done = 0;
  items.forEach(function (d) {
    var ms = d.p.split("|").map(parseFloat), r = rec.sc[d.t];
    max += d.mx;
    if (!r) return;
    var c = 0;
    for (var i = 0; i < ms.length; i++) {
      if (r[i] !== undefined) { got += ms[i] * parseFloat(r[i]); c++; }
    }
    if (c === ms.length) done++;
  });
  var s = "得分 <b>" + (Math.round(got * 10) / 10) + "</b>/" + max + "　判完 <b>" + done + "</b>/" + items.length;
  if (done === items.length && items.length) {
    var rate = got / max;
    s += "　得分率 <b>" + Math.round(rate * 100) + "%</b>";
  }
  document.getElementById("sc").innerHTML = s;
}

/* 顶栏是静态 HTML，只由 paint 更新分数；计时器只绑一次，避免判分时把定时器冲掉 */
var t0 = 0, tm = null;
function wireTimer() {
  var el = document.getElementById("clk");
  function tick() {
    var s = Math.floor((Date.now() - t0) / 1000);
    el.textContent = ("0" + Math.floor(s / 60)).slice(-2) + ":" + ("0" + (s % 60)).slice(-2);
  }
  if (t0) tick();
  document.getElementById("tgo").onclick = function () {
    if (tm) { clearInterval(tm); tm = null; this.textContent = "继续"; return; }
    if (!t0) t0 = Date.now();
    this.textContent = "暂停"; tm = setInterval(tick, 1000); tick();
  };
  document.getElementById("treset").onclick = function () {
    clearInterval(tm); tm = null; t0 = 0; el.textContent = "00:00";
    document.getElementById("tgo").textContent = "开始计时";
  };
}

function mockLink(d) {
  if (d.y >= 2009 && d.y <= 2026) return "模拟-" + d.y + ".html#" + d.w;
  return "按年份.html";
}

function render() {
  var list = document.getElementById("list"), h = [];
  var cnt = { 0: 0, 1: 0, 2: 0, 3: 0 };
  items.forEach(function (d) { cnt[tierOf(d)]++; });

  document.getElementById("why").innerHTML =
    "本次 " + items.length + " 题：<b>错题 " + cnt[0] + "</b> · 近三年未掌握 " + cnt[1]
    + " · 早期未掌握 " + cnt[2] + (cnt[3] ? " · 兜底已掌握 " + cnt[3] : "")
    + "　（同考点最多 2 题）";

  items.forEach(function (d, idx) {
    var ms = d.p.split("|").map(parseFloat), r = rec.sc[d.t] || {};
    h.push('<div class="q"><div class="hd"><span class="no">' + (idx + 1) + "</span>"
      + '<span class="ti">' + esc(d.ti || d.t) + "</span>"
      + '<span class="meta">' + d.y + " · " + d.mx + " 分</span></div>"
      + '<div class="st">' + esc(d.st) + "</div>"
      + '<span class="sec">' + esc(d.d + " · " + d.s) + "</span>");
    for (var i = 0; i < ms.length; i++) {
      var lab = ms.length > 1 ? "（" + (i + 1) + "）" : "";
      h.push('<div class="prow"><span class="pl">' + lab + Math.round(ms[i] * 10) / 10 + " 分</span>"
        + '<button class="sb" data-t="' + esc(d.t) + '" data-p="' + i + '" data-f="1">满分</button>'
        + '<button class="sb" data-t="' + esc(d.t) + '" data-p="' + i + '" data-f="0.5">半分</button>'
        + '<button class="sb" data-t="' + esc(d.t) + '" data-p="' + i + '" data-f="0">0</button>'
        + (i === 0 ? '<a class="lnk" href="' + esc(mockLink(d)) + '">看题/答案 &rarr;</a>' : "")
        + "</div>");
    }
    h.push("</div>");
  });
  list.innerHTML = h.join("");

  list.querySelectorAll(".sb").forEach(function (b) {
    var t = b.getAttribute("data-t"), p = b.getAttribute("data-p");
    var f = (rec.sc[t] || {})[p];
    if (f !== undefined && parseFloat(f) === parseFloat(b.getAttribute("data-f"))) b.classList.add("sel");
    b.onclick = function () {
      if (!rec.sc[t]) rec.sc[t] = {};
      rec.sc[t][p] = parseFloat(b.getAttribute("data-f"));
      save();
      b.parentNode.querySelectorAll('.sb[data-p="' + p + '"]').forEach(function (x) { x.classList.remove("sel"); });
      b.classList.add("sel");
      paint();
    };
  });
  paint();
}

document.querySelectorAll(".setup button[data-n]").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".setup button[data-n]").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    N = parseInt(b.getAttribute("data-n"), 10);
    regen(true); render();
  };
});
document.getElementById("regen").onclick = function () { regen(true); render(); };

regen(false);
document.getElementById("today").textContent = TODAY;
wireTimer();
render();
</script>

<script>
/* G851_RAIL_JS */
(function(){
  var el = document.getElementById('g851-rail');
  if (!el || el.getAttribute('data-init')) return;
  el.setAttribute('data-init', '1');
  var tab = el.querySelector('.tab'), openT = null, closeT = null;
  function open(){ clearTimeout(closeT); el.classList.add('open'); tab.setAttribute('aria-expanded','1'); }
  function close(){ el.classList.remove('open'); tab.setAttribute('aria-expanded','0'); }
  tab.addEventListener('mouseenter', function(){
    clearTimeout(openT);
    openT = setTimeout(function(){ if (tab.matches(':hover')) open(); }, 150);
  });
  tab.addEventListener('mouseleave', function(){ clearTimeout(openT); });
  el.addEventListener('mouseleave', function(){ closeT = setTimeout(close, 350); });
  el.addEventListener('mouseenter', function(){ clearTimeout(closeT); });
  tab.addEventListener('click', function(e){
    e.stopPropagation();
    if (el.classList.contains('open')) close(); else open();
  });
  document.addEventListener('click', function(e){ if (!el.contains(e.target)) close(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') close();
    else if (e.key === '?' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) {
      e.preventDefault(); el.classList.contains('open') ? close() : open();
    }
  });
  var here = decodeURIComponent((location.pathname.split('/').pop() || 'index.html'));
  Array.prototype.forEach.call(el.querySelectorAll('a'), function(a){
    if (a.getAttribute('href') === here) a.classList.add('cur');
  });
  var parts = (document.title || '').split('·').map(function(s){ return s.replace(/^851\s*/, '').trim(); })
    .filter(function(s){ return s && s !== '851'; });
  el.querySelector('.cur-page').textContent = parts[0] || here;
})();
</script>

<script id="g851-bg-js">/* G851_BG_V3 */
(function(){'use strict';
 if(window.__g851NaiwaV3)return;
 window.__g851NaiwaV3=true;

  val=document.getElementById('g851-bgv'),motion=document.getElementById('g851-bgm'),
  eyes=document.getElementById('g851-bge'),focus=document.getElementById('g851-bgf'),
  reset=document.getElementById('g851-bgr');
 var N=5,sprites=[],lastW=0,lastH=0,resizeJob=0,eyeJob=0,mouse=null;

 }

 motion.checked=(get(KM)!=='0')&&!reduced;
 eyes.checked=(get(KE)!=='0')&&!reduced;
 focus.checked=get(KF)===null?defaultFocus:get(KF)==='1';
 apply();

 motion.addEventListener('change',function(){apply();put(KM,motion.checked?'1':'0')});

  focus.checked=defaultFocus;apply();put(K,12);put(KM,motion.checked?'1':'0');put(KE,eyes.checked?'1':'0');
  try{localStorage.removeItem(KF)}catch(e){}});
 btn.addEventListener('click',function(){var on=panel.classList.toggle('on');btn.setAttribute('aria-expanded',String(on))});
 document.addEventListener('click',function(e){if(!panel.contains(e.target)){panel.classList.remove('on');btn.setAttribute('aria-expanded','false')}});
 function rng(seed){return function(){seed|=0;seed=seed+0x6d2b79f5|0;
  var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;

 function collision(a,b,gap){return a.l<b.r+gap&&a.r+gap>b.l&&a.t<b.b+gap&&a.b+gap>b.t;}
 function relayout(){
  var W=innerWidth,H=innerHeight;
  if(W<180||H<180)return;
  if(Math.abs(lastW-W)<10&&Math.abs(lastH-H)<10&&sprites.length)return;
  lastW=W;lastH=H;layer.textContent='';sprites=[];
  var rand=rng(20261116+Math.floor(W/24)*711+Math.floor(H/24)*137),boxes=[];
  // 比旧版本稍密，但严格避让；空间不足就跳过，不强行重叠。
  var count=clamp(Math.round(W*H/60000),6,30);
  for(var i=0;i<count;i++){
   var w=clamp((W<650?60:84)+rand()*(W<650?31:52),54,140),h=w;
   var angle=(rand()-.5)*52;
   if(rand()<.1)angle+=(rand()<.5?85:-85);
   var a=angle*Math.PI/180,ew=w*(Math.abs(Math.cos(a))+Math.abs(Math.sin(a)));
   var margin=16,found=null,rect;
   if(ew+margin*2>W||ew+margin*2>H)continue;
   for(var attempt=0;attempt<360;attempt++){

    var cy=ew/2+margin+rand()*(H-ew-2*margin);

   var fl=document.createElement('div');fl.className='naiwa-float';
   var reaction=document.createElement('div');reaction.className='naiwa-react';
   var face=document.createElement('div');face.className='naiwa-face';
   face.style.setProperty('--atlas-scale',(N*100)+'%');
   face.style.setProperty('--sprite-pos',(N===1?0:100*kind/(N-1)).toFixed(4)+'%');
   reaction.appendChild(face);
   var pupil=null;
   // 只有主造型经过眼部坐标校准。其余新增造型不会被错误套上瞳孔。
   if(kind===0){pupil=document.createElement('div');pupil.className='naiwa-eye';reaction.appendChild(pupil)}

 }
 window.addEventListener('resize',function(){if(resizeJob)cancelAnimationFrame(resizeJob);

  if(focus.checked||!eyes.checked||reduced||e.pointerType==='touch')return;
  mouse={x:e.clientX,y:e.clientY};
  if(eyeJob)return;
  eyeJob=requestAnimationFrame(function(){eyeJob=0;if(!mouse)return;
   for(var s of sprites){if(!s.pupil)continue;var r=s.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var dx=mouse.x-cx,dy=mouse.y-cy,dist=Math.hypot(dx,dy),a=dist<1?0:clamp(dist/250,0,1);
    var max=clamp(r.width*.04,2,5);
    s.pupil.style.setProperty('--look-x',(max*a*dx/Math.max(1,dist)).toFixed(2)+'px');
    s.pupil.style.setProperty('--look-y',(max*a*dy/Math.max(1,dist)).toFixed(2)+'px');
   }
  });
 },{passive:true});
 var reactions=['bop','wiggle','puff','jump'];
 document.addEventListener('pointerdown',function(e){
  if(focus.checked||reduced||!motion.checked)return;
  if(e.target.closest('a,button,input,select,textarea,label,[role="button"],[contenteditable="true"]'))return;
  for(var j=sprites.length-1;j>=0;j--){
   var s=sprites[j],r=s.el.getBoundingClientRect();
   if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
    s.react.classList.remove(...reactions);void s.react.offsetWidth;
    var reaction=reactions[Math.floor(Math.random()*reactions.length)];
    s.react.classList.add(reaction);
    (function(el,name){setTimeout(function(){el.classList.remove(name)},650)})(s.react,reaction);
    break;
   }
  }
 },{passive:true});
 relayout();
})();
</script>
